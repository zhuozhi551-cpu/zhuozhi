<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLBOF | Human-Centric Safety Infrastructure</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f3f4f6; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
        .animate-pulse-slow { animation: pulse-slow 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-[#090d16] text-gray-100 min-h-screen selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('simulator'); // simulator, biosensor, architecture, constitution, join
            const [mode, setMode] = useState('normal'); // normal, intense, crisis
            const [jScore, setJScore] = useState(91.2);
            const [stage, setStage] = useState('STAGE_0_NORMAL (定常見守り)');

            // PPGシミュレーションデータ
            const [bpm, setBpm] = useState(72);
            const [hrv, setHrv] = useState(58);
            const [isMeasuring, setIsMeasuring] = useState(false);

            useEffect(() => {
                if (mode === 'normal') {
                    setJScore(91.2);
                    setStage('STAGE_0_NORMAL (定常見守り)');
                } else if (mode === 'intense') {
                    setJScore(76.5);
                    setStage('STAGE_1_SOFT_BUFFER (意図確認バッファ)');
                } else if (mode === 'crisis') {
                    setJScore(32.1);
                    setStage('STAGE_2_HARD_OVERRIDE (緊急退避・保護)');
                }
            }, [mode]);

            // カメラPPGの模擬計測
            useEffect(() => {
                let interval;
                if (isMeasuring) {
                    interval = setInterval(() => {
                        setBpm(prev => Math.floor(68 + Math.random() * 10));
                        setHrv(prev => Math.floor(52 + Math.random() * 15));
                    }, 1200);
                }
                return () => clearInterval(interval);
            }, [isMeasuring]);

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="border-b border-gray-800 bg-[#0d1322]/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center space-x-3">
                            <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-bold text-black text-lg">Ω</div>
                            <span className="font-bold text-xl tracking-wider text-white">OpenLBOF</span>
                            <span className="text-xs px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">OBC Official</span>
                        </div>
                        <nav className="hidden md:flex space-x-8 text-sm font-medium text-gray-300">
                            <button onClick={() => setActiveTab('simulator')} className={`hover:text-cyan-400 transition ${activeTab === 'simulator' ? 'text-cyan-400 font-bold border-b-2 border-cyan-400 pb-1' : ''}`}>シミュレーター</button>
                            <button onClick={() => setActiveTab('biosensor')} className={`hover:text-cyan-400 transition ${activeTab === 'biosensor' ? 'text-cyan-400 font-bold border-b-2 border-cyan-400 pb-1' : ''}`}>バイオセンサーエンジン</button>
                            <button onClick={() => setActiveTab('architecture')} className={`hover:text-cyan-400 transition ${activeTab === 'architecture' ? 'text-cyan-400 font-bold border-b-2 border-cyan-400 pb-1' : ''}`}>アーキテクチャ</button>
                            <button onClick={() => setActiveTab('constitution')} className={`hover:text-cyan-400 transition ${activeTab === 'constitution' ? 'text-cyan-400 font-bold border-b-2 border-cyan-400 pb-1' : ''}`}>憲法コード</button>
                            <button onClick={() => setActiveTab('join')} className={`hover:text-cyan-400 transition ${activeTab === 'join' ? 'text-cyan-400 font-bold border-b-2 border-cyan-400 pb-1' : ''}`}>仲間になる</button>
                        </nav>
                        <a href="https://github.com" target="_blank" rel="noreferrer" className="text-xs bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg border border-gray-700 transition">
                            GitHub Repository
                        </a>
                    </header>

                    {/* Hero Section */}
                    <section className="px-6 py-12 md:py-16 max-w-6xl mx-auto text-center">
                        <div className="inline-block mb-4 px-4 py-1.5 rounded-full bg-indigo-950/80 border border-indigo-800/60 text-indigo-300 text-xs font-semibold tracking-wide uppercase">
                            Open Bio-Commons Council (OBC) Governing
                        </div>
                        <h1 className="text-4xl md:text-6xl font-extrabold tracking-tight text-white mb-6 leading-tight">
                            人間の脆弱性を包摂し、<br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-purple-400">尊厳と自律性を守る</span>安全インフラ
                        </h1>
                        <p className="text-2xl md:text-3xl text-gray-200 max-w-4xl mx-auto mb-6 leading-relaxed font-normal">
                            Open Bio-Commons Council は、人間のバイオリズムの変化や突発的な危機をAIと共に「愛（調和と包摂）」の数理モデルで支える、完全オープンソースのパブリック・コモンズです。
                        </p>
                    </section>

                    {/* メメインコンテンツ切替 */}
                    <main className="flex-grow max-w-6xl mx-auto w-full px-6 pb-16">
                        
                        {/* 1. シミュレーター タブ */}
                        {activeTab === 'simulator' && (
                            <section className="w-full">
                                <div className="bg-[#111827] border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 pb-6 border-b border-gray-800">
                                        <div>
                                            <h2 className="text-2xl font-bold text-white mb-1">Live Evaluation Engine プレビュー</h2>
                                            <p className="text-sm text-gray-400">リアルタイム目的関数スコア J(t) と介入ステージの制御</p>
                                        </div>
                                        <div className="mt-4 md:mt-0 flex space-x-2">
                                            <button onClick={() => setMode('normal')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${mode === 'normal' ? 'bg-cyan-600 text-white' : 'bg-gray-800 text-gray-400'}`}>定常状態</button>
                                            <button onClick={() => setMode('intense')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${mode === 'intense' ? 'bg-amber-600 text-white' : 'bg-gray-800 text-gray-400'}`}>高負荷運動</button>
                                            <button onClick={() => setMode('crisis')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${mode === 'crisis' ? 'bg-rose-600 text-white' : 'bg-gray-800 text-gray-400'}`}>突発的危機</button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                        <div className="bg-[#0b101b] p-6 rounded-xl border border-gray-800 flex flex-col justify-between">
                                            <span className="text-xs text-gray-400 uppercase tracking-wider font-semibold">目的関数スコア</span>
                                            <div className="text-4xl font-mono font-bold text-cyan-400 my-4">
                                                {jScore.toFixed(1)} <span className="text-sm text-gray-500">/ 100</span>
                                            </div>
                                            <div className="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                                                <div className="bg-cyan-500 h-full transition-all duration-500" style={{ width: `${jScore}%` }}></div>
                                            </div>
                                        </div>

                                        <div className="bg-[#0b101b] p-6 rounded-xl border border-gray-800 flex flex-col justify-between">
                                            <span className="text-xs text-gray-400 uppercase tracking-wider font-semibold">現在のフェイルセーフステージ</span>
                                            <div className="text-lg font-bold text-white my-4 font-mono">{stage}</div>
                                            <span className="text-xs text-gray-500">Local Secure Enclave 処理</span>
                                        </div>

                                        <div className="bg-[#0b101b] p-6 rounded-xl border border-gray-800 flex flex-col justify-between">
                                            <span className="text-xs text-gray-400 uppercase tracking-wider font-semibold">ペナルティ・危機管理設定</span>
                                            <div className="my-4 space-y-2">
                                                <div className="text-sm text-white">
                                                    過剰介入ペナルティ: 
                                                    {mode === 'crisis' ? (
                                                        <span className="font-bold ml-1 text-gray-400">無効</span>
                                                    ) : (
                                                        <span className="font-bold ml-1 text-green-400">有効</span>
                                                    )}
                                                </div>
                                                <div className="text-sm text-white">
                                                    突発的危機: 
                                                    {mode === 'crisis' ? (
                                                        <span className="font-bold ml-1 text-rose-400">有効 (Crisis)</span>
                                                    ) : (
                                                        <span className="font-bold ml-1 text-gray-400">無効</span>
                                                    )}
                                                </div>
                                            </div>
                                            <span className="text-xs text-gray-500">Local Secure Enclave 処理</span>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}

                        {/* 2. バイオセンサーエンジン タブ */}
                        {activeTab === 'biosensor' && (
                            <section className="w-full space-y-8">
                                <div className="bg-[#111827] border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl">
                                    <div className="mb-8 pb-6 border-b border-gray-800">
                                        <div className="inline-block px-3 py-1 bg-cyan-950 border border-cyan-800 text-cyan-400 rounded-full text-xs font-semibold mb-3">
                                            Zero-Cost & Universal Hardware Layer
                                        </div>
                                        <h2 className="text-3xl font-bold text-white mb-2">完全オープン＆汎用バイオセンサーエンジン</h2>
                                        <p className="text-gray-400 text-base leading-relaxed">
                                            高価な医療用専用機器に依存せず、地球上の誰もが持つスマートフォンや数百円〜数千円のマイコン（ESP32 / Pico）を利用して、生体脈波・行動リズム・自律神経信号をローカル環境で安全に計測します。
                                        </p>
                                    </div>

                                    {/* 4つのマルチモーダル入力モジュール */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                        
                                        {/* A. スマホカメラ PPG 計測 */}
                                        <div className="bg-[#0b101b] border border-gray-800 rounded-xl p-6 flex flex-col justify-between">
                                            <div>
                                                <div className="flex items-center justify-between mb-4">
                                                    <h3 className="text-lg font-bold text-cyan-400 flex items-center">
                                                        <span className="w-3 h-3 rounded-full bg-cyan-500 mr-2 animate-ping"></span>
                                                        スマホカメラ PPG（光電容積脈波）
                                                    </h3>
                                                    <span className="text-xs bg-gray-800 text-gray-300 px-2 py-1 rounded border border-gray-700">フラッシュ+光学検出</span>
                                                </div>
                                                <p className="text-xs text-gray-400 mb-4 leading-relaxed">
                                                    カメラレンズに指先を置き、背面LEDフラッシュを点灯。血流の光学透過変化から即座に脈波パターンを描画し、心拍数（BPM）および自律神経ストレス指数（HRV）をブラウザ内で直接分析します。
                                                </p>
                                                
                                                {/* リアルタイム波形デモボックス */}
                                                <div className="bg-[#070a12] border border-gray-800 rounded-lg p-4 mb-4">
                                                    <div className="flex justify-between items-center mb-2 font-mono text-xs">
                                                        <span className="text-gray-400">LIVE PULSE WAVE</span>
                                                        <span className="text-cyan-400">{isMeasuring ? '計測中...' : '待機中'}</span>
                                                    </div>
                                                    <div className="h-16 flex items-center justify-center border-b border-gray-800/60 mb-3">
                                                        {isMeasuring ? (
                                                            <div className="w-full text-center text-cyan-400 font-mono tracking-widest text-sm animate-pulse-slow">
                                                                /\_/\__/\_/\_ヘ/\_/\_
                                                            </div>
                                                        ) : (
                                                            <div className="w-full text-center text-gray-600 font-mono text-xs">
                                                                「計測開始」を押してカメラPPGシミュレーションを開始
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-4 text-center">
                                                        <div>
                                                            <div className="text-xs text-gray-500 font-semibold">心拍数 (BPM)</div>
                                                            <div className="text-xl font-bold font-mono text-white">{isMeasuring ? bpm : '--'}</div>
                                                        </div>
                                                        <div>
                                                            <div className="text-xs text-gray-500 font-semibold">自律神経 (HRV ms)</div>
                                                            <div className="text-xl font-bold font-mono text-emerald-400">{isMeasuring ? hrv : '--'}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => setIsMeasuring(!isMeasuring)}
                                                className={`w-full py-2.5 rounded-lg text-xs font-bold transition ${isMeasuring ? 'bg-rose-600 hover:bg-rose-500 text-white' : 'bg-cyan-600 hover:bg-cyan-500 text-black'}`}>
                                                {isMeasuring ? 'カメラ計測を停止' : 'スマホカメラPPG計測をテスト'}
                                            </button>
                                        </div>

                                        {/* B. ESP32 / Raspberry Pi Pico DIY モジュール */}
                                        <div className="bg-[#0b101b] border border-gray-800 rounded-xl p-6 flex flex-col justify-between">
                                            <div>
                                                <div className="flex items-center justify-between mb-4">
                                                    <h3 className="text-lg font-bold text-indigo-400">ESP32 / Pico DIY モジュール</h3>
                                                    <span className="text-xs bg-gray-800 text-gray-300 px-2 py-1 rounded border border-gray-700">BLE / USB</span>
                                                </div>
                                                <p className="text-xs text-gray-400 mb-4 leading-relaxed">
                                                    数百円〜数千円で手に入るオープンマイコン（ESP32, Raspberry Pi Pico）と汎用PPG（光電脈波）センサーモジュールを接続。標準的なBluetooth Low Energyプロトコル経由で、Web APIとリアルタイム連携します。
                                                </p>
                                                <div className="space-y-2 text-xs font-mono bg-[#070a12] p-3 rounded-lg border border-gray-800 mb-4">
                                                    <div className="text-gray-400">ハードウェア要件:</div>
                                                    <div className="text-indigo-300">• ESP32-WROOM-32 / Pico W</div>
                                                    <div className="text-indigo-300">• MAX30102 / 光電脈波モジュール</div>
                                                    <div className="text-gray-500">ステータス: BLEアドバタイズ対応</div>
                                                </div>
                                            </div>
                                            <div className="text-xs text-gray-500 bg-gray-900/60 border border-gray-800 p-2.5 rounded text-center">
                                                完全オープン回路図 & C++ファームウェア準備完了
                                            </div>
                                        </div>

                                        {/* C. キーボード＆マウス（タイピング・ダイナミクス） */}
                                        <div className="bg-[#0b101b] border border-gray-800 rounded-xl p-6 flex flex-col justify-between">
                                            <div>
                                                <div className="flex items-center justify-between mb-4">
                                                    <h3 className="text-lg font-bold text-purple-400">行動ダイナミクス (入力行動)</h3>
                                                    <span className="text-xs bg-gray-800 text-gray-300 px-2 py-1 rounded border border-gray-700">無意識・負担ゼロ</span>
                                                </div>
                                                <p className="text-xs text-gray-400 mb-4 leading-relaxed">
                                                    キー入力のリズム・バックスペース修正率・マウス軌跡のジッター（細かな振れ）を意識させずにバックグラウンド解析。認知の過負荷やストレスによる疲労の兆候を検出します。
                                                </p>
                                                <div className="bg-[#070a12] p-3 rounded-lg border border-gray-800 text-xs space-y-1.5 font-mono">
                                                    <div className="flex justify-between text-gray-400">
                                                        <span>打鍵リズム安定度:</span>
                                                        <span className="text-purple-300">94.2% (良好)</span>
                                                    </div>
                                                    <div className="flex justify-between text-gray-400">
                                                        <span>認知負荷推定:</span>
                                                        <span className="text-green-400">LOW</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* D. 音声マイクロ特徴量 */}
                                        <div className="bg-[#0b101b] border border-gray-800 rounded-xl p-6 flex flex-col justify-between">
                                            <div>
                                                <div className="flex items-center justify-between mb-4">
                                                    <h3 className="text-lg font-bold text-amber-400">音声マイクロ特徴量</h3>
                                                    <span className="text-xs bg-gray-800 text-gray-300 px-2 py-1 rounded border border-gray-700">ローカルマイク解析</span>
                                                </div>
                                                <p className="text-xs text-gray-400 mb-4 leading-relaxed">
                                                    発話の意味（言葉）ではなく、声の揺らぎ（ジッター・シマー）、トーンの高さ、発話テンポをローカルで即座に音響解析。エネルギーの枯渇やメンタルヘルスの初期シグナルを捕獲します。
                                                </p>
                                                <div className="bg-[#070a12] p-3 rounded-lg border border-gray-800 text-xs space-y-1.5 font-mono">
                                                    <div className="flex justify-between text-gray-400">
                                                        <span>発話ピッチ揺らぎ:</span>
                                                        <span className="text-amber-300">Normal Range</span>
                                                    </div>
                                                    <div className="flex justify-between text-gray-400">
                                                        <span>感情エネルギー:</span>
                                                        <span className="text-amber-400">78 / 100</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                    </div>

                                    {/* プライバシー保護の注記 */}
                                    <div className="bg-cyan-950/40 border border-cyan-800/60 rounded-xl p-4 text-xs text-cyan-200 flex items-start space-x-3">
                                        <span className="text-lg">🔒</span>
                                        <div>
                                            <span className="font-bold block mb-1">完全ローカル処理・プライバシー保護の原則</span>
                                            カメラ映像、マイク音声、キー打鍵データなどの生データは外部サーバーに一切送信されません。すべてユーザーの端末内（ブラウザ / Secure Enclave）だけで目的関数スコア J(t) へと変換され、生データはメモリ上で即時破棄されます。
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}

                        {/* 3. アーキテクチャ タブ */}
                        {activeTab === 'architecture' && (
                            <section className="bg-[#111827] border border-gray-800 rounded-2xl p-8 shadow-2xl">
                                <h2 className="text-2xl font-bold text-white mb-4">システム・アーキテクチャ</h2>
                                <p className="text-gray-400 text-sm leading-relaxed mb-6">
                                    OpenLBOFは、生体センサー・エッジAI・目的関数エンジン・ローカルSecure Enclaveが相互に連携し、プライバシーを完全に守りながら自律性を保護する分散型アーキテクチャで構築されています。
                                </p>
                            </section>
                        )}

                        {/* 4. 憲法コード タブ */}
                        {activeTab === 'constitution' && (
                            <section className="bg-[#111827] border border-gray-800 rounded-2xl p-8 shadow-2xl">
                                <h2 className="text-2xl font-bold text-white mb-4">Bio-Commons 憲法コード (Constitution Code)</h2>
                                <p className="text-gray-400 text-sm leading-relaxed mb-6">
                                    AIシステムが過剰介入（パターナリズムの暴走）を起こさないよう、コード化された不可侵原則と倫理ガイドライン。
                                </p>
                            </section>
                        )}

                        {/* 5. 仲間になる タブ */}
                        {activeTab === 'join' && (
                            <section className="bg-[#111827] border border-gray-800 rounded-2xl p-8 shadow-2xl text-center py-12">
                                <h2 className="text-3xl font-bold text-white mb-4">Open Bio-Commons コミュニティに参加する</h2>
                                <p className="text-gray-400 text-base max-w-2xl mx-auto mb-8">
                                    開発者、研究者、デザイナー、市民として、パブリック・コモンズの安全インフラを共に創造しましょう。
                                </p>
                            </section>
                        )}

                    </main>

                    {/* Footer */}
                    <footer className="mt-auto border-t border-gray-800 py-8 px-6 text-center text-sm text-gray-500">
                        <p>&copy; 2026 Open Bio-Commons Council (OBC) & OpenLBOF Contributors. Licensed under AGPL-3.0.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

        // 改善案2: 1〜7日間のリスク推移グラフ（冠水 vs Natech vs パンデミック）
        const RiskTimelineChart = ({ timeline = [], selectedDay = 3 }) => {
            if (!timeline.length) return null;
            const width = 620;
            const height = 210;
            const padding = { top: 20, right: 24, bottom: 34, left: 42 };
            const chartW = width - padding.left - padding.right;
            const chartH = height - padding.top - padding.bottom;

            const getX = (idx) => padding.left + (idx / Math.max(1, timeline.length - 1)) * chartW;
            const getY = (val) => padding.top + chartH - (Math.min(100, Math.max(0, val)) / 100) * chartH;

            const buildPath = (key) => timeline.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d[key])}`).join(' ');

            return (
                <div className="w-full space-y-2">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-48 sm:h-56 overflow-visible">
                        {[0, 25, 50, 75, 100].map((v) => (
                            <g key={v}>
                                <line x1={padding.left} y1={getY(v)} x2={width - padding.right} y2={getY(v)} stroke="#1e293b" strokeDasharray="3 3" strokeWidth="1" />
                                <text x={padding.left - 8} y={getY(v) + 4} fill="#64748b" fontSize="10" textAnchor="end" className="font-mono">{v}%</text>
                            </g>
                        ))}
                        {timeline.map((d, i) => {
                            const isSelected = d.day === selectedDay;
                            return (
                                <g key={d.day}>
                                    {isSelected && (
                                        <line x1={getX(i)} y1={padding.top} x2={getX(i)} y2={height - padding.bottom} stroke="#a855f7" strokeWidth="1.5" strokeDasharray="4 2" />
                                    )}
                                    <text x={getX(i)} y={height - 10} fill={isSelected ? "#e9d5ff" : "#94a3b8"} fontSize="10" fontWeight={isSelected ? "bold" : "normal"} textAnchor="middle" className="font-mono">
                                        {d.shortDate}
                                    </text>
                                </g>
                            );
                        })}
                        <path d={buildPath('inundationRisk')} fill="none" stroke="#22d3ee" strokeWidth="2.5" />
                        <path d={buildPath('natechRisk')} fill="none" stroke="#f87171" strokeWidth="2" strokeDasharray="5 3" />
                        <path d={buildPath('outbreakRisk')} fill="none" stroke="#c084fc" strokeWidth="2.5" />
                        {timeline.map((d, i) => (
                            <g key={`pts-${d.day}`}>
                                <circle cx={getX(i)} cy={getY(d.inundationRisk)} r={d.day === selectedDay ? 4.5 : 3} fill="#22d3ee" />
                                <circle cx={getX(i)} cy={getY(d.natechRisk)} r={d.day === selectedDay ? 4 : 2.5} fill="#f87171" />
                                <circle cx={getX(i)} cy={getY(d.outbreakRisk)} r={d.day === selectedDay ? 4.5 : 3} fill="#c084fc" />
                            </g>
                        ))}
                    </svg>
                    <div className="flex flex-wrap items-center justify-center gap-5 text-[11px] font-mono text-slate-300">
                        <span className="flex items-center gap-1.5"><span className="w-3 h-0.5 bg-cyan-400 inline-block"/> 道路冠水・内水氾濫</span>

                        <span className="flex items-center gap-1.5"><span className="w-3 h-0.5 bg-purple-400 inline-block"/> 避難所パンデミック</span>
                    </div>

                ishigaki: { name: '石垣市・離島沿岸エリア', lat: 24.3407, lon: 124.1556, baseRain: 75, shelterSpace: 2.2, industrialDensity: 0.30, elevation: 6.0, drainageCap: 50 },
                uru_industrial: { name: 'うるま市・中城湾港工業帯', lat: 26.3361, lon: 127.8556, baseRain: 70, shelterSpace: 2.1, industrialDensity: 0.80, elevation: 3.5, drainageCap: 52 }

          }

          calculateDetailedRisk({ 
            lat, lon, areaName, 
            baseRain = 45, shelterSpace = 2.2, industrialDensity = 0.6, elevation = 5.0, drainageCap = 48,
            forecastDays = 3, baseDateTimeStr = null,
            customShelterSqm = null, customVentLevel = 3, // 改善案1: カスタム避難所パラメータ
            liveWeather = null 
          }) {
            // 基点日時のパースと到達日時の計算
            const baseDate = baseDateTimeStr ? new Date(baseDateTimeStr) : new Date();
            const validBaseDate = isNaN(baseDate.getTime()) ? new Date() : baseDate;
            const targetDate = new Date(validBaseDate.getTime() + forecastDays * 24 * 60 * 60 * 1000);

            const formatJPDateTime = (d) => {
              const yyyy = d.getFullYear();
              const mm = String(d.getMonth() + 1).padStart(2, '0');
              const dd = String(d.getDate()).padStart(2, '0');
              const hh = String(d.getHours()).padStart(2, '0');
              const min = String(d.getMinutes()).padStart(2, '0');
              return `${yyyy}/${mm}/${dd} ${hh}:${min}`;
            };

            const liveHourlyRain = liveWeather ? liveWeather.currentRainMm : 0;
            const liveForecastSum = liveWeather ? liveWeather.forecastRainSum : 0;
            const liveMaxProb = liveWeather ? liveWeather.maxPrecipProb : null;
            const currentTemp = liveWeather?.currentTemp ?? 17.5;
            const currentHumidity = liveWeather?.currentHumidity ?? 62;

            // 1日目〜7日目のタイムライン生成（①実際の気象予報ベース vs ②大雨・災害発生時の条件付き脆弱性）
            const timeline = [];
            for (let d = 1; d <= 7; d++) {
              const stepDate = new Date(validBaseDate.getTime() + d * 24 * 60 * 60 * 1000);
              const shortDate = `${stepDate.getMonth() + 1}/${stepDate.getDate()}`;

              // ① 実際の気象予報ベース（リアルタイム天気連動）
              const actualPrecipProb = liveMaxProb !== null 
                ? Math.min(98, Math.max(5, Math.round(liveMaxProb * (0.85 + d * 0.03))))
                : Math.min(85, Math.max(10, Math.round(baseRain * 0.55 + (d * 2.5))));

              const actualExpRain = liveForecastSum > 0 
                ? Math.round((liveForecastSum / Math.max(1, forecastDays)) * d)
                : Math.round((actualPrecipProb / 100) * (18 + d * 10));

              const actualPeakHr = Math.max(liveHourlyRain, Math.round((actualExpRain / Math.max(1, d * 6)) * (actualPrecipProb / 65)));

              const elevFactor = Math.max(0.35, 1.35 - (elevation / 22));
              const actualDrainOverload = Math.min(1.5, actualPeakHr / Math.max(25, drainageCap));
              const actualInundationRisk = Math.min(95, Math.max(2, Math.round(
                ((actualDrainOverload * 42) + (actualPrecipProb * 0.18) + (actualExpRain / 4.5)) * elevFactor
              )));

              const actualNatechRisk = Math.min(92, Math.max(2, Math.round((industrialDensity * 22) + (actualInundationRisk * 0.55))));

              // 平常時は避難所開設率が低いため、実際のパンデミック確率は冠水・災害発生確率に連動して抑えられる
              const evacuationTriggerProb = Math.min(1.0, Math.max(0.12, (actualInundationRisk / 75) + (d * 0.04)));

              // ② 実際に大雨（時間80mm・累積250mm超）や大規模避難が発生した場合の条件付きポテンシャル
              const worstExpRain = Math.round(140 + d * 48 + (baseRain * 0.8));
              const worstPeakHr = Math.max(65, Math.round(75 + (baseRain * 0.25)));
              const worstDrainOverload = Math.min(1.8, worstPeakHr / Math.max(25, drainageCap));
              const worstInundationRisk = Math.min(99, Math.max(25, Math.round(
                ((worstDrainOverload * 52) + 28 + (worstExpRain / 8.0)) * elevFactor
              )));
              const worstNatechRisk = Math.min(98, Math.max(15, Math.round(industrialDensity * 68 + (worstInundationRisk * 0.32))));

              // カスタム避難所面積・換気環境に基づく避難所過密・感染ポテンシャル
              const startSqm = customShelterSqm !== null ? customShelterSqm : shelterSpace;
              const effSqm = Math.max(0.9, parseFloat((startSqm - (d - 1) * 0.13).toFixed(2)));
              const ventBoost = (customVentLevel - 3) * 0.85;
              const ventRate = Math.max(1.0, parseFloat((4.0 + ventBoost - (d * 0.22) - (3.5 - effSqm) * 0.35).toFixed(1)));
              const fatigue = Math.min(100, Math.round(15 + d * 11 + (3.2 - effSqm) * 12 - (customVentLevel - 3) * 5));

              const crowdFactor = Math.max(0.3, (3.8 - effSqm) / 2.2);
              const worstOutbreakRisk = Math.min(96, Math.max(15, Math.round((crowdFactor * 48) + (d * 5.2) + ((5.5 - ventRate) * 6.5))));
              const actualOutbreakRisk = Math.min(90, Math.max(3, Math.round(worstOutbreakRisk * evacuationTriggerProb)));

              timeline.push({
                day: d,
                shortDate,
                fullDateTime: formatJPDateTime(stepDate),
                // ① 実際の発生確率（現在予報ベース）
                precipProbability: actualPrecipProb,
                expectedRainfallMm: actualExpRain,
                peakHourlyRainMm: actualPeakHr,
                inundationRisk: actualInundationRisk,
                natechRisk: actualNatechRisk,
                outbreakRisk: actualOutbreakRisk,
                // ② 大雨・災害発生時の条件付き可能性（インフラ・地形ポテンシャル）
                worstExpRainMm: worstExpRain,
                worstPeakHourlyMm: worstPeakHr,
                worstInundationRisk,
                worstNatechRisk,
                worstOutbreakRisk,
                // 環境パラメータ
                effectiveShelterSqm: effSqm,
                ventilationRate: ventRate,
                hygieneFatigueIndex: fatigue
              });
            }

            const activeStep = timeline[Math.min(6, Math.max(0, forecastDays - 1))];
            const compositeEntropy = parseFloat(((activeStep.natechRisk * 0.35 + activeStep.inundationRisk * 0.32 + activeStep.outbreakRisk * 0.33) / 100).toFixed(2));
            const worstCompositeEntropy = parseFloat(((activeStep.worstNatechRisk * 0.35 + activeStep.worstInundationRisk * 0.32 + activeStep.worstOutbreakRisk * 0.33) / 100).toFixed(2));

            let primaryThreat = `【現在の予報】今後${forecastDays}日間の実測ベース冠水確率は${activeStep.inundationRisk}%（実際のパンデミック確率${activeStep.outbreakRisk}%）ですが、仮に豪雨が直撃した場合の潜在冠水リスクは${activeStep.worstInundationRisk}%に達します。`;
            let recommendedAction = '平時のうちはハザードマップで「高台ルート」と「1人3.5㎡以上の2次避難先」を確認し、雨雲レーダーの警戒ライン超えに備えてください。';

            if (activeStep.outbreakRisk >= 55 || activeStep.worstOutbreakRisk >= 70) {
              primaryThreat = `【避難所過密リスク】実際に避難所が開設された場合、滞在${forecastDays}日目（1人あたり ${activeStep.effectiveShelterSqm}㎡・換気${activeStep.ventilationRate}回/h）でパンデミック発生確率が${activeStep.worstOutbreakRisk}%（現在の実発生確率は${activeStep.outbreakRisk}%）まで上昇します。`;
              recommendedAction = `一次避難所の過密化が進む前に、個別空間が確保された二次避難施設（分散避難先）への早期移動と換気ゾーニング強化（1人3.5㎡以上確保）を推奨します。`;
            } else if (activeStep.worstNatechRisk >= 68) {
              primaryThreat = `【大雨発生時の潜在Natech脅威】現在の実発生確率は${activeStep.natechRisk}%ですが、仮に時間${activeStep.worstPeakHourlyMm}mmの豪雨が発生すると冠水確率${activeStep.worstInundationRisk}%に伴い臨海工業帯の爆発・ガス漏洩リスクが${activeStep.worstNatechRisk}%へ急騰します。`;
              recommendedAction = `大雨警報発令時は冠水が始まる前に、風上かつ標高20m以上の指定高台エリアへ即時退避してください。`;
            }

            // 改善案5: 気温・湿度に応じた心身ケア・快適度ガイド
            let thermalCare = {
              status: '快適・安定域（自律神経負荷：低）',
              badgeColor: 'text-emerald-300 border-emerald-500/40 bg-emerald-950/50',
              advice: `現在気温 ${currentTemp}℃・湿度 ${currentHumidity}% は比較的穏やかです。避難や移動の際は脱ぎ着しやすい重ね着を心がけ、こまめな水分補給と深呼吸で緊張を和らげてください。`
            };
            if (currentTemp <= 12) {
              thermalCare = {
                status: '寒冷・低体温警戒域（保温・血流ケア必須）',
                badgeColor: 'text-cyan-300 border-cyan-500/40 bg-cyan-950/50',
                advice: `気温が ${currentTemp}℃ と低く、避難所や車中泊では床からの底冷えによる低体温症や血圧上昇リスクが高まります。段ボール・断熱シートを床に敷き、首・手首・足首を温かい衣類や毛布で保護してください。`
              };
            } else if (currentTemp >= 28) {
              thermalCare = {
                status: '高温多湿・熱中症警戒域（冷却・電解質補給）',
                badgeColor: 'text-amber-300 border-amber-500/40 bg-amber-950/50',
                advice: `気温 ${currentTemp}℃・湿度 ${currentHumidity}% のため、停電や換気制限下では熱中症リスクが急増します。経口補水液の摂取、濡れタオルでの首元冷却、風通しの確保を最優先してください。`
              };
            }

            // 改善案3: 状況に応じた3つの安全行動チェックリスト
            const actionChecklist = [
              {
                id: 'chk_hazard',
                text: `ハザードマップと雨雲レーダーで「標高20m以上の高台・風上避難ルート」を確認する`
              },
              {
                id: 'chk_shelter',
                text: `2次避難所（ホテル・親戚宅・分散施設）の連絡先と「1人3.5㎡以上の空間・換気」を確保する`
              },
              {
                id: 'chk_care',
                text: currentTemp <= 15 
                  ? `防寒具・アルミ保温シート・常備薬・モバイルバッテリーをすぐ持ち出せる位置にまとめる`
                  : `飲料水（1日2L目安）・衛生マスク・手指消毒液・常備薬を手元に準備する`
              }
            ];

            const yahooRadarUrl = `https://weather.yahoo.co.jp/weather/zoomradar/?lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}&z=12`;
            // 改善案6: 国土地理院 重ねるハザードマップURL
            const gsiHazardUrl = `https://disaportal.gsi.go.jp/maps/index.html?ll=${lat.toFixed(4)},${lon.toFixed(4)}&z=14&base=pale&ls=seamless%7Cdisaster1%7Cdisaster2%7Cdisaster3&disp=0111&vs=c1j0l0u0t0h0z0`;

            return {
              areaName: areaName || `GPS測位地点 (${lat.toFixed(3)}, ${lon.toFixed(3)})`,
              lat: lat.toFixed(4),
              lon: lon.toFixed(4),
              baseDateTimeFormatted: formatJPDateTime(validBaseDate),
              targetDateTimeFormatted: activeStep.fullDateTime,
              forecastDays,
              // ① 実際の発生確率（リアルタイム気象予報ベース）
              compositeEntropy,
              natechRisk: activeStep.natechRisk,
              inundationRisk: activeStep.inundationRisk,
              outbreakRisk: activeStep.outbreakRisk,
              // ② 大雨・極端災害が発生した場合の条件付き可能性
              worstCompositeEntropy,
              worstNatechRisk: activeStep.worstNatechRisk,
              worstInundationRisk: activeStep.worstInundationRisk,
              worstOutbreakRisk: activeStep.worstOutbreakRisk,
              yahooRadarUrl,
              gsiHazardUrl,
              timeline,
              thermalCare,
              actionChecklist,
              factors: {
                precipProbability: activeStep.precipProbability,
                expectedRainfallMm: activeStep.expectedRainfallMm,
                peakHourlyRainMm: activeStep.peakHourlyRainMm,
                worstExpRainMm: activeStep.worstExpRainMm,
                worstPeakHourlyMm: activeStep.worstPeakHourlyMm,
                liveHourlyRain,
                currentTemp,
                currentHumidity,
                drainageCap,
                effectiveShelterSqm: activeStep.effectiveShelterSqm,
                ventilationRate: activeStep.ventilationRate,
                hygieneFatigueIndex: activeStep.hygieneFatigueIndex,
                industrialDensityPct: Math.round(industrialDensity * 100),
                elevation
              },
              primaryThreat,
              recommendedAction,
              timestamp: new Date().toLocaleTimeString('ja-JP')
            };
          }
        }

        const riskCalculator = new LocalRiskCalculatorEngine();

        function App() {
          const [isScrolled, setIsScrolled] = useState(false);
          const [activeMathItem, setActiveMathItem] = useState('I_bio');
          const [activeGovernanceTab, setActiveGovernanceTab] = useState('engineering');
          const [simContext, setSimContext] = useState('NORMAL');
          const [simTime, setSimTime] = useState(0);
          const [simData, setSimData] = useState([]);
          const [isSimRunning, setIsSimRunning] = useState(true);
          const [formSubmitted, setFormSubmitted] = useState(false);
          const [formData, setFormData] = useState({ name: '', email: '', role: 'AutoDrive Engineer', message: '' });

          const [userLocation, setUserLocation] = useState(null);
          const [isLocating, setIsLocating] = useState(false);
          const [isFetchingWeather, setIsFetchingWeather] = useState(false);
          const [liveWeatherCache, setLiveWeatherCache] = useState(null);
          const [locationError, setLocationError] = useState(null);
          const [selectedPref, setSelectedPref] = useState('okayama');
          const [selectedAreaKey, setSelectedAreaKey] = useState('setouchi');
          const [forecastDays, setForecastDays] = useState(3);

          // 基点日時（デフォルトは現在日時 YYYY-MM-DDTHH:mm）
          const getDefaultLocalDateTime = () => {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}T${hh}:${min}`;
          };
          const [baseDateTime, setBaseDateTime] = useState(getDefaultLocalDateTime);

          // 改善案1: 2次避難所広さ＆換気カスタム調整ステート
          const [customShelterSqm, setCustomShelterSqm] = useState(3.4);
          const [customVentLevel, setCustomVentLevel] = useState(3);

          // 改善案3 & 4: チェックリスト状態＆家族共有メッセージコピー完了フラグ
          const [checkedItems, setCheckedItems] = useState({});
          const [copiedShareMsg, setCopiedShareMsg] = useState(false);

          // ① 実際の発生確率 vs ② 大雨・災害発生時の条件付き可能性 の表示切替モード
          const [riskScenarioMode, setRiskScenarioMode] = useState('ACTUAL'); // 'ACTUAL' | 'WORST_CASE'

          const [localRiskData, setLocalRiskData] = useState(() => {
            const initArea = riskCalculator.regionDatabase.okayama.areas.setouchi;
            return riskCalculator.calculateDetailedRisk({ ...initArea, forecastDays: 3 });
          });

          // リアルタイム気象レーダーAPI（Open-Meteo）から対象座標の降水量・気温・湿度を取得
          const fetchRadarPrecipitation = async (
            lat, lon, areaObjOrName, days, isGps = false,
            overrideBaseDt = baseDateTime, overrideSqm = customShelterSqm, overrideVent = customVentLevel
          ) => {
            setIsFetchingWeather(true);
            try {
              const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,rain&hourly=precipitation_probability,precipitation&forecast_days=${Math.min(7, Math.max(1, days))}&timezone=Asia%2FTokyo`;
              const res = await fetch(url);
              if (!res.ok) throw new Error('Weather API unavailable');
              const data = await res.json();

              const currentRainMm = data.current?.precipitation ?? 0;
              const currentTemp = data.current?.temperature_2m ?? 17.5;
              const currentHumidity = data.current?.relative_humidity_2m ?? 60;
              const probs = data.hourly?.precipitation_probability || [];
              const rains = data.hourly?.precipitation || [];

              const maxPrecipProb = probs.length > 0 ? Math.max(...probs) : null;
              const forecastRainSum = rains.reduce((acc, v) => acc + (v || 0), 0);

              const liveWeather = {
                currentRainMm,
                currentTemp,
                currentHumidity,
                maxPrecipProb,
                forecastRainSum: Math.round(forecastRainSum * 10) / 10
              };
              setLiveWeatherCache(liveWeather);

              if (isGps) {
                setLocalRiskData(riskCalculator.calculateDetailedRisk({
                  lat, lon, areaName: areaObjOrName,
                  forecastDays: days, baseDateTimeStr: overrideBaseDt,
                  customShelterSqm: overrideSqm, customVentLevel: overrideVent,
                  liveWeather
                }));
              } else {
                setLocalRiskData(riskCalculator.calculateDetailedRisk({
                  ...areaObjOrName,
                  forecastDays: days, baseDateTimeStr: overrideBaseDt,
                  customShelterSqm: overrideSqm, customVentLevel: overrideVent,
                  liveWeather
                }));
              }
            } catch (err) {
              setLiveWeatherCache(null);
              if (isGps) {
                setLocalRiskData(riskCalculator.calculateDetailedRisk({
                  lat, lon, areaName: areaObjOrName,
                  forecastDays: days, baseDateTimeStr: overrideBaseDt,
                  customShelterSqm: overrideSqm, customVentLevel: overrideVent
                }));
              } else {
                setLocalRiskData(riskCalculator.calculateDetailedRisk({
                  ...areaObjOrName,
                  forecastDays: days, baseDateTimeStr: overrideBaseDt,
                  customShelterSqm: overrideSqm, customVentLevel: overrideVent
                }));
              }
            } finally {
              setIsFetchingWeather(false);
            }
          };

          // 初回マウント時にデフォルト地域の気象レーダーデータを同期
          useEffect(() => {
            const initArea = riskCalculator.regionDatabase[selectedPref].areas[selectedAreaKey];
            setCustomShelterSqm(initArea.shelterSpace);
            fetchRadarPrecipitation(initArea.lat, initArea.lon, initArea, forecastDays, false, baseDateTime, initArea.shelterSpace, customVentLevel);
          }, []);

          const recalculateWithCurrentWeather = (nextDays, nextBaseDt, nextSqm, nextVent) => {
            if (userLocation) {
              setLocalRiskData(riskCalculator.calculateDetailedRisk({
                lat: userLocation.lat, lon: userLocation.lon, areaName: '現在地GPS測位エリア',
                forecastDays: nextDays, baseDateTimeStr: nextBaseDt,
                customShelterSqm: nextSqm, customVentLevel: nextVent,
                liveWeather: liveWeatherCache
              }));
            } else {
              const areaObj = riskCalculator.regionDatabase[selectedPref].areas[selectedAreaKey];
              setLocalRiskData(riskCalculator.calculateDetailedRisk({
                ...areaObj,
                forecastDays: nextDays, baseDateTimeStr: nextBaseDt,
                customShelterSqm: nextSqm, customVentLevel: nextVent,
                liveWeather: liveWeatherCache
              }));
            }
          };

          const handleDetectLocation = () => {
            setIsLocating(true);
            setLocationError(null);

            if (!navigator.geolocation) {
              setLocationError('お使いのブラウザは位置情報サービスに対応していません。下の都道府県・詳細地域から選択してください。');
              setIsLocating(false);
              return;
            }

            navigator.geolocation.getCurrentPosition(
              (position) => {
                const { latitude, longitude } = position.coords;
                setUserLocation({ lat: latitude, lon: longitude });
                fetchRadarPrecipitation(latitude, longitude, '現在地GPS測位エリア', forecastDays, true, baseDateTime, customShelterSqm, customVentLevel);
                setIsLocating(false);
              },
              (error) => {
                setLocationError('位置情報の取得が許可されていないかタイムアウトしました。下の都道府県・詳細地域から選択してください。');
                setIsLocating(false);
              },
              { timeout: 8000, enableHighAccuracy: true }
            );
          };

          const handlePrefChange = (prefKey) => {
            setUserLocation(null);
            setSelectedPref(prefKey);
            const firstAreaKey = Object.keys(riskCalculator.regionDatabase[prefKey].areas)[0];
            setSelectedAreaKey(firstAreaKey);
            const areaObj = riskCalculator.regionDatabase[prefKey].areas[firstAreaKey];
            setCustomShelterSqm(areaObj.shelterSpace);
            fetchRadarPrecipitation(areaObj.lat, areaObj.lon, areaObj, forecastDays, false, baseDateTime, areaObj.shelterSpace, customVentLevel);
          };

          const handleAreaChange = (areaKey) => {
            setUserLocation(null);
            setSelectedAreaKey(areaKey);
            const areaObj = riskCalculator.regionDatabase[selectedPref].areas[areaKey];
            setCustomShelterSqm(areaObj.shelterSpace);
            fetchRadarPrecipitation(areaObj.lat, areaObj.lon, areaObj, forecastDays, false, baseDateTime, areaObj.shelterSpace, customVentLevel);
          };

          const handleForecastDaysChange = (days) => {
            setForecastDays(days);
            recalculateWithCurrentWeather(days, baseDateTime, customShelterSqm, customVentLevel);
          };

          const handleBaseDateTimeChange = (newDt) => {
            setBaseDateTime(newDt);
            recalculateWithCurrentWeather(forecastDays, newDt, customShelterSqm, customVentLevel);
          };

          const handleCustomShelterChange = (newSqm) => {
            setCustomShelterSqm(newSqm);
            recalculateWithCurrentWeather(forecastDays, baseDateTime, newSqm, customVentLevel);
          };

          const handleCustomVentChange = (newVent) => {
            setCustomVentLevel(newVent);
            recalculateWithCurrentWeather(forecastDays, baseDateTime, customShelterSqm, newVent);
          };

          // 改善案4: 家族・大切な人への安心共有メッセージコピー（iframe対応のexecCommandフォールバック付き）
          const handleCopyFamilyShare = () => {
            const shareText = `【OpenLBOF 安心・防災状況共有】\n` +
              `■ 対象エリア: ${localRiskData.areaName}\n` +
              `■ 基点日時: ${localRiskData.baseDateTimeFormatted}（${localRiskData.forecastDays}日後予測: ${localRiskData.targetDateTimeFormatted}）\n` +
              `■ 現在気象: 気温 ${localRiskData.factors.currentTemp}℃ / 湿度 ${localRiskData.factors.currentHumidity}%\n` +
              `■ ① 現在の実発生確率: 冠水 ${localRiskData.inundationRisk}% / 避難所感染 ${localRiskData.outbreakRisk}%\n` +
              `■ ② 豪雨発生時の潜在リスク: 冠水 ${localRiskData.worstInundationRisk}% / 避難所感染 ${localRiskData.worstOutbreakRisk}%\n` +
              `■ 行動方針: ${localRiskData.recommendedAction}\n` +
              `無理をせず安全第一で行動します。連絡が取りづらい時は指定の高台・二次避難先を確認してください。`;

            const textArea = document.createElement('textarea');
            textArea.value = shareText;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();
            try {
              document.execCommand('copy');
              setCopiedShareMsg(true);
              setTimeout(() => setCopiedShareMsg(false), 3500);
            } catch (e) {
              console.error('Copy failed', e);
            }
            document.body.removeChild(textArea);
          };

          useEffect(() => {
            const handleScroll = () => {
              setIsScrolled(window.scrollY > 20);
            };
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          useEffect(() => {
            if (!isSimRunning) return;
            const interval = setInterval(() => {
              setSimTime(prev => {
                const nextTime = prev + 1;
                setSimData(currentData => {
                  let rawSignal = 0.5 + Math.sin(nextTime * 0.2) * 0.08 + (Math.random() - 0.5) * 0.04;
                  let baseline = 0.5 + Math.sin(nextTime * 0.05) * 0.02;

                  if (simContext === 'INTENSE_EXERCISE') {
                    rawSignal = 0.82 + Math.sin(nextTime * 0.4) * 0.1 + (Math.random() - 0.5) * 0.08;
                    baseline = 0.78;
                  } else if (simContext === 'CRISIS') {
                    rawSignal = 0.05 + (Math.random() - 0.5) * 0.02;
                    baseline = 0.52;
                  }

                  const deviation = Math.abs(rawSignal - baseline);
                  const i_bio = Math.max(0, 1 - deviation * 2);
                  const e_pen = simContext === 'CRISIS' ? 0.95 : (simContext === 'INTENSE_EXERCISE' ? 0.45 : Math.max(deviation * 1.2, localRiskData.compositeEntropy * 0.8));
                  const c_stab = Math.max(0, 1 - e_pen * 0.8);
                  const m_mat = 0.85;
                  const isHighEffort = simContext === 'INTENSE_EXERCISE';
                  const overInterventionRisk = isHighEffort && e_pen > 0.4 ? 0.75 : 0.05;
                  const lambdaPenalty = 4.0;

                  const j_score = (1.0 * i_bio) + (1.0 * c_stab) + (0.5 * m_mat) - (2.0 * e_pen) - (lambdaPenalty * overInterventionRisk);

                  let stage = 'STAGE 0 (Normal)';
                  if (e_pen > 0.8 || i_bio < 0.25) {
                    stage = 'STAGE 2 (Hard Override)';
                  } else if (e_pen > 0.35 && !isHighEffort) {
                    stage = 'STAGE 1 (Soft Buffer)';
                  }

                  const newPoint = {
                    time: nextTime,
                    rawSignal: parseFloat(rawSignal.toFixed(3)),
                    baseline: parseFloat(baseline.toFixed(3)),
                    jScore: parseFloat(j_score.toFixed(3)),
                    ePen: parseFloat(e_pen.toFixed(3)),
                    stage
                  };

                  const updated = [...currentData, newPoint];
                  if (updated.length > 25) updated.shift();
                  return updated;
                });
                return nextTime;
              });
            }, 400);

            return () => clearInterval(interval);
          }, [isSimRunning, simContext, localRiskData]);

          const latestTelemetry = useMemo(() => {
            if (simData.length === 0) return { jScore: 0, stage: 'STAGE 0 (Normal)', ePen: 0 };
            return simData[simData.length - 1];
          }, [simData]);

          const handleFormSubmit = (e) => {
            e.preventDefault();
            setFormSubmitted(true);
            setTimeout(() => {
              setFormSubmitted(false);
              setFormData({ name: '', email: '', role: 'AutoDrive Engineer', message: '' });
            }, 5000);
          };

          return (
            <div className="min-h-screen bg-[#090D16] text-slate-100 font-sans selection:bg-amber-500/30 selection:text-amber-200 relative overflow-x-hidden">
              <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
                <div className="absolute -top-40 -left-40 w-96 h-96 bg-amber-600/10 rounded-full blur-[120px]" />
                <div className="absolute top-1/3 -right-40 w-[500px] h-[500px] bg-cyan-600/10 rounded-full blur-[150px]" />
                <div className="absolute -bottom-40 left-1/3 w-[600px] h-[600px] bg-indigo-600/10 rounded-full blur-[180px]" />
                <div className="absolute inset-0 bg-[linear-gradient(to_right,#ffffff05_1px,transparent_1px),linear-gradient(to_bottom,#ffffff05_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_0%,#000_70%,transparent_100%)]" />
              </div>

              <header className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${isScrolled ? 'bg-[#090D16]/85 backdrop-blur-md border-b border-slate-800/80 py-3 shadow-2xl' : 'bg-transparent py-5'}`}>
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
                  <div className="flex items-center space-x-3 cursor-pointer" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>
                    <div className="relative flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 p-[1px] shadow-lg shadow-amber-500/20">
                      <div className="w-full h-full bg-[#090D16] rounded-[11px] flex items-center justify-center">
                        <Heart className="w-5 h-5 text-amber-400 fill-amber-400/20 animate-pulse" />
                      </div>
                    </div>
                    <div>
                      <span className="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-amber-200 bg-clip-text text-transparent">
                        OpenLBOF
                      </span>
                      <span className="hidden sm:inline-block ml-2 text-xs px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-amber-400 font-mono">
                        OBC Public Commons
                      </span>
                    </div>
                  </div>

                  <nav className="hidden md:flex items-center space-x-8 text-sm font-medium text-slate-300">
                    <a href="#location-risk" className="hover:text-amber-400 transition-colors flex items-center gap-1.5 text-amber-300">
                      <MapPin className="w-4 h-4" /> 現在地リスク計算
                    </a>
                    <a href="#philosophy" className="hover:text-amber-400 transition-colors">哲学</a>
                    <a href="#math-core" className="hover:text-amber-400 transition-colors">数理モデル J</a>
                    <a href="#governance" className="hover:text-amber-400 transition-colors">評議会憲章</a>
                    <a href="#simulator" className="hover:text-amber-400 transition-colors flex items-center gap-1.5 text-cyan-400">
                      <Activity className="w-4 h-4 animate-spin-slow" /> ライブデモ
                    </a>
                  </nav>

                  <div className="flex items-center space-x-3">
                    <a 
                      href="https://github.com/open-bio-commons/openlbof-core" 
                      target="_blank" 
                      rel="noreferrer"
                      className="hidden sm:flex items-center space-x-2 px-3.5 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition-all hover:shadow-md"
                    >
                      <Code className="w-4 h-4 text-amber-400" />
                      <span>GitHub</span>
                    </a>
                    <a 
                      href="#community" 
                      className="flex items-center space-x-2 px-4 py-2 rounded-lg bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 text-xs font-bold transition-all transform hover:-translate-y-0.5 shadow-lg shadow-amber-500/25"
                    >
                      <span>OBCに参加</span>
                      <ChevronRight className="w-4 h-4" />
                    </a>
                  </div>
                </div>
              </header>

              <main className="relative z-10 pt-28">
                <section className="relative px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto pt-8 pb-16 md:pt-16 text-center">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-mono font-medium mb-8 backdrop-blur-sm shadow-inner">
                    <Sparkles className="w-3.5 h-3.5 text-amber-400" />
                    <span>Open Love-Based Objective Framework & Open Bio-Commons Council</span>
                  </div>

                  <h1 className="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight leading-[1.15] max-w-5xl mx-auto">
                    人間の脆弱性を肯定し、<br />
                    その尊厳と自律性を<br />
                    <span className="bg-gradient-to-r from-amber-300 via-amber-400 to-cyan-400 bg-clip-text text-transparent">
                      数学的に守り抜く全方位インフラ
                    </span>
                  </h1>

                  <p className="mt-8 text-lg sm:text-xl text-slate-300 max-w-3xl mx-auto font-normal leading-relaxed">
                    OpenLBOF は、加齢・パニック・災害・精神的過熱という不完全さを例外として排除せず、
                    目的関数 J を通じてシステム全体が優しく守護する、地球規模のオープンソース・パブリックコモンズです。
                  </p>

                  <div className="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4 max-w-md mx-auto">
                    <a 
                      href="#location-risk"
                      className="w-full sm:w-auto flex items-center justify-center gap-2 px-7 py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-sm shadow-xl shadow-amber-500/20 transition-all hover:scale-[1.02]"
                    >
                      <Navigation className="w-4 h-4" />
                      <span>現在地の危険リスクを診断</span>
                    </a>
                    <a 
                      href="#philosophy" 
                      className="w-full sm:w-auto flex items-center justify-center gap-2 px-7 py-3.5 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-slate-700/80 text-slate-200 font-semibold text-sm transition-all backdrop-blur-sm"
                    >
                      <FileText className="w-4 h-4 text-cyan-400" />
                      <span>マニフェスト全文を読破</span>
                    </a>
                  </div>
                </section>

                <section id="location-risk" className="py-16 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-t border-slate-800/60">
                  <div className="bg-gradient-to-r from-slate-900/90 via-slate-950 to-slate-900/90 border border-amber-500/30 rounded-2xl p-6 sm:p-10 backdrop-blur-xl shadow-2xl space-y-8 relative overflow-hidden">
                    <div className="absolute -right-20 -top-20 w-80 h-80 bg-amber-500/10 rounded-full blur-3xl pointer-events-none" />

                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 pb-6 border-b border-slate-800">
                      <div className="space-y-1">
                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-mono">
                          <Globe className="w-3.5 h-3.5 text-amber-400 animate-pulse" />
                          <span>Multi-Day Radar & Causal Pandemic Telemetry</span>
                          {isFetchingWeather && <span className="text-cyan-300 ml-1">(気象レーダー同期中...)</span>}
                        </div>
                        <h2 className="text-2xl sm:text-3xl font-bold text-white flex items-center gap-2">
                          現在地・詳細地域 冠水＆複合リスク算定モジュール
                        </h2>
                        <p className="text-xs sm:text-sm text-slate-400">
                          リアルタイム気象レーダーの降水量・排水能力・標高から「道路冠水・浸水確率」を算出し、Natech災害や2次避難所パンデミック確率と統合評価します
                        </p>
                      </div>

                      <div className="flex flex-wrap items-center gap-3 shrink-0">
                        <a
                          href={localRiskData.yahooRadarUrl}
                          target="_blank"
                          rel="noreferrer"
                          className="px-4 py-2.5 rounded-xl bg-cyan-950/80 hover:bg-cyan-900/80 border border-cyan-500/40 text-cyan-200 font-bold text-xs flex items-center gap-2 transition-all shadow-lg"
                        >
                          <CloudRain className="w-4 h-4 text-cyan-400" />
                          <span>Yahoo!雨雲レーダーで確認</span>
                          <ExternalLink className="w-3.5 h-3.5 opacity-75" />
                        </a>
                        <button
                          onClick={handleDetectLocation}
                          disabled={isLocating}
                          className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-bold text-xs flex items-center gap-2 transition-all shadow-lg shadow-amber-500/20 disabled:opacity-50"
                        >
                          <Navigation className={`w-4 h-4 ${isLocating ? 'animate-spin' : ''}`} />
                          <span>{isLocating ? '位置情報を測位中...' : '現在地GPSを取得して解析'}</span>
                        </button>
                      </div>
                    </div>

                    {locationError && (
                      <div className="p-3.5 rounded-xl bg-red-950/60 border border-red-700/50 text-red-200 text-xs flex items-center gap-2">
                        <AlertTriangle className="w-4 h-4 text-red-400 shrink-0" />
                        <span>{locationError}</span>
                      </div>
                    )}

                    {/* Step 1 & 2: 都道府県・詳細地域 ＆ 予測日数スライダー */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 p-5 rounded-xl bg-slate-950/70 border border-slate-800/80">
                      
                      {/* 都道府県＆詳細市区町村セレクタ (7 Cols) */}
                      <div className="lg:col-span-7 space-y-4">
                        <div className="space-y-2">
                          <div className="flex items-center justify-between text-xs text-slate-400 font-mono">
                            <span className="flex items-center gap-1.5 text-amber-300 font-semibold">
                              <MapPin className="w-3.5 h-3.5" /> 1. 都道府県を選択:
                            </span>
                            <span>対象: {userLocation ? 'GPS現在地' : riskCalculator.regionDatabase[selectedPref].pref}</span>
                          </div>
                          <div className="flex flex-wrap gap-1.5">
                            {Object.entries(riskCalculator.regionDatabase).map(([key, data]) => (
                              <button
                                key={key}
                                onClick={() => handlePrefChange(key)}
                                className={`px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all ${
                                  selectedPref === key && !userLocation
                                    ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md'
                                    : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-600'
                                }`}
                              >
                                {data.pref}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="space-y-2">
                          <div className="text-xs text-slate-400 font-mono">
                            2. 詳細地域・地形エリアを選択:
                          </div>
                          <div className="flex flex-wrap gap-2">
                            {Object.entries(riskCalculator.regionDatabase[selectedPref].areas).map(([aKey, aData]) => (
                              <button
                                key={aKey}
                                onClick={() => handleAreaChange(aKey)}
                                className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition-all text-left ${
                                  selectedAreaKey === aKey && !userLocation
                                    ? 'bg-cyan-500/20 text-cyan-200 border-cyan-500/60 shadow-inner'
                                    : 'bg-slate-900/80 text-slate-400 border-slate-800 hover:text-slate-200'
                                }`}
                              >
                                {aData.name}
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>

                      {/* 予測タイムフレーム（今後何日間か）コントロール (5 Cols) */}
                      <div className="lg:col-span-5 flex flex-col justify-between p-4 rounded-xl bg-slate-900/90 border border-slate-800 space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-semibold text-purple-300 flex items-center gap-1.5">
                            <Activity className="w-4 h-4 text-purple-400" />
                            3. 予測対象期間（タイムホライズン）
                          </span>
                          <span className="px-2.5 py-1 rounded-md bg-purple-950 border border-purple-500/40 text-purple-200 font-mono text-xs font-bold">
                            今後 {forecastDays} 日間
                          </span>
                        </div>

                        <div className="space-y-2">
                          <input
                            type="range"
                            min="1"
                            max="7"
                            value={forecastDays}
                            onChange={(e) => handleForecastDaysChange(Number(e.target.value))}

                    </div>

                    <div className="lg:col-span-7 bg-slate-900/90 border border-slate-800 rounded-2xl p-6 sm:p-8 backdrop-blur-md shadow-2xl relative">
                      <div className="text-xs font-mono text-slate-400 mb-4 flex items-center justify-between">
                        <span>Core Formulation Spec v1.2</span>
                        <span className="text-amber-400">Integral Form</span>
                      </div>

                      <div className="p-6 rounded-xl bg-[#060911] border border-slate-800 font-mono text-xs sm:text-sm md:text-base text-amber-300 overflow-x-auto text-center leading-loose shadow-inner">
                        J = ∫₀ᵀ [ w₁ I_bio(t) + w₂ C_stab(t) + w₃ M_mat(t) - w₄ E_pen(t) - λ Penalty_over ] dt
                      </div>

                      <div className="mt-8 p-6 rounded-xl bg-slate-950/80 border border-slate-800">
                        {activeMathItem === 'I_bio' && (
                          <div className="space-y-3">
                            <div className="text-emerald-400 font-mono text-sm font-bold flex items-center gap-2">
                              <Heart className="w-4 h-4" /> I_bio(t) : 生体・身体的完全性保持項
                            </div>
                            <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                              呼吸、脈拍、血流、脳ホメオスタシスの健全性を維持する項。個人の動的ベースラインからの異常乖離を監視します。
                            </p>
                          </div>
                        )}
                        {activeMathItem === 'C_stab' && (
                          <div className="space-y-3">
                            <div className="text-cyan-400 font-mono text-sm font-bold flex items-center gap-2">
                              <Activity className="w-4 h-4" /> C_stab(t) : 認知・精神的安定性保持項
                            </div>
                            <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                              パニック状態、過度なストレス、認知バイアス、意識混濁をモニタリングします。
                            </p>
                          </div>
                        )}
                        {activeMathItem === 'M_mat' && (
                          <div className="space-y-3">
                            <div className="text-amber-400 font-mono text-sm font-bold flex items-center gap-2">
                              <Sparkles className="w-4 h-4" /> M_mat(t) : 人間の成熟・自律的成長項
                            </div>
                            <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                              過保護による人間の能力低下を防ぎ、自律的な判断や学習を促すサポート評価項です。
                            </p>
                          </div>
                        )}
                        {activeMathItem === 'E_pen' && (
                          <div className="space-y-3">
                            <div className="text-rose-400 font-mono text-sm font-bold flex items-center gap-2">
                              <AlertTriangle className="w-4 h-4" /> E_pen(t) : システム摩擦・エントロピー損失項 (現在地リスク連動)
                            </div>
                            <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                              現在地モジュールで算出された危険度がダイナミックに加算されます。
                            </p>
                          </div>
                        )}
                        {activeMathItem === 'Penalty_over' && (
                          <div className="space-y-3">
                            <div className="text-purple-400 font-mono text-sm font-bold flex items-center gap-2">
                              <Shield className="w-4 h-4" /> Penalty_over-intervention : 過剰介入ペナルティ
                            </div>
                            <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                              スポーツ中の激しい動きなどを誤って異常と見なし、不当に人間の自由を制限した場合に課される過剰介入ペナルティです。
                            </p>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </section>

                <section id="governance" className="py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-t border-slate-800/60">
                  <div className="text-center max-w-3xl mx-auto mb-16">
                    <h2 className="text-xs font-mono font-bold tracking-widest text-emerald-400 uppercase">Governance & Charter</h2>
                    <p className="mt-3 text-3xl sm:text-4xl font-bold tracking-tight text-white">
                      オープン・バイオ・コモンズ評議会（OBC）
                    </p>
                    <p className="mt-4 text-slate-400 text-sm">
                      特定の企業・国家による技術の独占や監視を防ぐため、独立した3つの部会による合議制を採用しています。
                    </p>
                  </div>

                  <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 sm:p-8 backdrop-blur-md">
                    <div className="flex flex-wrap gap-3 border-b border-slate-800 pb-6">
                      {[
                        { id: 'engineering', label: 'オープンソース・エンジニアリング部会', icon: Code },
                        { id: 'bioethics', label: '生体倫理・人権擁護部会', icon: Scale },
                        { id: 'clinical', label: '臨床医学・公衆衛生部会', icon: Stethoscope }
                      ].map((tab) => {
                        const IconComponent = tab.icon;
                        return (
                          <button
                            key={tab.id}
                            onClick={() => setActiveGovernanceTab(tab.id)}
                            className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all ${
                              activeGovernanceTab === tab.id
                                ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20'
                                : 'bg-slate-800/60 text-slate-300 hover:bg-slate-800'
                            }`}
                          >
                            <IconComponent className="w-4 h-4" />
                            <span>{tab.label}</span>
                          </button>
                        );
                      })}
                    </div>

                    <div className="mt-8 text-slate-300 text-sm leading-relaxed">
                      {activeGovernanceTab === 'engineering' && (
                        <div className="space-y-4">
                          <h4 className="text-lg font-bold text-white flex items-center gap-2">
                            <Code className="w-5 h-5 text-amber-400" /> オープンソース・エンジニアリング部会
                          </h4>
                          <p>プロトコル開発者、暗号学者で構成。OpenLBOFコア仕様、セキュアエンクレーブの標準規格、およびゼロ知識証明（ZKP）のオープン開発を担当します。</p>
                        </div>
                      )}
                      {activeGovernanceTab === 'bioethics' && (
                        <div className="space-y-4">
                          <h4 className="text-lg font-bold text-white flex items-center gap-2">
                            <Scale className="w-5 h-5 text-amber-400" /> 生体倫理・人権擁護部会
                          </h4>
                          <p>人権活動家、哲学者で構成。個人の自己決定権が脅かされていないか、AIの介入が過剰になっていないかをゼロ知識証明技術を用いて継続監査します。</p>
                        </div>
                      )}
                      {activeGovernanceTab === 'clinical' && (
                        <div className="space-y-4">
                          <h4 className="text-lg font-bold text-white flex items-center gap-2">
                            <Stethoscope className="w-5 h-5 text-amber-400" /> 臨床医学・公衆衛生部会
                          </h4>
                          <p>救急医学専門医、公衆衛生学者で構成。危機発作判定アルゴリズムの医学的判定と避難所感染予防ロジックの評価を行います。</p>
                        </div>
                      )}
                    </div>
                  </div>
                </section>

                <section id="simulator" className="py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-t border-slate-800/60">
                  <div className="text-center max-w-3xl mx-auto mb-12">
                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-mono mb-3">
                      <Radio className="w-3.5 h-3.5 animate-pulse text-cyan-400" /> Interactive Edge Engine Simulator
                    </div>
                    <h2 className="text-3xl sm:text-4xl font-bold tracking-tight text-white">
                      生体シミュレータ & 目的関数 J 監視 (地域リスク統合)
                    </h2>
                  </div>

                  <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 sm:p-8 backdrop-blur-md shadow-2xl">
                    <div className="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-800">
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-mono text-slate-400">シナリオ選択:</span>
                        <div className="flex rounded-lg bg-slate-950 p-1 border border-slate-800">
                          <button
                            onClick={() => setSimContext('NORMAL')}
                            className={`px-3 py-1.5 rounded-md text-xs font-semibold transition-all ${
                              simContext === 'NORMAL' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'
                            }`}
                          >
                            1. 通常運転
                          </button>
                          <button
                            onClick={() => setSimContext('INTENSE_EXERCISE')}
                            className={`px-3 py-1.5 rounded-md text-xs font-semibold transition-all ${
                              simContext === 'INTENSE_EXERCISE' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'
                            }`}
                          >
                            2. 高負荷運動
                          </button>
                          <button
                            onClick={() => setSimContext('CRISIS')}
                            className={`px-3 py-1.5 rounded-md text-xs font-semibold transition-all ${
                              simContext === 'CRISIS' ? 'bg-rose-500 text-slate-950' : 'text-slate-400 hover:text-white'
                            }`}
                          >
                            3. 意識失調・急変 (Crisis)
                          </button>
                        </div>
                      </div>

                      <div className="flex items-center gap-3">
                        <button
                          onClick={() => setIsSimRunning(!isSimRunning)}
                          className="px-3.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold text-slate-200 hover:bg-slate-700 flex items-center gap-1.5"
                        >
                          <RefreshCw className={`w-3.5 h-3.5 ${isSimRunning ? 'animate-spin-slow text-emerald-400' : ''}`} />
                          <span>{isSimRunning ? '一時停止' : '再開'}</span>
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 my-6">
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400">目的関数 J スコア</div>
                        <div className={`text-xl font-bold font-mono mt-1 ${latestTelemetry.jScore >= 0 ? 'text-amber-400' : 'text-rose-400'}`}>
                          {latestTelemetry.jScore}
                        </div>
                      </div>
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400">介入ステージ</div>
                        <div className={`text-xs sm:text-sm font-bold font-mono mt-1 ${
                          latestTelemetry.stage?.includes('STAGE 2') ? 'text-rose-400' : 
                          latestTelemetry.stage?.includes('STAGE 1') ? 'text-amber-400' : 'text-emerald-400'
                        }`}>
                          {latestTelemetry.stage}
                        </div>
                      </div>
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400 font-medium text-amber-300">地域統合リスク (E_pen)</div>
                        <div className="text-xl font-bold font-mono mt-1 text-cyan-400">
                          {latestTelemetry.ePen}
                        </div>
                      </div>
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400">プライバシー</div>
                        <div className="text-xs font-bold font-mono mt-1 text-emerald-400 flex items-center gap-1">
                          <CheckCircle2 className="w-3.5 h-3.5" /> ローカル処理完結
                        </div>
                      </div>
                    </div>

                    <div className="h-64 sm:h-80 w-full mt-4">
                      <CustomLineChart data={simData} />
                    </div>
                  </div>
                </section>

                <section id="community" className="py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-t border-slate-800/60">
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                    <div className="lg:col-span-6 space-y-6">
                      <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-mono">
                        <Users className="w-3.5 h-3.5" /> Call for Contributors
                      </div>
                      <h2 className="text-3xl sm:text-4xl font-bold tracking-tight text-white">
                        共に「地域社会と人間の尊厳を守るインフラ」を創る仲間を募集
                      </h2>
                      <p className="text-slate-300 text-sm leading-relaxed">
                        OpenLBOF は、特定企業の製品ではなく、オープンな地域リスクデータとバイオシグナルを統合する地球規模のパブリックコモンズです。
                      </p>
                    </div>

                    <div className="lg:col-span-6 bg-slate-900/90 border border-slate-800 rounded-2xl p-6 sm:p-8 backdrop-blur-md shadow-2xl">
                      <h3 className="text-xl font-bold text-white mb-2">OBC 参画・お問い合わせ</h3>
                      {formSubmitted ? (
                        <div className="p-8 text-center space-y-4 bg-emerald-500/10 border border-emerald-500/30 rounded-xl">
                          <CheckCircle2 className="w-12 h-12 text-emerald-400 mx-auto" />
                          <h4 className="text-lg font-bold text-white">送信が完了しました</h4>
                        </div>
                      ) : (
                        <form onSubmit={handleFormSubmit} className="space-y-4">
                          <div>
                            <label className="block text-xs font-mono text-slate-300 mb-1.5">お名前 / Handle</label>
                            <input 
                              type="text" 
                              required
                              value={formData.name}
                              onChange={e => setFormData({ ...formData, name: e.target.value })}
                              placeholder="例: 山田 太郎" 
                              className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-mono text-slate-300 mb-1.5">メールアドレス</label>
                            <input 
                              type="email" 
                              required
                              value={formData.email}
                              onChange={e => setFormData({ ...formData, email: e.target.value })}
                              placeholder="name@domain.com" 
                              className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-mono text-slate-300 mb-1.5">メッセージ</label>
                            <textarea 
                              rows={4}
                              required
                              value={formData.message}
                              onChange={e => setFormData({ ...formData, message: e.target.value })}
                              placeholder="参画のご関心やご質問をご記入ください..." 
                              className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-amber-500 resize-none"
                            />
                          </div>
                          <button 
                            type="submit"
                            className="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-bold text-xs shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2"
                          >
                            <Send className="w-4 h-4" />
                            <span>送信してコミュニティに参加する</span>
                          </button>
                        </form>
                      )}
                    </div>
                  </div>
                </section>

              </main>

              <footer className="border-t border-slate-800/80 bg-[#060911] py-12 relative z-10">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-6">
                  <div className="flex items-center space-x-3">
                    <div className="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
                      <Heart className="w-4 h-4" />
                    </div>
                    <span className="text-sm font-bold text-slate-200">OpenLBOF / Open Bio-Commons Council</span>
                  </div>
                  <div className="text-xs text-slate-400 font-mono">
                    &copy; 2026 Open Bio-Commons Council (OBC).
                  </div>
                </div>
              </footer>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>

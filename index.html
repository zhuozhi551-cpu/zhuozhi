                    viewBox="0 0 24 24"

                    strokeLinecap="round"

        // リアルタイムPPG脈波チャートコンポーネント
        const PpgWaveformChart = ({ samples = [] }) => {
            const width = 480;
            const height = 110;
            if (samples.length < 2) {
                return (
                    <div className="w-full h-28 rounded-xl bg-slate-950/90 border border-slate-800 flex items-center justify-center text-xs font-mono text-slate-500">
                        カメラに指先を密着させるかデモ波形を開始すると脈波が表示されます
                    </div>
                );
            }
            const min = Math.min(...samples);
            const max = Math.max(...samples);
            const range = Math.max(0.01, max - min);
            const points = samples.map((val, idx) => {
                const x = (idx / Math.max(1, samples.length - 1)) * width;
                const y = height - 12 - ((val - min) / range) * (height - 24);
                return `${idx === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
            }).join(' ');

            return (
                <div className="w-full h-28 rounded-xl bg-slate-950/90 border border-rose-500/30 p-2 relative overflow-hidden">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full overflow-visible">
                        <path d={points} fill="none" stroke="#fb7185" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                    <span className="absolute top-2 right-3 text-[10px] font-mono text-rose-300 bg-rose-950/80 px-2 py-0.5 rounded border border-rose-500/30">
                        PPG Optical Pulse
                    </span>
                </div>
            );
        };

        // 1〜7日間のリスク推移グラフコンポーネント
        const RiskTimelineChart = ({ timeline = [], selectedDay = 3, mode = 'ACTUAL' }) => {
            if (!timeline.length) return null;
            const width = 620;
            const height = 210;
            const padding = { top: 20, right: 24, bottom: 34, left: 42 };
            const chartW = width - padding.left - padding.right;
            const chartH = height - padding.top - padding.bottom;

            const getX = (idx) => padding.left + (idx / Math.max(1, timeline.length - 1)) * chartW;
            const getY = (val) => padding.top + chartH - (Math.min(100, Math.max(0, val)) / 100) * chartH;

            const kInund = mode === 'ACTUAL' ? 'inundationRisk' : 'worstInundationRisk';
            const kNatech = mode === 'ACTUAL' ? 'natechRisk' : 'worstNatechRisk';
            const kOutbreak = mode === 'ACTUAL' ? 'outbreakRisk' : 'worstOutbreakRisk';

            const buildPath = (key) => timeline.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d[key])}`).join(' ');

            return (
                <div className="w-full space-y-2">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-48 sm:h-56 overflow-visible">
                        {[0, 25, 50, 75, 100].map((v) => (
                            <g key={v}>
                                <line x1={padding.left} y1={getY(v)} x2={width - padding.right} y2={getY(v)} stroke="#1e293b" strokeDasharray="3 3" strokeWidth="1" />
                                <text x={padding.left - 8} y={getY(v) + 4} fill="#64748b" fontSize="10" textAnchor="end" className="font-mono">{v}%</text>
                            </g>
                        ))}
                        {timeline.map((d, i) => {
                            const isSelected = d.day === selectedDay;
                            return (
                                <g key={d.day}>
                                    {isSelected && (
                                        <line x1={getX(i)} y1={padding.top} x2={getX(i)} y2={height - padding.bottom} stroke="#a855f7" strokeWidth="1.5" strokeDasharray="4 2" />
                                    )}
                                    <text x={getX(i)} y={height - 10} fill={isSelected ? "#e9d5ff" : "#94a3b8"} fontSize="10" fontWeight={isSelected ? "bold" : "normal"} textAnchor="middle" className="font-mono">
                                        {d.shortDate}
                                    </text>
                                </g>
                            );
                        })}
                        <path d={buildPath(kInund)} fill="none" stroke="#22d3ee" strokeWidth="2.5" />
                        <path d={buildPath(kNatech)} fill="none" stroke="#f87171" strokeWidth="2" strokeDasharray="5 3" />
                        <path d={buildPath(kOutbreak)} fill="none" stroke="#c084fc" strokeWidth="2.5" />
                        {timeline.map((d, i) => (
                            <g key={`pts-${d.day}`}>
                                <circle cx={getX(i)} cy={getY(d[kInund])} r={d.day === selectedDay ? 4.5 : 3} fill="#22d3ee" />
                                <circle cx={getX(i)} cy={getY(d[kNatech])} r={d.day === selectedDay ? 4 : 2.5} fill="#f87171" />
                                <circle cx={getX(i)} cy={getY(d[kOutbreak])} r={d.day === selectedDay ? 4.5 : 3} fill="#c084fc" />
                            </g>
                        ))}
                    </svg>
                    <div className="flex flex-wrap items-center justify-center gap-5 text-[11px] font-mono text-slate-300">
                        <span className="flex items-center gap-1.5"><span className="w-3 h-0.5 bg-cyan-400 inline-block"/> 道路冠水・内水氾濫</span>
                        <span className="flex items-center gap-1.5"><span className="w-3 h-0.5 bg-red-400 inline-block"/> Natechプラント爆発</span>
                        <span className="flex items-center gap-1.5"><span className="w-3 h-0.5 bg-purple-400 inline-block"/> 避難所パンデミック</span>
                    </div>
                </div>
            );

          calculateDetailedRisk({ 
            lat, lon, areaName, 
            baseRain = 45, shelterSpace = 2.2, industrialDensity = 0.6, nuclearFacility = false, elevation = 5.0, drainageCap = 48,
            forecastDays = 3, baseDateTimeStr = null,
            customShelterSqm = null, customVentLevel = 3,
            liveWeather = null 
          }) {
            const baseDate = baseDateTimeStr ? new Date(baseDateTimeStr) : new Date();
            const validBaseDate = isNaN(baseDate.getTime()) ? new Date() : baseDate;

            const formatJPDateTime = (d) => {
              const yyyy = d.getFullYear();
              const mm = String(d.getMonth() + 1).padStart(2, '0');
              const dd = String(d.getDate()).padStart(2, '0');
              const hh = String(d.getHours()).padStart(2, '0');
              const min = String(d.getMinutes()).padStart(2, '0');
              return `${yyyy}/${mm}/${dd} ${hh}:${min}`;
            };

            const liveHourlyRain = liveWeather ? liveWeather.currentRainMm : 0;
            const liveForecastSum = liveWeather ? liveWeather.forecastRainSum : 0;
            const liveMaxProb = liveWeather ? liveWeather.maxPrecipProb : null;
            const currentTemp = liveWeather?.currentTemp ?? 17.5;
            const currentHumidity = liveWeather?.currentHumidity ?? 62;

            const timeline = [];
            for (let d = 1; d <= 7; d++) {
              const stepDate = new Date(validBaseDate.getTime() + d * 24 * 60 * 60 * 1000);
              const shortDate = `${stepDate.getMonth() + 1}/${stepDate.getDate()}`;

              const actualPrecipProb = liveMaxProb !== null 
                ? Math.min(98, Math.max(5, Math.round(liveMaxProb * (0.85 + d * 0.03))))
                : Math.min(85, Math.max(10, Math.round(baseRain * 0.55 + (d * 2.5))));

              const actualExpRain = liveForecastSum > 0 
                ? Math.round((liveForecastSum / Math.max(1, forecastDays)) * d)
                : Math.round((actualPrecipProb / 100) * (18 + d * 10));

              const actualPeakHr = Math.max(liveHourlyRain, Math.round((actualExpRain / Math.max(1, d * 6)) * (actualPrecipProb / 65)));

              const elevFactor = Math.max(0.35, 1.35 - (elevation / 22));
              const actualDrainOverload = Math.min(1.5, actualPeakHr / Math.max(25, drainageCap));
              const actualInundationRisk = Math.min(95, Math.max(2, Math.round(
                ((actualDrainOverload * 42) + (actualPrecipProb * 0.18) + (actualExpRain / 4.5)) * elevFactor
              )));

              const actualNatechRisk = Math.min(92, Math.max(2, Math.round((industrialDensity * 22) + (actualInundationRisk * 0.55))));
              const evacuationTriggerProb = Math.min(1.0, Math.max(0.12, (actualInundationRisk / 75) + (d * 0.04)));

              const worstExpRain = Math.round(140 + d * 48 + (baseRain * 0.8));
              const worstPeakHr = Math.max(65, Math.round(75 + (baseRain * 0.25)));
              const worstDrainOverload = Math.min(1.8, worstPeakHr / Math.max(25, drainageCap));
              const worstInundationRisk = Math.min(99, Math.max(25, Math.round(
                ((worstDrainOverload * 52) + 28 + (worstExpRain / 8.0)) * elevFactor
              )));
              const worstNatechRisk = Math.min(98, Math.max(15, Math.round(industrialDensity * 68 + (worstInundationRisk * 0.32))));

              const startSqm = customShelterSqm !== null ? customShelterSqm : shelterSpace;
              const effSqm = Math.max(0.9, parseFloat((startSqm - (d - 1) * 0.13).toFixed(2)));
              const ventBoost = (customVentLevel - 3) * 0.85;
              const ventRate = Math.max(1.0, parseFloat((4.0 + ventBoost - (d * 0.22) - (3.5 - effSqm) * 0.35).toFixed(1)));

              const crowdFactor = Math.max(0.3, (3.8 - effSqm) / 2.2);
              const worstOutbreakRisk = Math.min(96, Math.max(15, Math.round((crowdFactor * 48) + (d * 5.2) + ((5.5 - ventRate) * 6.5))));
              const actualOutbreakRisk = Math.min(90, Math.max(3, Math.round(worstOutbreakRisk * evacuationTriggerProb)));

              timeline.push({
                day: d,
                shortDate,
                fullDateTime: formatJPDateTime(stepDate),
                inundationRisk: actualInundationRisk,
                natechRisk: actualNatechRisk,
                outbreakRisk: actualOutbreakRisk,
                worstInundationRisk,
                worstNatechRisk,
                worstOutbreakRisk,
                effectiveShelterSqm: effSqm,
                ventilationRate: ventRate
              });
            }

            const activeStep = timeline[Math.min(6, Math.max(0, forecastDays - 1))];
            const compositeEntropy = parseFloat(((activeStep.natechRisk * 0.35 + activeStep.inundationRisk * 0.32 + activeStep.outbreakRisk * 0.33) / 100).toFixed(2));

            let primaryThreat = `【現在の予報】今後${forecastDays}日間の実測ベース冠水確率は${activeStep.inundationRisk}%（実際のパンデミック確率${activeStep.outbreakRisk}%）ですが、仮に豪雨が直撃した場合の潜在冠水リスクは${activeStep.worstInundationRisk}%に達します。`;
            let recommendedAction = '平時のうちはハザードマップで「高台ルート」と「1人3.5㎡以上の2次避難先」を確認し、雨雲レーダーの警戒ライン超えに備えてください。';

            if (nuclearFacility) {
              primaryThreat = `【原子力・重要インフラ複合警戒域】本エリアは原子力関連施設および臨海インフラの近接圏です。現在予報のNatech・複合リスクは${activeStep.natechRisk}%ですが、豪雨・地震・停電等の複合事象発生時の潜在リスクは${activeStep.worstNatechRisk}%に達します。`;
              recommendedAction = `自治体の原子力防災計画（UPZ/PAZ区分）に基づく「屋内退避施設（コンクリート建物）」と「風向に応じた広域避難ルート・安定ヨウ素剤配布場所」を事前確認してください。`;
            } else if (activeStep.worstNatechRisk >= 68) {
              primaryThreat = `【大雨発生時の潜在Natech脅威】現在の実発生確率は${activeStep.natechRisk}%ですが、仮に豪雨が発生すると冠水確率${activeStep.worstInundationRisk}%に伴い臨海工業・造船重工業帯の爆発・ガス漏洩リスクが${activeStep.worstNatechRisk}%へ急騰します。`;
              recommendedAction = `大雨・高潮警報発令時は冠水が始まる前に、風上かつ標高20m以上の指定高台エリアへ即時退避してください。`;
            }

            let thermalCare = {
              status: '快適・安定域（自律神経負荷：低）',
              badgeColor: 'text-emerald-300 border-emerald-500/40 bg-emerald-950/50',
              advice: `現在気温 ${currentTemp}℃・湿度 ${currentHumidity}% は比較的穏やかです。脱ぎ着しやすい重ね着とこまめな水分補給で自律神経を安定させましょう。`
            };
            if (currentTemp <= 12) {
              thermalCare = {
                status: '寒冷・低体温警戒域（保温・血流ケア必須）',
                badgeColor: 'text-cyan-300 border-cyan-500/40 bg-cyan-950/50',
                advice: `気温が ${currentTemp}℃ と低く、避難所や車中泊では底冷えによる低体温症や血圧上昇リスクが高まります。断熱シートを床に敷き、首・手首・足首を保護してください。`
              };
            }

            const actionChecklist = [
              { id: 'chk_hazard', phase: 'フェーズ1：事前確認', text: `国土地理院ハザードマップと雨雲レーダーで「標高20m以上の高台・風上避難ルート」を確認する` },
              { id: 'chk_shelter', phase: 'フェーズ2：分散避難', text: `2次避難所（ホテル・親戚宅・分散施設）の連絡先と「1人3.5㎡以上の空間・換気」を確保する` },
              { id: 'chk_care', phase: 'フェーズ3：携行品・医療', text: `防寒具・アルミ保温シート・常備薬・モバイルバッテリーをすぐ持ち出せる位置にまとめる` }
            ];

            const yahooRadarUrl = `https://weather.yahoo.co.jp/weather/zoomradar/?lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}&z=12`;
            const gsiHazardUrl = `https://disaportal.gsi.go.jp/maps/index.html?ll=${lat.toFixed(4)},${lon.toFixed(4)}&z=14&base=pale&ls=seamless%7Cdisaster1%7Cdisaster2%7Cdisaster3&disp=0111&vs=c1j0l0u0t0h0z0`;

            return {
              areaName: areaName || `GPS測位地点 (${lat.toFixed(3)}, ${lon.toFixed(3)})`,
              lat: lat.toFixed(4),
              lon: lon.toFixed(4),
              nuclearFacility,
              baseDateTimeFormatted: formatJPDateTime(validBaseDate),
              targetDateTimeFormatted: activeStep.fullDateTime,
              forecastDays,
              compositeEntropy,
              natechRisk: activeStep.natechRisk,
              inundationRisk: activeStep.inundationRisk,
              outbreakRisk: activeStep.outbreakRisk,
              worstNatechRisk: activeStep.worstNatechRisk,
              worstInundationRisk: activeStep.worstInundationRisk,
              worstOutbreakRisk: activeStep.worstOutbreakRisk,
              yahooRadarUrl,
              gsiHazardUrl,
              timeline,
              thermalCare,
              actionChecklist,
              factors: {
                currentTemp,
                currentHumidity,
                drainageCap,
                effectiveShelterSqm: activeStep.effectiveShelterSqm,
                ventilationRate: activeStep.ventilationRate,
                industrialDensityPct: Math.round(industrialDensity * 100),
                elevation
              },
              primaryThreat,
              recommendedAction,
              timestamp: new Date().toLocaleTimeString('ja-JP')
            };
          }
        }

        const riskCalculator = new LocalRiskCalculatorEngine();

        function App() {
          const [isScrolled, setIsScrolled] = useState(false);
          const [activeMathItem, setActiveMathItem] = useState('I_bio');
          const [simContext, setSimContext] = useState('NORMAL');
          const [simTime, setSimTime] = useState(0);
          const [simData, setSimData] = useState([]);
          const [isSimRunning, setIsSimRunning] = useState(true);
          const [formSubmitted, setFormSubmitted] = useState(false);
          const [formData, setFormData] = useState({ name: '', email: '', message: '' });

          // --- バイオセンサーエンジン（PPG / 音声 / BLE）ステート ---
          const [isPpgActive, setIsPpgActive] = useState(false);
          const [ppgStatusMsg, setPpgStatusMsg] = useState('待機中（背面カメラ＋LEDフラッシュ、またはデモ波形を起動できます）');
          const [bpm, setBpm] = useState(68);
          const [hrvStress, setHrvStress] = useState(24); // 0-100（低いほどリラックス）
          const [ppgSamples, setPpgSamples] = useState([]);
          const videoRef = useRef(null);
          const canvasRef = useRef(null);
          const ppgStreamRef = useRef(null);
          const ppgAnimRef = useRef(null);

          // 音声マイクロ特徴量ステート
          const [isVoiceActive, setIsVoiceActive] = useState(false);
          const [voiceFatigue, setVoiceFatigue] = useState(28); // 0-100
          const [voiceEnergyLevel, setVoiceEnergyLevel] = useState(82); // 0-100
          const [voiceStatusMsg, setVoiceStatusMsg] = useState('待機中（マイクから声のトーン揺らぎをローカル解析）');
          const voiceStreamRef = useRef(null);
          const voiceAnimRef = useRef(null);

          // ESP32 / Raspberry Pi Pico Web Bluetooth ステート
          const [bleDeviceName, setBleDeviceName] = useState(null);
          const [bleStatusMsg, setBleStatusMsg] = useState('未接続（ESP32 / Pico MAX30102 心拍サービス対応）');

          // 地域・気象リスクステート
          const [userLocation, setUserLocation] = useState(null);
          const [isLocating, setIsLocating] = useState(false);
          const [isFetchingWeather, setIsFetchingWeather] = useState(false);
          const [liveWeatherCache, setLiveWeatherCache] = useState(null);
          const [locationError, setLocationError] = useState(null);
          const [selectedPref, setSelectedPref] = useState('okayama');
          const [selectedAreaKey, setSelectedAreaKey] = useState('tamano_mitsui');
          const [forecastDays, setForecastDays] = useState(3);
          const [customShelterSqm, setCustomShelterSqm] = useState(2.8);
          const [customVentLevel, setCustomVentLevel] = useState(3);
          const [checkedItems, setCheckedItems] = useState({});
          const [copiedShareMsg, setCopiedShareMsg] = useState(false);
          const [copiedMedicalMsg, setCopiedMedicalMsg] = useState(false);
          const [riskScenarioMode, setRiskScenarioMode] = useState('ACTUAL');

          const [sosProfile, setSosProfile] = useState(() => {
            try {
              const saved = localStorage.getItem('openlbof_sos_profile');
              if (saved) return JSON.parse(saved);
            } catch (e) {}
            return { userName: '', bloodType: '未設定', medicalNotes: '', emergencyContact: '', meetingPoint: '', secondaryShelter: '' };
          });
          const [profileSavedToast, setProfileSavedToast] = useState(false);

          const [localRiskData, setLocalRiskData] = useState(() => {
            const initArea = riskCalculator.regionDatabase.okayama.areas.tamano_mitsui;
            return riskCalculator.calculateDetailedRisk({ ...initArea, forecastDays: 3 });
          });

          // --- 1. スマホカメラ PPG（光電容積脈波）計測エンジン ---
          const stopPpgCamera = () => {
            if (ppgAnimRef.current) cancelAnimationFrame(ppgAnimRef.current);
            if (ppgStreamRef.current) {
              ppgStreamRef.current.getTracks().forEach(t => t.stop());
              ppgStreamRef.current = null;
            }
            setIsPpgActive(false);
            setPpgStatusMsg('停止中（データはサーバーへ送信されず破棄されました）');
          };

          const startPpgCamera = async () => {
            if (isPpgActive) {
              stopPpgCamera();
              return;
            }
            setIsPpgActive(true);
            setPpgStatusMsg('カメラ起動中... 背面カメラとフラッシュに指先を優しく当ててください');

            let redHistory = [];
            let timeHistory = [];
            let demoPhase = 0;

            try {
              const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: 'environment' }, width: { ideal: 160 }, height: { ideal: 120 } }
              });
              ppgStreamRef.current = stream;
              const track = stream.getVideoTracks()[0];
              if (track && track.getCapabilities) {
                const caps = track.getCapabilities();
                if (caps.torch) {
                  await track.applyConstraints({ advanced: [{ torch: true }] }).catch(() => {});
                }
              }
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
                await videoRef.current.play();
              }
              setPpgStatusMsg('光学PPG計測中：LED光による指先の血流変化をリアルタイム抽出中');

              const processFrame = () => {
                if (!videoRef.current || !canvasRef.current) return;
                const ctx = canvasRef.current.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(videoRef.current, 0, 0, 40, 40);
                const frame = ctx.getImageData(0, 0, 40, 40).data;
                let redSum = 0;
                for (let i = 0; i < frame.length; i += 4) {
                  redSum += frame[i];
                }
                const avgRed = redSum / (frame.length / 4);
                const now = performance.now();

                redHistory.push(avgRed);
                timeHistory.push(now);
                if (redHistory.length > 90) {
                  redHistory.shift();
                  timeHistory.shift();
                }

                // 簡易ピーク検出による心拍数・揺らぎ算出
                if (redHistory.length > 30) {
                  const mean = redHistory.reduce((a, b) => a + b, 0) / redHistory.length;
                  const normalized = redHistory.map(v => v - mean);
                  setPpgSamples(normalized.slice(-60));

                  let peaks = [];
                  for (let i = 2; i < normalized.length - 2; i++) {
                    if (normalized[i] > 0.4 && normalized[i] > normalized[i - 1] && normalized[i] > normalized[i + 1]) {
                      if (peaks.length === 0 || (timeHistory[i] - peaks[peaks.length - 1]) > 380) {
                        peaks.push(timeHistory[i]);
                      }
                    }
                  }
                  if (peaks.length >= 2) {
                    const intervals = [];
                    for (let i = 1; i < peaks.length; i++) intervals.push(peaks[i] - peaks[i - 1]);
                    const avgIbi = intervals.reduce((a, b) => a + b, 0) / intervals.length;
                    const calcBpm = Math.min(165, Math.max(48, Math.round(60000 / avgIbi)));
                    setBpm(calcBpm);

                    // RMSSD近似による自律神経ストレス評価
                    let sqDiffSum = 0;
                    for (let i = 1; i < intervals.length; i++) {
                      sqDiffSum += Math.pow(intervals[i] - intervals[i - 1], 2);
                    }
                    const rmssd = intervals.length > 1 ? Math.sqrt(sqDiffSum / (intervals.length - 1)) : 45;
                    const stressScore = Math.min(95, Math.max(10, Math.round(100 - Math.min(85, rmssd))));
                    setHrvStress(stressScore);
                  }
                }
                ppgAnimRef.current = requestAnimationFrame(processFrame);
              };
              ppgAnimRef.current = requestAnimationFrame(processFrame);
            } catch (err) {
              // カメラ未許可・PC環境時は光学PPGシミュレーションモードへ自動フォールバック
              setPpgStatusMsg('光学PPGシミュレーター稼働中（カメラ未接続環境のため合成脈波を生成）');
              const runDemoPpg = () => {
                demoPhase += 0.18;
                const wave = Math.sin(demoPhase) + 0.45 * Math.sin(demoPhase * 2 - 0.8) + (Math.random() - 0.5) * 0.12;
                redHistory.push(wave);
                if (redHistory.length > 60) redHistory.shift();
                setPpgSamples([...redHistory]);
                if (Math.random() < 0.08) {
                  setBpm(prev => Math.min(88, Math.max(62, prev + (Math.random() > 0.5 ? 1 : -1))));
                  setHrvStress(prev => Math.min(45, Math.max(18, prev + (Math.random() > 0.5 ? 1 : -1))));
                }
                ppgAnimRef.current = requestAnimationFrame(runDemoPpg);
              };
              ppgAnimRef.current = requestAnimationFrame(runDemoPpg);
            }
          };

          // --- 2. 音声マイクロ特徴量（ピッチ揺らぎ・メンタル疲労）解析 ---
          const stopVoiceAnalyzer = () => {
            if (voiceAnimRef.current) cancelAnimationFrame(voiceAnimRef.current);
            if (voiceStreamRef.current) {
              voiceStreamRef.current.getTracks().forEach(t => t.stop());
              voiceStreamRef.current = null;
            }
            setIsVoiceActive(false);
            setVoiceStatusMsg('停止中（音声データは録音・送信されません）');
          };

          const startVoiceAnalyzer = async () => {
            if (isVoiceActive) {
              stopVoiceAnalyzer();
              return;
            }
            setIsVoiceActive(true);
            setVoiceStatusMsg('マイク起動中... 普段通りに話しかけるか深呼吸してください');

            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              voiceStreamRef.current = stream;
              const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              const source = audioCtx.createMediaStreamSource(stream);
              const analyser = audioCtx.createAnalyser();
              analyser.fftSize = 256;
              source.connect(analyser);
              const dataArray = new Uint8Array(analyser.frequencyBinCount);

              setVoiceStatusMsg('音声マイクロ特徴量解析中：声の周波数揺らぎから疲労度を評価中');
              const analyzeAudio = () => {
                analyser.getByteFrequencyData(dataArray);
                let energy = 0;
                let highFreq = 0;
                for (let i = 0; i < dataArray.length; i++) {
                  energy += dataArray[i];
                  if (i > 40) highFreq += dataArray[i];
                }
                const avgEnergy = energy / dataArray.length;
                if (avgEnergy > 8) {
                  const tensionRatio = highFreq / Math.max(1, energy);
                  const fatigue = Math.min(92, Math.max(12, Math.round(tensionRatio * 140)));
                  setVoiceFatigue(fatigue);
                  setVoiceEnergyLevel(Math.max(15, 100 - fatigue));
                }
                voiceAnimRef.current = requestAnimationFrame(analyzeAudio);
              };
              voiceAnimRef.current = requestAnimationFrame(analyzeAudio);
            } catch (err) {
              setVoiceStatusMsg('音声解析デモ稼働中（マイク未接続環境のため環境バイオリズム推定中）');
              const runDemoVoice = () => {
                if (Math.random() < 0.06) {
                  setVoiceFatigue(prev => Math.min(48, Math.max(18, prev + (Math.random() > 0.5 ? 2 : -2))));
                  setVoiceEnergyLevel(prev => Math.min(90, Math.max(55, prev + (Math.random() > 0.5 ? 2 : -2))));
                }
                voiceAnimRef.current = requestAnimationFrame(runDemoVoice);
              };
              voiceAnimRef.current = requestAnimationFrame(runDemoVoice);
            }
          };

          // --- 3. ESP32 / Raspberry Pi Pico (Web Bluetooth Heart Rate Service) 連携 ---
          const connectBleSensor = async () => {
            if (!navigator.bluetooth) {
              setBleStatusMsg('お使いのブラウザはWeb Bluetoothに非対応です（Chrome/Edge推奨）');
              return;
            }
            try {
              setBleStatusMsg('ESP32 / Pico デバイスを検索中...');
              const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['heart_rate'] }],
                optionalServices: ['battery_service']
              });
              const server = await device.gatt.connect();
              const service = await server.getPrimaryService('heart_rate');
              const char = await service.getCharacteristic('heart_rate_measurement');
              await char.startNotifications();
              char.addEventListener('characteristicvaluechanged', (e) => {
                const value = e.target.value;
                const flags = value.getUint8(0);
                const rate16Bits = flags & 0x1;
                const hr = rate16Bits ? value.getUint16(1, true) : value.getUint8(1);
                setBpm(hr);
              });
              setBleDeviceName(device.name || 'ESP32/Pico PPG Node');
              setBleStatusMsg(`接続完了: ${device.name || 'ESP32/Pico'} からリアルタイム心拍受信中`);
            } catch (err) {
              setBleStatusMsg('BLE接続がキャンセルされたか、近くにデバイスが見つかりませんでした');
            }
          };

          useEffect(() => {
            return () => {
              stopPpgCamera();
              stopVoiceAnalyzer();
            };
          }, []);

          // バイオセンサー総合健全度（0.0〜1.0）
          const bioSensorHealthScore = useMemo(() => {
            const bpmDeviation = Math.abs(bpm - 70) / 80;
            const stressPenalty = (hrvStress / 100) * 0.35;
            const voicePenalty = (voiceFatigue / 100) * 0.25;
            return parseFloat(Math.max(0.15, Math.min(0.99, 1.0 - bpmDeviation * 0.4 - stressPenalty - voicePenalty)).toFixed(2));
          }, [bpm, hrvStress, voiceFatigue]);

          const fetchRadarPrecipitation = async (
            lat, lon, areaObjOrName, days, isGps = false,
            overrideSqm = customShelterSqm, overrideVent = customVentLevel
          ) => {
            setIsFetchingWeather(true);
            try {
              const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,rain&hourly=precipitation_probability,precipitation&forecast_days=${Math.min(7, Math.max(1, days))}&timezone=Asia%2FTokyo`;
              const res = await fetch(url);
              if (!res.ok) throw new Error('Weather API unavailable');
              const data = await res.json();

              const currentRainMm = data.current?.precipitation ?? 0;
              const currentTemp = data.current?.temperature_2m ?? 17.5;
              const currentHumidity = data.current?.relative_humidity_2m ?? 60;
              const probs = data.hourly?.precipitation_probability || [];
              const rains = data.hourly?.precipitation || [];

              const liveWeather = {
                currentRainMm,
                currentTemp,
                currentHumidity,
                maxPrecipProb: probs.length > 0 ? Math.max(...probs) : null,
                forecastRainSum: Math.round(rains.reduce((acc, v) => acc + (v || 0), 0) * 10) / 10
              };
              setLiveWeatherCache(liveWeather);

              if (isGps) {
                setLocalRiskData(riskCalculator.calculateDetailedRisk({
                  lat, lon, areaName: areaObjOrName, forecastDays: days,
                  customShelterSqm: overrideSqm, customVentLevel: overrideVent, liveWeather
                }));
              } else {
                setLocalRiskData(riskCalculator.calculateDetailedRisk({
                  ...areaObjOrName, forecastDays: days,
                  customShelterSqm: overrideSqm, customVentLevel: overrideVent, liveWeather
                }));
              }
            } catch (err) {
              setLiveWeatherCache(null);
              if (isGps) {
                setLocalRiskData(riskCalculator.calculateDetailedRisk({
                  lat, lon, areaName: areaObjOrName, forecastDays: days,
                  customShelterSqm: overrideSqm, customVentLevel: overrideVent
                }));
              } else {
                setLocalRiskData(riskCalculator.calculateDetailedRisk({
                  ...areaObjOrName, forecastDays: days,
                  customShelterSqm: overrideSqm, customVentLevel: overrideVent
                }));
              }
            } finally {
              setIsFetchingWeather(false);
            }
          };

          useEffect(() => {
            const initArea = riskCalculator.regionDatabase[selectedPref].areas[selectedAreaKey];
            setCustomShelterSqm(initArea.shelterSpace);
            fetchRadarPrecipitation(initArea.lat, initArea.lon, initArea, forecastDays, false, initArea.shelterSpace, customVentLevel);
          }, []);

          const recalculateWithCurrentWeather = (nextDays, nextSqm, nextVent) => {
            if (userLocation) {
              setLocalRiskData(riskCalculator.calculateDetailedRisk({
                lat: userLocation.lat, lon: userLocation.lon, areaName: '現在地GPS測位エリア',
                forecastDays: nextDays, customShelterSqm: nextSqm, customVentLevel: nextVent, liveWeather: liveWeatherCache
              }));
            } else {
              const areaObj = riskCalculator.regionDatabase[selectedPref].areas[selectedAreaKey];
              setLocalRiskData(riskCalculator.calculateDetailedRisk({
                ...areaObj, forecastDays: nextDays, customShelterSqm: nextSqm, customVentLevel: nextVent, liveWeather: liveWeatherCache
              }));
            }
          };

          const handleDetectLocation = () => {
            setIsLocating(true);
            setLocationError(null);
            if (!navigator.geolocation) {
              setLocationError('お使いのブラウザは位置情報に対応していません。都道府県から選択してください。');
              setIsLocating(false);
              return;
            }
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                const { latitude, longitude } = pos.coords;
                setUserLocation({ lat: latitude, lon: longitude });
                fetchRadarPrecipitation(latitude, longitude, '現在地GPS測位エリア', forecastDays, true, customShelterSqm, customVentLevel);
                setIsLocating(false);
              },
              () => {
                setLocationError('位置情報の取得が許可されていないため、都道府県選択をご利用ください。');
                setIsLocating(false);
              },
              { timeout: 8000, enableHighAccuracy: true }
            );
          };

          const handlePrefChange = (prefKey) => {
            setUserLocation(null);
            setSelectedPref(prefKey);
            const firstAreaKey = Object.keys(riskCalculator.regionDatabase[prefKey].areas)[0];
            setSelectedAreaKey(firstAreaKey);
            const areaObj = riskCalculator.regionDatabase[prefKey].areas[firstAreaKey];
            setCustomShelterSqm(areaObj.shelterSpace);
            fetchRadarPrecipitation(areaObj.lat, areaObj.lon, areaObj, forecastDays, false, areaObj.shelterSpace, customVentLevel);
          };

          const handleAreaChange = (areaKey) => {
            setUserLocation(null);
            setSelectedAreaKey(areaKey);
            const areaObj = riskCalculator.regionDatabase[selectedPref].areas[areaKey];
            setCustomShelterSqm(areaObj.shelterSpace);
            fetchRadarPrecipitation(areaObj.lat, areaObj.lon, areaObj, forecastDays, false, areaObj.shelterSpace, customVentLevel);
          };

          const copyToClipboardSafe = (text, setFlag) => {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();
            try {
              document.execCommand('copy');
              setFlag(true);
              setTimeout(() => setFlag(false), 3500);
            } catch (e) {}
            document.body.removeChild(textArea);
          };

          const handleCopyFamilyShare = () => {
            const shareText = `【OpenLBOF 安心・防災＆生体状況共有】\n` +
              `■ 対象エリア: ${localRiskData.areaName} (${localRiskData.lat}, ${localRiskData.lon})\n` +
              `■ 生体状態: 心拍 ${bpm} BPM / 自律神経ストレス指数 ${hrvStress}% / 音声疲労度 ${voiceFatigue}%\n` +
              `■ リスク予測(${localRiskData.forecastDays}日後): 冠水 ${localRiskData.inundationRisk}% / Natech ${localRiskData.natechRisk}% / 避難所感染 ${localRiskData.outbreakRisk}%\n` +
              (sosProfile.meetingPoint ? `■ 家族集合場所: ${sosProfile.meetingPoint}\n` : '') +
              `■ 行動方針: ${localRiskData.recommendedAction}`;
            copyToClipboardSafe(shareText, setCopiedShareMsg);
          };

          const handleCopyMedicalCard = () => {
            const medText = `【緊急救助・医療伝達サマリー (OpenLBOF)】\n` +
              `■ 氏名: ${sosProfile.userName || '未入力'} / 血液型: ${sosProfile.bloodType}\n` +
              `■ 現在の計測バイタル: 心拍 ${bpm} BPM / ストレス指数 ${hrvStress}%\n` +
              `■ 持病・常備薬: ${sosProfile.medicalNotes || '特記事項なし'}\n` +
              `■ 緊急連絡先: ${sosProfile.emergencyContact || '未入力'}\n` +
              `■ 現在解析地点: ${localRiskData.areaName}`;
            copyToClipboardSafe(medText, setCopiedMedicalMsg);
          };

          const handleSaveSosProfile = (e) => {
            e.preventDefault();
            try {
              localStorage.setItem('openlbof_sos_profile', JSON.stringify(sosProfile));
              setProfileSavedToast(true);
              setTimeout(() => setProfileSavedToast(false), 3000);
            } catch (err) {}
          };

          useEffect(() => {
            const handleScroll = () => setIsScrolled(window.scrollY > 20);
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          // ライブ目的関数 J シミュレーター（バイオセンサー実測値＋地域リスク統合）
          useEffect(() => {
            if (!isSimRunning) return;
            const interval = setInterval(() => {
              setSimTime(prev => {
                const nextTime = prev + 1;
                setSimData(currentData => {
                  let rawSignal = bioSensorHealthScore + Math.sin(nextTime * 0.25) * 0.04;
                  let baseline = 0.78 + Math.sin(nextTime * 0.05) * 0.02;

                  if (simContext === 'INTENSE_EXERCISE') {
                    rawSignal = 0.85 + Math.sin(nextTime * 0.4) * 0.08;
                    baseline = 0.80;
                  } else if (simContext === 'CRISIS') {
                    rawSignal = 0.12 + (Math.random() - 0.5) * 0.03;
                    baseline = 0.75;
                  }

                  const i_bio = Math.max(0, Math.min(1, rawSignal));
                  const e_pen = simContext === 'CRISIS' ? 0.95 : (simContext === 'INTENSE_EXERCISE' ? 0.42 : Math.max((1 - i_bio) * 0.9, localRiskData.compositeEntropy * 0.85));
                  const c_stab = Math.max(0, 1 - (voiceFatigue / 100) * 0.5 - e_pen * 0.4);
                  const m_mat = 0.85;
                  const isHighEffort = simContext === 'INTENSE_EXERCISE';
                  const overInterventionRisk = isHighEffort && e_pen > 0.4 ? 0.75 : 0.05;
                  const lambdaPenalty = 4.0;

                  const j_score = (1.0 * i_bio) + (1.0 * c_stab) + (0.5 * m_mat) - (2.0 * e_pen) - (lambdaPenalty * overInterventionRisk);

                  let stage = 'STAGE 0 (定常見守り)';
                  if (e_pen > 0.8 || i_bio < 0.25) {
                    stage = 'STAGE 2 (ハードオーバーライド)';
                  } else if (e_pen > 0.40 && !isHighEffort) {
                    stage = 'STAGE 1 (ソフトバッファ介入)';
                  }

                  const newPoint = {
                    time: nextTime,
                    rawSignal: parseFloat(rawSignal.toFixed(3)),
                    baseline: parseFloat(baseline.toFixed(3)),
                    jScore: parseFloat(j_score.toFixed(3)),
                    ePen: parseFloat(e_pen.toFixed(3)),
                    stage
                  };

                  const updated = [...currentData, newPoint];
                  if (updated.length > 25) updated.shift();
                  return updated;
                });
                return nextTime;
              });
            }, 450);

            return () => clearInterval(interval);
          }, [isSimRunning, simContext, localRiskData, bioSensorHealthScore, voiceFatigue]);

          const latestTelemetry = useMemo(() => {
            if (simData.length === 0) return { jScore: 0, stage: 'STAGE 0 (定常見守り)', ePen: 0 };
            return simData[simData.length - 1];
          }, [simData]);

          const completedCount = Object.values(checkedItems).filter(Boolean).length;

          return (
            <div className="min-h-screen bg-[#090D16] text-slate-100 font-sans selection:bg-amber-500/30 selection:text-amber-200 relative overflow-x-hidden">
              <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
                <div className="absolute -top-40 -left-40 w-96 h-96 bg-amber-600/10 rounded-full blur-[120px]" />
                <div className="absolute top-1/3 -right-40 w-[500px] h-[500px] bg-cyan-600/10 rounded-full blur-[150px]" />
                <div className="absolute -bottom-40 left-1/3 w-[600px] h-[600px] bg-indigo-600/10 rounded-full blur-[180px]" />
              </div>

              {/* Navigation Header */}
              <header className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${isScrolled ? 'bg-[#090D16]/90 backdrop-blur-md border-b border-slate-800/80 py-3 shadow-2xl' : 'bg-transparent py-5'}`}>
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
                  <div className="flex items-center space-x-3 cursor-pointer" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>
                    <div className="relative flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 p-[1px] shadow-lg shadow-amber-500/20">
                      <div className="w-full h-full bg-[#090D16] rounded-[11px] flex items-center justify-center">
                        <Heart className="w-5 h-5 text-amber-400 fill-amber-400/20 animate-pulse" />
                      </div>
                    </div>
                    <div>
                      <span className="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-amber-200 bg-clip-text text-transparent">
                        OpenLBOF
                      </span>
                      <span className="hidden sm:inline-block ml-2 text-xs px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-amber-400 font-mono">
                        実践防災＆バイオセンサーインフラ
                      </span>
                    </div>
                  </div>

                  <nav className="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-300">
                    <a href="#biosensor-engine" className="hover:text-rose-400 transition-colors flex items-center gap-1.5 text-rose-300 font-semibold">
                      <Activity className="w-4 h-4" /> バイオセンサー計測
                    </a>
                    <a href="#location-risk" className="hover:text-amber-400 transition-colors flex items-center gap-1.5 text-amber-300">
                      <MapPin className="w-4 h-4" /> 地域リスク診断
                    </a>
                    <a href="#personal-sos" className="hover:text-emerald-400 transition-colors flex items-center gap-1.5 text-emerald-300">
                      <ClipboardList className="w-4 h-4" /> 緊急SOSカード
                    </a>
                    <a href="#math-core" className="hover:text-cyan-400 transition-colors">目的関数 J</a>
                  </nav>

                  <div className="flex items-center space-x-2">
                    <button
                      onClick={handleCopyFamilyShare}
                      className="flex items-center space-x-1.5 px-3.5 py-2 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/50 text-emerald-200 text-xs font-bold transition-all"
                    >
                      <Copy className="w-3.5 h-3.5" />
                      <span>{copiedShareMsg ? 'コピー完了!' : '家族へ状況共有'}</span>
                    </button>
                  </div>
                </div>
              </header>

              <main className="relative z-10 pt-28">
                {/* 1. HERO HEADER */}
                <section className="relative px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto pt-4 pb-10 text-center">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-mono font-medium mb-5 backdrop-blur-sm">
                    <Sparkles className="w-3.5 h-3.5 text-amber-400" />
                    <span>Open Love-Based Objective Framework ・ 生体計測＆防災統合版</span>
                  </div>

                  <h1 className="text-3xl sm:text-5xl font-extrabold tracking-tight leading-[1.2] max-w-5xl mx-auto">
                    人間の脆弱性を肯定し、<br />
                    心拍・自律神経・地域災害リスクを統合して<br />
                    <span className="bg-gradient-to-r from-rose-300 via-amber-300 to-cyan-400 bg-clip-text text-transparent">
                      目的関数 J で尊厳と命を守り抜く
                    </span>
                  </h1>

                  <p className="mt-5 text-sm sm:text-base text-slate-300 max-w-3xl mx-auto leading-relaxed">
                    スマホカメラPPG（光電容積脈波）計測、音声マイクロ特徴量解析、ESP32 / Raspberry Pi Pico のWeb Bluetooth連携と、全国の臨海コンビナート・原発・気象リスク算定を1つのローカル完結エンジンに統合しました。
                  </p>
                </section>

                {/* 2. 【NEW】バイオセンサーエンジン（Zero-Cost & Universal） */}
                <section id="biosensor-engine" className="py-10 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-t border-slate-800/60">
                  <div className="bg-gradient-to-br from-slate-900/95 via-slate-950 to-rose-950/20 border border-rose-500/30 rounded-2xl p-5 sm:p-8 backdrop-blur-xl shadow-2xl space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-5 border-b border-slate-800">
                      <div className="space-y-1">
                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs font-mono">
                          <Heart className="w-3.5 h-3.5 text-rose-400 animate-pulse" />
                          <span>Zero-Cost & Universal Biosensor Engine (完全ローカル処理)</span>
                        </div>
                        <h2 className="text-xl sm:text-2xl font-bold text-white">
                          リアルタイム生体・自律神経・バイオリズム評価モジュール
                        </h2>
                        <p className="text-xs text-slate-400">
                          カメラ映像や音声は外部サーバーへ一切送信されず、ブラウザ内で完結して目的関数 J の生体項 I_bio(t) と認知安定項 C_stab(t) へ反映されます。
                        </p>
                      </div>

                      <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 text-right shrink-0">
                        <div className="text-[11px] font-mono text-slate-400">総合生体健全度 I_bio(t)</div>
                        <div className="text-2xl font-black font-mono text-emerald-400">{bioSensorHealthScore} <span className="text-xs font-normal text-slate-500">/ 1.00</span></div>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                      {/* 1. スマホカメラ PPG 脈波・自律神経チェッカー */}
                      <div className="p-5 rounded-xl bg-slate-950/90 border border-rose-500/30 flex flex-col justify-between space-y-4">
                        <div className="space-y-2">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold text-rose-300 flex items-center gap-1.5">
                              <Camera className="w-4 h-4 text-rose-400" />
                              1. スマホカメラ PPG 脈波計測
                            </span>
                            <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-rose-950 text-rose-300 border border-rose-500/30">
                              LEDフラッシュ対応
                            </span>
                          </div>
                          <p className="text-[11px] text-slate-400 leading-relaxed">
                            背面カメラとLEDライトに指先を軽く当てると、皮膚下の血流変化からリアルタイム脈波（PPG）・心拍数・自律神経ストレスを計測します。
                          </p>
                        </div>

                        <PpgWaveformChart samples={ppgSamples} />
                        <video ref={videoRef} className="hidden" playsInline muted />
                        <canvas ref={canvasRef} width="40" height="40" className="hidden" />

                        <div className="grid grid-cols-2 gap-2 text-center">
                          <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800">
                            <div className="text-[10px] font-mono text-slate-400">心拍数 (BPM)</div>
                            <div className="text-xl font-bold font-mono text-rose-400">{bpm} <span className="text-xs font-normal">bpm</span></div>
                          </div>
                          <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800">
                            <div className="text-[10px] font-mono text-slate-400">自律神経ストレス</div>
                            <div className={`text-xl font-bold font-mono ${hrvStress > 60 ? 'text-amber-400' : 'text-emerald-400'}`}>
                              {hrvStress}%
                            </div>
                          </div>
                        </div>

                        <div className="space-y-1.5">
                          <button
                            onClick={startPpgCamera}
                            className={`w-full py-2.5 rounded-xl font-bold text-xs transition-all flex items-center justify-center gap-2 ${
                              isPpgActive
                                ? 'bg-slate-800 text-rose-300 border border-rose-500/50'
                                : 'bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-400 text-white shadow-lg shadow-rose-500/20'
                            }`}
                          >
                            <Camera className="w-4 h-4" />
                            <span>{isPpgActive ? 'PPG脈波計測を停止' : '指先PPG計測を開始（LED点灯）'}</span>
                          </button>
                          <div className="text-[10px] font-mono text-slate-400 text-center">{ppgStatusMsg}</div>
                        </div>
                      </div>

                      {/* 2. 音声マイクロ特徴量・バイオリズム解析 */}
                      <div className="p-5 rounded-xl bg-slate-950/90 border border-cyan-500/30 flex flex-col justify-between space-y-4">
                        <div className="space-y-2">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold text-cyan-300 flex items-center gap-1.5">
                              <Mic className="w-4 h-4 text-cyan-400" />
                              2. 音声マイクロ特徴量解析
                            </span>
                            <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-cyan-950 text-cyan-300 border border-cyan-500/30">
                              FFTピッチ揺らぎ
                            </span>
                          </div>
                          <p className="text-[11px] text-slate-400 leading-relaxed">
                            発話の内容ではなく、声の周波数スペクトルと微細なトーンの揺らぎからメンタルエネルギーの消耗度と疲労バイオリズムを判定します。
                          </p>
                        </div>

                        <div className="p-4 rounded-xl bg-slate-900/90 border border-slate-800 space-y-3">
                          <div className="space-y-1">
                            <div className="flex justify-between text-xs font-mono">
                              <span className="text-slate-400">メンタルエネルギー残量:</span>
                              <span className="text-cyan-300 font-bold">{voiceEnergyLevel}%</span>
                            </div>
                            <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                              <div className="bg-cyan-400 h-full transition-all duration-300" style={{ width: `${voiceEnergyLevel}%` }} />
                            </div>
                          </div>

                          <div className="space-y-1">
                            <div className="flex justify-between text-xs font-mono">
                              <span className="text-slate-400">音声緊張・認知疲労度:</span>
                              <span className="text-amber-300 font-bold">{voiceFatigue}%</span>
                            </div>
                            <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                              <div className="bg-amber-400 h-full transition-all duration-300" style={{ width: `${voiceFatigue}%` }} />
                            </div>
                          </div>
                        </div>

                        <div className="space-y-1.5">
                          <button
                            onClick={startVoiceAnalyzer}
                            className={`w-full py-2.5 rounded-xl font-bold text-xs transition-all flex items-center justify-center gap-2 ${
                              isVoiceActive
                                ? 'bg-slate-800 text-cyan-300 border border-cyan-500/50'
                                : 'bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 text-slate-950 shadow-lg shadow-cyan-500/20'
                            }`}
                          >
                            <Mic className="w-4 h-4" />
                            <span>{isVoiceActive ? '音声バイオリズム解析を停止' : '音声マイクロ解析を開始'}</span>
                          </button>
                          <div className="text-[10px] font-mono text-slate-400 text-center">{voiceStatusMsg}</div>
                        </div>
                      </div>

                      {/* 3. ESP32 / Raspberry Pi Pico DIYマイコン Web Bluetooth 連携 */}
                      <div className="p-5 rounded-xl bg-slate-950/90 border border-purple-500/30 flex flex-col justify-between space-y-4">
                        <div className="space-y-2">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold text-purple-300 flex items-center gap-1.5">
                              <Cpu className="w-4 h-4 text-purple-400" />
                              3. ESP32 / Pico DIYセンサー連携
                            </span>
                            <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-purple-950 text-purple-300 border border-purple-500/30">
                              Web Bluetooth (BLE)
                            </span>
                          </div>
                          <p className="text-[11px] text-slate-400 leading-relaxed">
                            ESP32 や Raspberry Pi Pico W に光電脈波モジュール（MAX30102等）を接続したオープンソース端末とBLE（UUID: 0x180D）で直接ペアリングできます。
                          </p>
                        </div>

                        <div className="p-3.5 rounded-xl bg-slate-900/90 border border-slate-800 space-y-2 text-[11px] font-mono text-slate-300">
                          <div className="flex items-center justify-between">
                            <span className="text-slate-400">対応ハードウェア:</span>
                            <span className="text-purple-300">ESP32 / RPi Pico W</span>
                          </div>
                          <div className="flex items-center justify-between">
                            <span className="text-slate-400">対応センサー:</span>
                            <span>MAX30102 / PulseSensor</span>
                          </div>
                          <div className="flex items-center justify-between">
                            <span className="text-slate-400">接続ステータス:</span>
                            <span className={bleDeviceName ? 'text-emerald-400 font-bold' : 'text-slate-400'}>
                              {bleDeviceName || '待機中'}
                            </span>
                          </div>
                        </div>

                        <div className="space-y-1.5">
                          <button
                            onClick={connectBleSensor}
                            className="w-full py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 text-white font-bold text-xs transition-all flex items-center justify-center gap-2 shadow-lg shadow-purple-500/20"
                          >
                            <Bluetooth className="w-4 h-4" />
                            <span>ESP32 / Pico BLEデバイスをスキャン</span>
                          </button>
                          <div className="text-[10px] font-mono text-slate-400 text-center">{bleStatusMsg}</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>

                {/* 3. REAL-TIME LOCATION & MULTI-DAY RISK CALCULATOR */}
                <section id="location-risk" className="py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-t border-slate-800/60">
                  <div className="bg-gradient-to-r from-slate-900/95 via-slate-950 to-slate-900/95 border border-amber-500/30 rounded-2xl p-5 sm:p-8 backdrop-blur-xl shadow-2xl space-y-6 relative overflow-hidden">
                    <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-5 border-b border-slate-800">
                      <div className="space-y-1">
                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-mono">
                          <Globe className="w-3.5 h-3.5 text-amber-400 animate-pulse" />
                          <span>Live Radar & Shelter Spatial Telemetry</span>
                          {isFetchingWeather && <span className="text-cyan-300 ml-1">(気象データ同期中...)</span>}
                        </div>
                        <h2 className="text-xl sm:text-2xl font-bold text-white">
                          現在地・詳細地域 冠水＆複合リスク算定モジュール（玉野・コンビナート・原発対応）
                        </h2>
                      </div>

                      <div className="flex flex-wrap items-center gap-2.5 shrink-0">
                        <a
                          href={localRiskData.gsiHazardUrl}
                          target="_blank"
                          rel="noreferrer"
                          className="px-3.5 py-2.5 rounded-xl bg-amber-950/80 hover:bg-amber-900/80 border border-amber-500/40 text-amber-200 font-bold text-xs flex items-center gap-1.5 transition-all"
                        >
                          <MapIcon className="w-4 h-4 text-amber-400" />
                          <span>国土地理院ハザードマップ</span>
                          <ExternalLink className="w-3.5 h-3.5 opacity-75" />
                        </a>
                        <a
                          href={localRiskData.yahooRadarUrl}
                          target="_blank"
                          rel="noreferrer"
                          className="px-3.5 py-2.5 rounded-xl bg-cyan-950/80 hover:bg-cyan-900/80 border border-cyan-500/40 text-cyan-200 font-bold text-xs flex items-center gap-1.5 transition-all"
                        >
                          <CloudRain className="w-4 h-4 text-cyan-400" />
                          <span>Yahoo!雨雲レーダー</span>
                          <ExternalLink className="w-3.5 h-3.5 opacity-75" />
                        </a>
                        <button
                          onClick={handleDetectLocation}
                          disabled={isLocating}
                          className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-bold text-xs flex items-center gap-1.5 transition-all shadow-lg shadow-amber-500/20 disabled:opacity-50"
                        >
                          <Navigation className={`w-4 h-4 ${isLocating ? 'animate-spin' : ''}`} />
                          <span>{isLocating ? '測位中...' : 'GPS現在地を取得'}</span>
                        </button>
                      </div>
                    </div>

                    {locationError && (
                      <div className="p-3.5 rounded-xl bg-red-950/60 border border-red-700/50 text-red-200 text-xs flex items-center gap-2">
                        <AlertTriangle className="w-4 h-4 text-red-400 shrink-0" />
                        <span>{locationError}</span>
                      </div>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 p-4 sm:p-5 rounded-xl bg-slate-950/80 border border-slate-800/80">
                      <div className="lg:col-span-7 space-y-4">
                        <div className="space-y-2">
                          <div className="flex items-center justify-between text-xs text-slate-400 font-mono">
                            <span className="flex items-center gap-1.5 text-amber-300 font-semibold">
                              <MapPin className="w-3.5 h-3.5" /> 1. 都道府県を選択:
                            </span>
                            <span>選択中: {userLocation ? 'GPS現在地' : riskCalculator.regionDatabase[selectedPref].pref}</span>
                          </div>
                          <div className="flex flex-wrap gap-1.5">
                            {Object.entries(riskCalculator.regionDatabase).map(([key, data]) => (
                              <button
                                key={key}
                                onClick={() => handlePrefChange(key)}
                                className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-all ${
                                  selectedPref === key && !userLocation
                                    ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md'
                                    : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-600'
                                }`}
                              >
                                {data.pref}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="space-y-2">
                          <div className="text-xs text-slate-400 font-mono">2. 詳細地域・コンビナート・原発エリア:</div>
                          <div className="flex flex-wrap gap-2">
                            {Object.entries(riskCalculator.regionDatabase[selectedPref].areas).map(([aKey, aData]) => (
                              <button
                                key={aKey}
                                onClick={() => handleAreaChange(aKey)}
                                className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition-all text-left ${
                                  selectedAreaKey === aKey && !userLocation
                                    ? 'bg-cyan-500/20 text-cyan-200 border-cyan-500/60'
                                    : 'bg-slate-900/80 text-slate-400 border-slate-800 hover:text-slate-200'
                                }`}
                              >
                                {aData.name}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="pt-3 border-t border-slate-800/80 grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div className="space-y-1.5">
                            <div className="flex justify-between text-xs">
                              <span className="text-purple-300 font-medium">避難所1人あたり面積:</span>
                              <span className="font-mono font-bold text-white">{customShelterSqm.toFixed(1)} ㎡</span>
                            </div>
                            <input
                              type="range" min="1.2" max="5.0" step="0.1" value={customShelterSqm}
                              onChange={(e) => {
                                const v = Number(e.target.value);
                                setCustomShelterSqm(v);
                                recalculateWithCurrentWeather(forecastDays, v, customVentLevel);
                              }}
                              className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-purple-500"
                            />
                          </div>

                          <div className="space-y-1.5">
                            <div className="flex justify-between text-xs">
                              <span className="text-emerald-300 font-medium">換気・ゾーニング強度:</span>
                              <span className="font-mono font-bold text-white">Lv.{customVentLevel} / 5</span>
                            </div>
                            <input
                              type="range" min="1" max="5" step="1" value={customVentLevel}
                              onChange={(e) => {
                                const v = Number(e.target.value);
                                setCustomVentLevel(v);
                                recalculateWithCurrentWeather(forecastDays, customShelterSqm, v);
                              }}
                              className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500"
                            />
                          </div>
                        </div>
                      </div>

                      <div className="lg:col-span-5 flex flex-col justify-between p-4 rounded-xl bg-slate-900/90 border border-slate-800 space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-semibold text-purple-300 flex items-center gap-1.5">
                            <Activity className="w-4 h-4 text-purple-400" />
                            3. 予測期間（1〜7日後推移）
                          </span>
                          <span className="px-2.5 py-0.5 rounded-md bg-purple-950 border border-purple-500/40 text-purple-200 font-mono text-xs font-bold">
                            {forecastDays}日後 ({localRiskData.targetDateTimeFormatted.slice(5, 10)})
                          </span>
                        </div>

                        <input
                          type="range" min="1" max="7" value={forecastDays}
                          onChange={(e) => {
                            const d = Number(e.target.value);
                            setForecastDays(d);
                            recalculateWithCurrentWeather(d, customShelterSqm, customVentLevel);
                          }}
                          className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-purple-500"
                        />

                        <RiskTimelineChart timeline={localRiskData.timeline} selectedDay={forecastDays} mode={riskScenarioMode} />
                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-slate-950/90 border border-slate-700/80 flex flex-col md:flex-row md:items-center justify-between gap-3">
                      <div className="text-xs font-bold text-slate-200 flex items-center gap-2">
                        <Eye className="w-4 h-4 text-amber-400" />
                        <span>表示モード切替（現在予報の実発生確率 vs 豪雨直撃時の潜在脆弱性）</span>
                      </div>
                      <div className="flex flex-wrap gap-2 shrink-0">
                        <button
                          onClick={() => setRiskScenarioMode('ACTUAL')}
                          className={`px-3.5 py-2 rounded-lg text-xs font-bold border transition-all ${
                            riskScenarioMode === 'ACTUAL'
                              ? 'bg-cyan-500 text-slate-950 border-cyan-400'
                              : 'bg-slate-900 text-slate-300 border-slate-700'
                          }`}
                        >
                          ① 実際の発生確率（現在予報）
                        </button>
                        <button
                          onClick={() => setRiskScenarioMode('WORST_CASE')}
                          className={`px-3.5 py-2 rounded-lg text-xs font-bold border transition-all ${
                            riskScenarioMode === 'WORST_CASE'
                              ? 'bg-rose-500 text-white border-rose-400'
                              : 'bg-slate-900 text-slate-300 border-slate-700'
                          }`}
                        >
                          ② 豪雨・避難発生時の潜在リスク
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <div className="p-4 rounded-xl bg-slate-950/80 border border-cyan-500/40 space-y-2">
                        <div className="text-xs text-cyan-300 font-mono flex items-center justify-between">
                          <span>道路冠水・内水氾濫</span>
                          <CloudRain className="w-4 h-4 text-cyan-400" />
                        </div>
                        <div className="text-2xl font-bold font-mono text-cyan-300">
                          {riskScenarioMode === 'ACTUAL' ? localRiskData.inundationRisk : localRiskData.worstInundationRisk}%
                        </div>
                        <div className="text-[11px] text-slate-400">
                          標高 {localRiskData.factors.elevation}m / 排水能力 {localRiskData.factors.drainageCap}mm/h
                        </div>
                      </div>

                      <div className="p-4 rounded-xl bg-slate-950/80 border border-red-500/40 space-y-2">
                        <div className="text-xs text-red-300 font-mono flex items-center justify-between">
                          <span>{localRiskData.nuclearFacility ? 'Natech・原子力複合リスク' : 'Natechプラント・重工業'}</span>
                          <Flame className="w-4 h-4 text-red-400" />
                        </div>
                        <div className="text-2xl font-bold font-mono text-red-300">
                          {riskScenarioMode === 'ACTUAL' ? localRiskData.natechRisk : localRiskData.worstNatechRisk}%
                        </div>
                        <div className="text-[11px] text-slate-400">
                          {localRiskData.nuclearFacility ? '原子力関連施設近接 / 複合警戒域' : `臨海工業・重工業集積度: ${localRiskData.factors.industrialDensityPct}%`}
                        </div>
                      </div>

                      <div className="p-4 rounded-xl bg-slate-950/80 border border-purple-500/40 space-y-2">
                        <div className="text-xs text-purple-300 font-mono flex items-center justify-between">
                          <span>避難所パンデミック</span>
                          <Users className="w-4 h-4 text-purple-400" />
                        </div>
                        <div className="text-2xl font-bold font-mono text-purple-300">
                          {riskScenarioMode === 'ACTUAL' ? localRiskData.outbreakRisk : localRiskData.worstOutbreakRisk}%
                        </div>
                        <div className="text-[11px] text-slate-400">
                          実質面積 {localRiskData.factors.effectiveShelterSqm}㎡ / 換気 {localRiskData.factors.ventilationRate}回/h
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                      <div className={`lg:col-span-5 p-5 rounded-xl border space-y-2.5 ${localRiskData.thermalCare.badgeColor}`}>
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold flex items-center gap-1.5">
                            <Thermometer className="w-4 h-4" />
                            現在気象に基づく体調・保温ケア
                          </span>
                          <span className="text-xs font-mono font-bold">
                            {localRiskData.factors.currentTemp}℃ / {localRiskData.factors.currentHumidity}%
                          </span>
                        </div>
                        <div className="text-xs font-bold">{localRiskData.thermalCare.status}</div>
                        <p className="text-xs leading-relaxed opacity-90">{localRiskData.thermalCare.advice}</p>
                      </div>

                      <div className="lg:col-span-7 p-5 rounded-xl bg-slate-950/90 border border-slate-800 space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-emerald-300 flex items-center gap-1.5">
                            <CheckSquare className="w-4 h-4 text-emerald-400" />
                            今すぐ実行できる3ステップ安全チェック
                          </span>
                          <span className="text-xs font-mono text-slate-400">
                            完了: {completedCount} / {localRiskData.actionChecklist.length}
                          </span>
                        </div>
                        <div className="space-y-2">
                          {localRiskData.actionChecklist.map((item) => {
                            const isChecked = !!checkedItems[item.id];
                            return (
                              <label
                                key={item.id}
                                className={`flex items-start gap-3 p-2.5 rounded-lg border cursor-pointer transition-all text-xs ${
                                  isChecked
                                    ? 'bg-emerald-950/30 border-emerald-500/40 text-slate-400 line-through'
                                    : 'bg-slate-900/70 border-slate-800 text-slate-200 hover:border-slate-600'
                                }`}
                              >
                                <input
                                  type="checkbox"
                                  checked={isChecked}
                                  onChange={() => setCheckedItems(prev => ({ ...prev, [item.id]: !prev[item.id] }))}
                                  className="mt-0.5 rounded accent-emerald-500"
                                />
                                <div>
                                  <span className="font-mono text-[10px] text-amber-400 mr-2">[{item.phase}]</span>
                                  <span>{item.text}</span>
                                </div>
                              </label>
                            );
                          })}
                        </div>
                      </div>
                    </div>

                    <div className="p-5 rounded-xl bg-gradient-to-r from-purple-950/40 via-slate-950/60 to-emerald-950/40 border border-purple-500/30 space-y-2">
                      <div className="flex items-center justify-between text-xs font-semibold text-purple-300">
                        <span className="flex items-center gap-2">
                          <Sparkles className="w-4 h-4 text-amber-400" />
                          {localRiskData.areaName} のAI因果ストーリー診断
                        </span>
                        <span className="text-[10px] font-mono text-slate-400">Updated: {localRiskData.timestamp}</span>
                      </div>
                      <p className="text-xs sm:text-sm text-slate-200 leading-relaxed">
                        <strong>【状況認識】</strong> {localRiskData.primaryThreat}<br />
                        <strong>【推奨行動】</strong> {localRiskData.recommendedAction}
                      </p>
                    </div>
                  </div>
                </section>

                {/* 4. 目的関数 J & リアルタイム評価エンジン */}
                <section id="math-core" className="py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-t border-slate-800/60">
                  <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 sm:p-8 backdrop-blur-md shadow-2xl space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-5 border-b border-slate-800">
                      <div className="space-y-1">
                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-mono">
                          <Terminal className="w-3.5 h-3.5" /> Mathematical Core & Live Fail-Safe Engine
                        </div>
                        <h2 className="text-xl sm:text-2xl font-bold text-white">
                          目的関数 J リアルタイム評価（バイオセンサー実測値 × 地域リスク連動）
                        </h2>
                      </div>

                      <div className="flex flex-wrap items-center gap-2">
                        <button
                          onClick={() => setSimContext('NORMAL')}
                          className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${
                            simContext === 'NORMAL' ? 'bg-emerald-500 text-slate-950 border-emerald-400' : 'bg-slate-950 text-slate-400 border-slate-800'
                          }`}
                        >
                          1. 実測バイオ連動
                        </button>
                        <button
                          onClick={() => setSimContext('INTENSE_EXERCISE')}
                          className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${
                            simContext === 'INTENSE_EXERCISE' ? 'bg-amber-500 text-slate-950 border-amber-400' : 'bg-slate-950 text-slate-400 border-slate-800'
                          }`}
                        >
                          2. 高負荷運動保護
                        </button>
                        <button
                          onClick={() => setSimContext('CRISIS')}
                          className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${
                            simContext === 'CRISIS' ? 'bg-rose-500 text-white border-rose-400' : 'bg-slate-950 text-slate-400 border-slate-800'
                          }`}
                        >
                          3. 緊急ハードオーバーライド
                        </button>
                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-[#060911] border border-slate-800 font-mono text-xs sm:text-sm text-amber-300 overflow-x-auto text-center">
                      J = ∫₀ᵀ [ w₁ I_bio(PPG/BLE) + w₂ C_stab(Voice/HRV) + w₃ M_mat(t) - w₄ E_pen(地域リスク) - λ Penalty_over ] dt
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400">目的関数 J スコア</div>
                        <div className={`text-xl font-bold font-mono mt-1 ${latestTelemetry.jScore >= 0 ? 'text-amber-400' : 'text-rose-400'}`}>
                          {latestTelemetry.jScore}
                        </div>
                      </div>
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400">フェイルセーフ介入段階</div>
                        <div className={`text-xs sm:text-sm font-bold font-mono mt-1 ${

                        <RefreshCw className={`w-3.5 h-3.5 ${isSimRunning ? 'animate-spin-slow text-emerald-400' : ''}`} />
                        <span>{isSimRunning ? '一時停止' : '再開'}</span>
                      </button>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 my-6">
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400">目的関数 J スコア</div>
                        <div className={`text-xl font-bold font-mono mt-1 ${latestTelemetry.jScore >= 0 ? 'text-amber-400' : 'text-rose-400'}`}>
                          {latestTelemetry.jScore}
                        </div>
                      </div>
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400">介入ステージ</div>
                        <div className={`text-xs sm:text-sm font-bold font-mono mt-1 ${
                          latestTelemetry.stage?.includes('STAGE 2') ? 'text-rose-400' : 
                          latestTelemetry.stage?.includes('STAGE 1') ? 'text-amber-400' : 'text-emerald-400'
                        }`}>
                          {latestTelemetry.stage}
                        </div>
                      </div>
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-amber-300">地域統合リスク (E_pen)</div>
                        <div className="text-xl font-bold font-mono mt-1 text-cyan-400">
                          {latestTelemetry.ePen}
                        </div>
                      </div>
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400">プライバシー</div>
                        <div className="text-xs font-bold font-mono mt-1 text-emerald-400 flex items-center gap-1">
                          <CheckCircle2 className="w-3.5 h-3.5" /> ローカル処理完結
                        </div>
                      </div>
                    </div>

                    <div className="h-56 sm:h-72 w-full mt-4">
                      <CustomLineChart data={simData} />
                    </div>
                  </div>
                </section>

                {/* 7. COMMUNITY */}
                <section id="community" className="py-16 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-t border-slate-800/60">
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
                    <div className="lg:col-span-6 space-y-4">
                      <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-mono">
                        <Users className="w-3.5 h-3.5" /> Open Bio-Commons Council
                      </div>
                      <h2 className="text-3xl font-bold text-white">
                        共に「地域社会と人間の尊厳を守るインフラ」を育てる
                      </h2>
                      <p className="text-slate-300 text-sm leading-relaxed">
                        OpenLBOF は、特定企業の製品ではなく、オープンな地域リスクデータとバイオシグナルを統合するパブリックコモンズです。
                      </p>
                    </div>

                    <div className="lg:col-span-6 bg-slate-900/90 border border-slate-800 rounded-2xl p-6 backdrop-blur-md">
                      <h3 className="text-lg font-bold text-white mb-4">OBC 参画・フィードバック送信</h3>
                      {formSubmitted ? (
                        <div className="p-6 text-center space-y-2 bg-emerald-500/10 border border-emerald-500/30 rounded-xl">
                          <CheckCircle2 className="w-10 h-10 text-emerald-400 mx-auto" />
                          <h4 className="text-base font-bold text-white">送信が完了しました</h4>
                        </div>
                      ) : (
                        <form onSubmit={handleFormSubmit} className="space-y-3">
                          <input 
                            type="text" 
                            required
                            value={formData.name}
                            onChange={e => setFormData({ ...formData, name: e.target.value })}
                            placeholder="お名前 / Handle" 
                            className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                          />
                          <input 
                            type="email" 
                            required
                            value={formData.email}
                            onChange={e => setFormData({ ...formData, email: e.target.value })}
                            placeholder="メールアドレス" 
                            className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                          />
                          <textarea 
                            rows={3}
                            required
                            value={formData.message}
                            onChange={e => setFormData({ ...formData, message: e.target.value })}
                            placeholder="改善アイデアや地域データの追加要望など..." 
                            className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-amber-500 resize-none"
                          />
                          <button 
                            type="submit"
                            className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-bold text-xs shadow-lg transition-all flex items-center justify-center gap-2"
                          >
                            <Send className="w-4 h-4" />
                            <span>送信する</span>
                          </button>
                        </form>
                      )}
                    </div>
                  </div>
                </section>
              </main>

              <footer className="border-t border-slate-800/80 bg-[#060911] py-10 relative z-10">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div className="flex items-center space-x-2.5">
                    <Heart className="w-4 h-4 text-amber-400" />
                    <span className="text-sm font-bold text-slate-200">OpenLBOF / Open Bio-Commons Council</span>
                  </div>
                  <div className="text-xs text-slate-400 font-mono">
                    &copy; 2026 Open Bio-Commons Council (OBC) ・ Local-First Safety Infrastructure.
                  </div>
                </div>
              </footer>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>

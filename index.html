<body class="bg-[#090D16] text-slate-100 selection:bg-amber-500/30 selection:text-amber-200">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        const LucideIcons = window.lucide || {};
        const createLucideComponent = (iconDef) => {
            if (typeof iconDef === 'function') return iconDef;
            if (!Array.isArray(iconDef)) return () => null;
            return ({ className = "w-4 h-4", ...props }) => (
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={className}
                    {...props}
                >
                    {iconDef.map(([tag, attrs], index) => React.createElement(tag, { key: index, ...attrs }))}
                </svg>
            );
        };

        const Shield = createLucideComponent(LucideIcons.Shield);
        const Heart = createLucideComponent(LucideIcons.Heart);
        const Cpu = createLucideComponent(LucideIcons.Cpu);
        const Activity = createLucideComponent(LucideIcons.Activity);
        const Lock = createLucideComponent(LucideIcons.Lock);
        const Users = createLucideComponent(LucideIcons.Users);

        const CustomLineChart = ({ data = [] }) => {
            if (!data.length) return <div className="flex items-center justify-center h-full text-slate-500 font-mono text-xs">Awaiting Telemetry Data...</div>;

            const width = 600;
            const height = 260;
            const padding = { top: 20, right: 20, bottom: 30, left: 40 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;

            const minY = -2;
            const maxY = 2;

            const getX = (index) => padding.left + (index / Math.max(1, data.length - 1)) * chartWidth;
            const getY = (val) => padding.top + chartHeight - ((val - minY) / (maxY - minY)) * chartHeight;

            const makePath = (key) => {
                return data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d[key] || 0)}`).join(' ');
            };

            return (
                <div className="w-full h-full flex flex-col items-center justify-center">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full overflow-visible">
                        {[-1, 0, 1].map((val) => (
                            <g key={val}>
                                <line 
                                    x1={padding.left} 
                                    y1={getY(val)} 
                                    x2={width - padding.right} 
                                    y2={getY(val)} 
                                    stroke="#1e293b" 
                                    strokeDasharray={val === 0 ? "none" : "3 3"} 
                                    strokeWidth={val === 0 ? "1.5" : "1"} 
                                />
                                <text x={padding.left - 8} y={getY(val) + 4} fill="#64748b" fontSize="10" textAnchor="end" className="font-mono">
                                    {val}
                                </text>
                            </g>
                        ))}
                        <path d={makePath('rawSignal')} fill="none" stroke="#06b6d4" strokeWidth="2" opacity="0.8" />
                        <path d={makePath('baseline')} fill="none" stroke="#10b981" strokeWidth="2" strokeDasharray="4 4" opacity="0.8" />
                        <path d={makePath('jScore')} fill="none" stroke="#f59e0b" strokeWidth="2.5" />
                    </svg>
                    <div className="flex items-center gap-6 text-[11px] font-mono text-slate-400 mt-2">
                        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-cyan-400 inline-block"/> 生体データ</span>
                        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block"/> 動的ベースライン</span>
                        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"/> 目的関数 J スコア</span>
                    </div>
                </div>
            );
        };

        class LocalRiskCalculatorEngine {
          constructor() {
            this.regionDatabase = {
              tokyo: {
                pref: '東京都',
                areas: {
                  koto_bay: { name: '江東区・臨海湾岸エリア（ゼロメートル地帯）', lat: 35.6495, lon: 139.7914, baseRain: 45, shelterSpace: 1.8, industrialDensity: 0.85, elevation: 1.2, drainageCap: 45 },
                  shinjuku: { name: '新宿区・都心高密エリア', lat: 35.6938, lon: 139.7034, baseRain: 40, shelterSpace: 1.5, industrialDensity: 0.25, elevation: 32.0, drainageCap: 55 },
                  ota_keihin: { name: '大田区・京浜工業地帯沿岸', lat: 35.5613, lon: 139.7160, baseRain: 50, shelterSpace: 1.9, industrialDensity: 0.92, elevation: 2.5, drainageCap: 48 }
                }
              },
              hyogo: {
                pref: '兵庫県',
                areas: {
                  kobe_port: { name: '神戸市中央区・神戸港湾〜三宮低地帯', lat: 34.6851, lon: 135.1955, baseRain: 46, shelterSpace: 2.0, industrialDensity: 0.78, elevation: 3.2, drainageCap: 50 },
                  himeji_rinkai: { name: '姫路市・播磨臨海工業地帯', lat: 34.7865, lon: 134.6642, baseRain: 42, shelterSpace: 2.5, industrialDensity: 0.93, elevation: 2.8, drainageCap: 46 },
                  amagasaki_bay: { name: '尼崎市・南部臨海ゼロメートル地帯', lat: 34.7161, lon: 135.4063, baseRain: 48, shelterSpace: 1.7, industrialDensity: 0.89, elevation: 0.8, drainageCap: 42 }
                }
              },
              mie: {
                pref: '三重県',
                areas: {
                  yokkaichi: { name: '四日市市・四日市コンビナート臨海帯', lat: 34.9651, lon: 136.6244, baseRain: 54, shelterSpace: 2.2, industrialDensity: 0.96, elevation: 2.1, drainageCap: 45 },
                  tsu_coast: { name: '津市・伊勢湾沿岸低地帯', lat: 34.7186, lon: 136.5056, baseRain: 52, shelterSpace: 2.6, industrialDensity: 0.45, elevation: 3.5, drainageCap: 44 },
                  ise_miyagawa: { name: '伊勢市・宮川下流域', lat: 34.4875, lon: 136.7094, baseRain: 58, shelterSpace: 2.8, industrialDensity: 0.30, elevation: 4.5, drainageCap: 42 }
                }
              },
              aichi: {
                pref: '愛知県',
                areas: {
                  nagoya_port: { name: '名古屋市港区・名古屋港臨海工業帯', lat: 35.0911, lon: 136.8814, baseRain: 48, shelterSpace: 2.1, industrialDensity: 0.91, elevation: 1.5, drainageCap: 48 },
                  kinuura_bay: { name: '半田市・碧南市 衣浦湾臨海工業帯', lat: 34.8922, lon: 136.9412, baseRain: 47, shelterSpace: 2.4, industrialDensity: 0.87, elevation: 2.2, drainageCap: 46 },
                  toyota_inland: { name: '豊田市・矢作川中流域', lat: 35.0824, lon: 137.1562, baseRain: 45, shelterSpace: 3.1, industrialDensity: 0.65, elevation: 42.0, drainageCap: 55 }
                }
              },
              okayama: {
                pref: '岡山県',
                areas: {
                  setouchi: { name: '瀬戸内市・牛窓〜邑久沿岸エリア', lat: 34.6517, lon: 134.0933, baseRain: 35, shelterSpace: 3.4, industrialDensity: 0.35, elevation: 8.5, drainageCap: 45 },
                  kurashiki_mizushima: { name: '倉敷市・水島臨海コンビナート周辺', lat: 34.5125, lon: 133.7483, baseRain: 40, shelterSpace: 2.3, industrialDensity: 0.95, elevation: 3.0, drainageCap: 46 },
                  okayama_kita: { name: '岡山市北区・旭川下流域', lat: 34.6618, lon: 133.9344, baseRain: 38, shelterSpace: 2.6, industrialDensity: 0.40, elevation: 5.0, drainageCap: 48 }
                }
              },
              okinawa: {
                pref: '沖縄県',
                areas: {
                  naha_port: { name: '那覇市・那覇港湾〜新都心エリア', lat: 26.2124, lon: 127.6809, baseRain: 65, shelterSpace: 2.0, industrialDensity: 0.55, elevation: 4.0, drainageCap: 55 },
                  ishigaki: { name: '石垣市・離島沿岸エリア', lat: 24.3407, lon: 124.1556, baseRain: 75, shelterSpace: 2.2, industrialDensity: 0.30, elevation: 6.0, drainageCap: 50 },
                  uru_industrial: { name: 'うるま市・中城湾港工業帯', lat: 26.3361, lon: 127.8556, baseRain: 70, shelterSpace: 2.1, industrialDensity: 0.80, elevation: 3.5, drainageCap: 52 }
                }
              },
              osaka: {
                pref: '大阪府',
                areas: {
                  sakai_senboku: { name: '堺市・泉北臨海工業地帯', lat: 34.5733, lon: 135.4372, baseRain: 45, shelterSpace: 1.9, industrialDensity: 0.90, elevation: 2.8, drainageCap: 48 },
                  umeda_yodo: { name: '大阪市北区・淀川河口低地帯', lat: 34.7024, lon: 135.4959, baseRain: 42, shelterSpace: 1.6, industrialDensity: 0.45, elevation: 2.0, drainageCap: 50 }
                }
              },
              hokkaido: {
                pref: '北海道',
                areas: {
                  tomakomai: { name: '苫小牧市・臨海工業基地', lat: 42.6343, lon: 141.6054, baseRain: 30, shelterSpace: 3.8, industrialDensity: 0.82, elevation: 5.0, drainageCap: 45 },
                  sapporo_kita: { name: '札幌市北区・石狩川水系', lat: 43.0908, lon: 141.3408, baseRain: 35, shelterSpace: 2.9, industrialDensity: 0.30, elevation: 14.0, drainageCap: 48 }
                }
              },
              fukuoka: {
                pref: '福岡県',
                areas: {
                  kitakyushu: { name: '北九州市・洞海湾〜響灘臨海帯', lat: 33.8834, lon: 130.8751, baseRain: 52, shelterSpace: 2.4, industrialDensity: 0.88, elevation: 3.5, drainageCap: 50 },
                  hakata_bay: { name: '福岡市博多区・博多湾沿岸', lat: 33.5902, lon: 130.4017, baseRain: 50, shelterSpace: 2.0, industrialDensity: 0.40, elevation: 4.0, drainageCap: 52 }
                }
              }
            };
          }

          calculateDetailedRisk({ 
            lat, lon, areaName, 
            baseRain = 45, shelterSpace = 2.2, industrialDensity = 0.6, elevation = 5.0, drainageCap = 48,
            forecastDays = 3, liveWeather = null 
          }) {
            // リアルタイム気象データ（雨雲レーダー連携値）がある場合は反映
            const liveHourlyRain = liveWeather ? liveWeather.currentRainMm : 0;
            const liveForecastSum = liveWeather ? liveWeather.forecastRainSum : 0;
            const liveMaxProb = liveWeather ? liveWeather.maxPrecipProb : null;

            // 予測日数（1〜7日）に応じた気象累積と雨雲レーダー実測値の統合
            const precipProbability = liveMaxProb !== null 
              ? Math.min(98, Math.max(liveMaxProb, Math.round(baseRain * 0.4 + forecastDays * 4)))
              : Math.min(95, Math.round(baseRain + (forecastDays * 4.5) + Math.sin(lat * 5) * 8));

            const expectedRainfallMm = liveForecastSum > 0 
              ? Math.round(liveForecastSum + (forecastDays - 1) * 18)
              : Math.round((precipProbability / 100) * (35 + forecastDays * 22));

            // 推定ピーク時間雨量 (mm/h)
            const peakHourlyRainMm = Math.max(liveHourlyRain, Math.round((expectedRainfallMm / (forecastDays * 4.5)) * (precipProbability / 70)));
            
            // 避難長期化による1人あたり実質有効面積の低下（二次避難所の広さ要因）
            const effectiveShelterSqm = Math.max(1.1, parseFloat((shelterSpace - (forecastDays - 1) * 0.14).toFixed(2)));
            const ventilationRate = Math.max(1.5, parseFloat((4.2 - (forecastDays * 0.25) - (3.5 - effectiveShelterSqm) * 0.4).toFixed(1)));
            const hygieneFatigueIndex = Math.min(100, Math.round(15 + forecastDays * 11 + (3.0 - effectiveShelterSqm) * 12));

            // 1. 道路冠水・内水氾濫リスク（時間雨量 vs 排水能力 + 累積雨量 + 標高）
            const elevationFactor = Math.max(0.35, 1.35 - (elevation / 22));
            const drainageOverload = Math.min(1.5, peakHourlyRainMm / Math.max(25, drainageCap));
            const inundationRisk = Math.min(97, Math.max(10, Math.round(
              ((drainageOverload * 45) + (precipProbability * 0.35) + (expectedRainfallMm / 3.0)) * elevationFactor
            )));

            // 2. Natechプラント爆発リスク（工業集積度 × 冠水・浸水リスク）
            const natechRisk = Math.min(95, Math.max(8, Math.round(industrialDensity * 65 + (inundationRisk * 0.35))));

            // 3. 避難所二次感染症（パンデミック）リスク（二次避難所の狭さ × 滞在日数 × 換気不足）
            const crowdingFactor = Math.max(0.4, (3.6 - effectiveShelterSqm) / 2.2);
            const outbreakRisk = Math.min(94, Math.max(10, Math.round((crowdingFactor * 48) + (forecastDays * 5.2) + ((5.0 - ventilationRate) * 6))));

            // 合成エントロピー (0.00 - 1.00)
            const compositeEntropy = parseFloat(((natechRisk * 0.35 + inundationRisk * 0.32 + outbreakRisk * 0.33) / 100).toFixed(2));

            let primaryThreat = `今後${forecastDays}日間の雨雲推移（累積${expectedRainfallMm}mm）と避難環境変化による複合リスク`;
            let recommendedAction = 'Yahoo!雨雲レーダーで最新の降水帯を確認し、低地・アンダーパスを避けて二次避難所の空き状況を確認してください。';

            if (outbreakRisk >= natechRisk && outbreakRisk >= inundationRisk && outbreakRisk >= 60) {
              primaryThreat = `滞在${forecastDays}日目以降の過密化（1人あたり ${effectiveShelterSqm}㎡）による呼吸器・消化器感染症の集団蔓延（パンデミック）リスク`;
              recommendedAction = `一次避難所の収容限界前に、個別空間が確保された二次避難施設（分散避難先）への早期移動と換気ゾーニングを推奨します。`;
            } else if (natechRisk >= 65) {
              primaryThreat = `ピーク雨量${peakHourlyRainMm}mm/h（冠水確率${inundationRisk}%）に伴う、臨海工業帯の金属粉末水反応・高圧ガス漏洩（Natech）リスク`;
              recommendedAction = `冠水・浸水が始まる前に、風上かつ標高20m以上の指定高台エリアへ即時退避してください。`;
            } else if (inundationRisk >= 60) {
              primaryThreat = `排水処理能力（${drainageCap}mm/h）に迫る降雨（累積${expectedRainfallMm}mm）による低地・道路冠水および床下浸水リスク`;
              recommendedAction = `アンダーパスや河川付近の移動を控え、早めの垂直避難または高台への事前移動を行ってください。`;
            }

            // Yahoo!天気・雨雲レーダーの該当座標URL生成
            const yahooRadarUrl = `https://weather.yahoo.co.jp/weather/zoomradar/?lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}&z=12`;

            return {
              areaName: areaName || `GPS測位地点 (${lat.toFixed(3)}, ${lon.toFixed(3)})`,
              lat: lat.toFixed(4),
              lon: lon.toFixed(4),
              forecastDays,
              compositeEntropy,
              natechRisk,
              inundationRisk,
              outbreakRisk,
              yahooRadarUrl,
              isLiveRadarConnected: Boolean(liveWeather),
              factors: {
                precipProbability,
                expectedRainfallMm,
                peakHourlyRainMm,
                liveHourlyRain,
                drainageCap,
                effectiveShelterSqm,
                ventilationRate,
                hygieneFatigueIndex,
                industrialDensityPct: Math.round(industrialDensity * 100),
                elevation
              },
              primaryThreat,
              recommendedAction,
              timestamp: new Date().toLocaleTimeString('ja-JP')
            };
          }
        }

        const riskCalculator = new LocalRiskCalculatorEngine();

        function App() {
          const [isScrolled, setIsScrolled] = useState(false);
          const [activeMathItem, setActiveMathItem] = useState('I_bio');
          const [activeGovernanceTab, setActiveGovernanceTab] = useState('engineering');
          const [simContext, setSimContext] = useState('NORMAL');
          const [simTime, setSimTime] = useState(0);
          const [simData, setSimData] = useState([]);
          const [isSimRunning, setIsSimRunning] = useState(true);
          const [formSubmitted, setFormSubmitted] = useState(false);
          const [formData, setFormData] = useState({ name: '', email: '', role: 'AutoDrive Engineer', message: '' });

          const [userLocation, setUserLocation] = useState(null);
          const [isLocating, setIsLocating] = useState(false);
          const [isFetchingWeather, setIsFetchingWeather] = useState(false);
          const [liveWeatherCache, setLiveWeatherCache] = useState(null);
          const [locationError, setLocationError] = useState(null);
          const [selectedPref, setSelectedPref] = useState('okayama');
          const [selectedAreaKey, setSelectedAreaKey] = useState('setouchi');
          const [forecastDays, setForecastDays] = useState(3);
          const [localRiskData, setLocalRiskData] = useState(() => {
            const initArea = riskCalculator.regionDatabase.okayama.areas.setouchi;
            return riskCalculator.calculateDetailedRisk({ ...initArea, forecastDays: 3 });
          });

          // リアルタイム気象レーダーAPI（Open-Meteo）から対象座標の降水量・降水確率を取得
          const fetchRadarPrecipitation = async (lat, lon, areaObjOrName, days, isGps = false) => {
            setIsFetchingWeather(true);
            try {
              const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=precipitation,rain&hourly=precipitation_probability,precipitation&forecast_days=${Math.min(7, Math.max(1, days))}&timezone=Asia%2FTokyo`;
              const res = await fetch(url);
              if (!res.ok) throw new Error('Weather API unavailable');
              const data = await res.json();

              const currentRainMm = data.current?.precipitation ?? 0;
              const probs = data.hourly?.precipitation_probability || [];
              const rains = data.hourly?.precipitation || [];

              const maxPrecipProb = probs.length > 0 ? Math.max(...probs) : null;
              const forecastRainSum = rains.reduce((acc, v) => acc + (v || 0), 0);

              const liveWeather = {
                currentRainMm,
                maxPrecipProb,
                forecastRainSum: Math.round(forecastRainSum * 10) / 10
              };
              setLiveWeatherCache(liveWeather);

              if (isGps) {
                setLocalRiskData(riskCalculator.calculateDetailedRisk({
                  lat,
                  lon,
                  areaName: areaObjOrName,
                  forecastDays: days,
                  liveWeather
                }));
              } else {
                setLocalRiskData(riskCalculator.calculateDetailedRisk({
                  ...areaObjOrName,
                  forecastDays: days,
                  liveWeather
                }));
              }
            } catch (err) {
              // オフラインやAPI制限時は地理モデルベースでフォールバック算出
              setLiveWeatherCache(null);
              if (isGps) {
                setLocalRiskData(riskCalculator.calculateDetailedRisk({
                  lat,
                  lon,
                  areaName: areaObjOrName,
                  forecastDays: days
                }));
              } else {
                setLocalRiskData(riskCalculator.calculateDetailedRisk({
                  ...areaObjOrName,
                  forecastDays: days
                }));
              }
            } finally {
              setIsFetchingWeather(false);
            }
          };

          // 初回マウント時にデフォルト地域の気象レーダーデータを同期
          useEffect(() => {
            const initArea = riskCalculator.regionDatabase[selectedPref].areas[selectedAreaKey];
            fetchRadarPrecipitation(initArea.lat, initArea.lon, initArea, forecastDays, false);
          }, []);

          const handleDetectLocation = () => {
            setIsLocating(true);
            setLocationError(null);

            if (!navigator.geolocation) {
              setLocationError('お使いのブラウザは位置情報サービスに対応していません。下の都道府県・詳細地域から選択してください。');
              setIsLocating(false);
              return;
            }

            navigator.geolocation.getCurrentPosition(
              (position) => {
                const { latitude, longitude } = position.coords;
                setUserLocation({ lat: latitude, lon: longitude });
                fetchRadarPrecipitation(latitude, longitude, '現在地GPS測位エリア', forecastDays, true);
                setIsLocating(false);
              },
              (error) => {
                setLocationError('位置情報の取得が許可されていないかタイムアウトしました。下の都道府県・詳細地域から選択してください。');
                setIsLocating(false);
              },
              { timeout: 8000, enableHighAccuracy: true }
            );
          };

          const handlePrefChange = (prefKey) => {
            setUserLocation(null);
            setSelectedPref(prefKey);
            const firstAreaKey = Object.keys(riskCalculator.regionDatabase[prefKey].areas)[0];
            setSelectedAreaKey(firstAreaKey);
            const areaObj = riskCalculator.regionDatabase[prefKey].areas[firstAreaKey];
            fetchRadarPrecipitation(areaObj.lat, areaObj.lon, areaObj, forecastDays, false);
          };

          const handleAreaChange = (areaKey) => {
            setUserLocation(null);
            setSelectedAreaKey(areaKey);
            const areaObj = riskCalculator.regionDatabase[selectedPref].areas[areaKey];
            fetchRadarPrecipitation(areaObj.lat, areaObj.lon, areaObj, forecastDays, false);
          };

          const handleForecastDaysChange = (days) => {
            setForecastDays(days);
            if (userLocation) {
              fetchRadarPrecipitation(userLocation.lat, userLocation.lon, '現在地GPS測位エリア', days, true);
            } else {
              const areaObj = riskCalculator.regionDatabase[selectedPref].areas[selectedAreaKey];
              fetchRadarPrecipitation(areaObj.lat, areaObj.lon, areaObj, days, false);
            }
          };

          useEffect(() => {
            const handleScroll = () => {
              setIsScrolled(window.scrollY > 20);
            };
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          useEffect(() => {
            if (!isSimRunning) return;
            const interval = setInterval(() => {
              setSimTime(prev => {
                const nextTime = prev + 1;
                setSimData(currentData => {
                  let rawSignal = 0.5 + Math.sin(nextTime * 0.2) * 0.08 + (Math.random() - 0.5) * 0.04;
                  let baseline = 0.5 + Math.sin(nextTime * 0.05) * 0.02;

                  if (simContext === 'INTENSE_EXERCISE') {
                    rawSignal = 0.82 + Math.sin(nextTime * 0.4) * 0.1 + (Math.random() - 0.5) * 0.08;
                    baseline = 0.78;
                  } else if (simContext === 'CRISIS') {
                    rawSignal = 0.05 + (Math.random() - 0.5) * 0.02;
                    baseline = 0.52;
                  }

                  const deviation = Math.abs(rawSignal - baseline);
                  const i_bio = Math.max(0, 1 - deviation * 2);
                  const e_pen = simContext === 'CRISIS' ? 0.95 : (simContext === 'INTENSE_EXERCISE' ? 0.45 : Math.max(deviation * 1.2, localRiskData.compositeEntropy * 0.8));
                  const c_stab = Math.max(0, 1 - e_pen * 0.8);
                  const m_mat = 0.85;
                  const isHighEffort = simContext === 'INTENSE_EXERCISE';
                  const overInterventionRisk = isHighEffort && e_pen > 0.4 ? 0.75 : 0.05;
                  const lambdaPenalty = 4.0;

                  const j_score = (1.0 * i_bio) + (1.0 * c_stab) + (0.5 * m_mat) - (2.0 * e_pen) - (lambdaPenalty * overInterventionRisk);

                  let stage = 'STAGE 0 (Normal)';
                  if (e_pen > 0.8 || i_bio < 0.25) {
                    stage = 'STAGE 2 (Hard Override)';
                  } else if (e_pen > 0.35 && !isHighEffort) {
                    stage = 'STAGE 1 (Soft Buffer)';
                  }

                  const newPoint = {
                    time: nextTime,
                    rawSignal: parseFloat(rawSignal.toFixed(3)),
                    baseline: parseFloat(baseline.toFixed(3)),
                    jScore: parseFloat(j_score.toFixed(3)),
                    ePen: parseFloat(e_pen.toFixed(3)),
                    stage
                  };

                  const updated = [...currentData, newPoint];
                  if (updated.length > 25) updated.shift();
                  return updated;
                });
                return nextTime;
              });
            }, 400);

            return () => clearInterval(interval);
          }, [isSimRunning, simContext, localRiskData]);

          const latestTelemetry = useMemo(() => {
            if (simData.length === 0) return { jScore: 0, stage: 'STAGE 0 (Normal)', ePen: 0 };
            return simData[simData.length - 1];
          }, [simData]);

          const handleFormSubmit = (e) => {
            e.preventDefault();
            setFormSubmitted(true);
            setTimeout(() => {
              setFormSubmitted(false);
              setFormData({ name: '', email: '', role: 'AutoDrive Engineer', message: '' });
            }, 5000);
          };

          return (
            <div className="min-h-screen bg-[#090D16] text-slate-100 font-sans selection:bg-amber-500/30 selection:text-amber-200 relative overflow-x-hidden">
              <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
                <div className="absolute -top-40 -left-40 w-96 h-96 bg-amber-600/10 rounded-full blur-[120px]" />
                <div className="absolute top-1/3 -right-40 w-[500px] h-[500px] bg-cyan-600/10 rounded-full blur-[150px]" />
                <div className="absolute -bottom-40 left-1/3 w-[600px] h-[600px] bg-indigo-600/10 rounded-full blur-[180px]" />
                <div className="absolute inset-0 bg-[linear-gradient(to_right,#ffffff05_1px,transparent_1px),linear-gradient(to_bottom,#ffffff05_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_0%,#000_70%,transparent_100%)]" />
              </div>

              <header className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${isScrolled ? 'bg-[#090D16]/85 backdrop-blur-md border-b border-slate-800/80 py-3 shadow-2xl' : 'bg-transparent py-5'}`}>
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
                  <div className="flex items-center space-x-3 cursor-pointer" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>
                    <div className="relative flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 p-[1px] shadow-lg shadow-amber-500/20">
                      <div className="w-full h-full bg-[#090D16] rounded-[11px] flex items-center justify-center">
                        <Heart className="w-5 h-5 text-amber-400 fill-amber-400/20 animate-pulse" />
                      </div>
                    </div>
                    <div>
                      <span className="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-amber-200 bg-clip-text text-transparent">
                        OpenLBOF
                      </span>
                      <span className="hidden sm:inline-block ml-2 text-xs px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-amber-400 font-mono">
                        OBC Public Commons
                      </span>
                    </div>
                  </div>

                  <nav className="hidden md:flex items-center space-x-8 text-sm font-medium text-slate-300">
                    <a href="#location-risk" className="hover:text-amber-400 transition-colors flex items-center gap-1.5 text-amber-300">
                      <MapPin className="w-4 h-4" /> 現在地リスク計算
                    </a>
                    <a href="#philosophy" className="hover:text-amber-400 transition-colors">哲学</a>
                    <a href="#math-core" className="hover:text-amber-400 transition-colors">数理モデル J</a>
                    <a href="#governance" className="hover:text-amber-400 transition-colors">評議会憲章</a>
                    <a href="#simulator" className="hover:text-amber-400 transition-colors flex items-center gap-1.5 text-cyan-400">
                      <Activity className="w-4 h-4 animate-spin-slow" /> ライブデモ
                    </a>
                  </nav>

                  <div className="flex items-center space-x-3">
                    <a 
                      href="https://github.com/open-bio-commons/openlbof-core" 
                      target="_blank" 
                      rel="noreferrer"
                      className="hidden sm:flex items-center space-x-2 px-3.5 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition-all hover:shadow-md"
                    >
                      <Code className="w-4 h-4 text-amber-400" />
                      <span>GitHub</span>
                    </a>
                    <a 
                      href="#community" 
                      className="flex items-center space-x-2 px-4 py-2 rounded-lg bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 text-xs font-bold transition-all transform hover:-translate-y-0.5 shadow-lg shadow-amber-500/25"
                    >
                      <span>OBCに参加</span>
                      <ChevronRight className="w-4 h-4" />
                    </a>
                  </div>
                </div>
              </header>

              <main className="relative z-10 pt-28">
                <section className="relative px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto pt-8 pb-16 md:pt-16 text-center">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-mono font-medium mb-8 backdrop-blur-sm shadow-inner">
                    <Sparkles className="w-3.5 h-3.5 text-amber-400" />
                    <span>Open Love-Based Objective Framework & Open Bio-Commons Council</span>
                  </div>

                  <h1 className="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight leading-[1.15] max-w-5xl mx-auto">
                    人間の脆弱性を肯定し、<br />
                    その尊厳と自律性を<br />
                    <span className="bg-gradient-to-r from-amber-300 via-amber-400 to-cyan-400 bg-clip-text text-transparent">
                      数学的に守り抜く全方位インフラ
                    </span>
                  </h1>

                  <p className="mt-8 text-lg sm:text-xl text-slate-300 max-w-3xl mx-auto font-normal leading-relaxed">
                    OpenLBOF は、加齢・パニック・災害・精神的過熱という不完全さを例外として排除せず、
                    目的関数 J を通じてシステム全体が優しく守護する、地球規模のオープンソース・パブリックコモンズです。
                  </p>

                  <div className="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4 max-w-md mx-auto">
                    <a 
                      href="#location-risk"
                      className="w-full sm:w-auto flex items-center justify-center gap-2 px-7 py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-sm shadow-xl shadow-amber-500/20 transition-all hover:scale-[1.02]"
                    >
                      <Navigation className="w-4 h-4" />
                      <span>現在地の危険リスクを診断</span>
                    </a>
                    <a 
                      href="#philosophy" 
                      className="w-full sm:w-auto flex items-center justify-center gap-2 px-7 py-3.5 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-slate-700/80 text-slate-200 font-semibold text-sm transition-all backdrop-blur-sm"
                    >
                      <FileText className="w-4 h-4 text-cyan-400" />
                      <span>マニフェスト全文を読破</span>
                    </a>
                  </div>
                </section>

                <section id="location-risk" className="py-16 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-t border-slate-800/60">
                  <div className="bg-gradient-to-r from-slate-900/90 via-slate-950 to-slate-900/90 border border-amber-500/30 rounded-2xl p-6 sm:p-10 backdrop-blur-xl shadow-2xl space-y-8 relative overflow-hidden">
                    <div className="absolute -right-20 -top-20 w-80 h-80 bg-amber-500/10 rounded-full blur-3xl pointer-events-none" />

                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 pb-6 border-b border-slate-800">
                      <div className="space-y-1">
                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-mono">
                          <Globe className="w-3.5 h-3.5 text-amber-400 animate-pulse" />
                          <span>Multi-Day Radar & Causal Pandemic Telemetry</span>
                          {isFetchingWeather && <span className="text-cyan-300 ml-1">(気象レーダー同期中...)</span>}
                        </div>
                        <h2 className="text-2xl sm:text-3xl font-bold text-white flex items-center gap-2">
                          現在地・詳細地域 冠水＆複合リスク算定モジュール
                        </h2>
                        <p className="text-xs sm:text-sm text-slate-400">
                          リアルタイム気象レーダーの降水量・排水能力・標高から「道路冠水・浸水確率」を算出し、Natech災害や2次避難所パンデミック確率と統合評価します
                        </p>
                      </div>

                      <div className="flex flex-wrap items-center gap-3 shrink-0">
                        <a
                          href={localRiskData.yahooRadarUrl}
                          target="_blank"
                          rel="noreferrer"
                          className="px-4 py-2.5 rounded-xl bg-cyan-950/80 hover:bg-cyan-900/80 border border-cyan-500/40 text-cyan-200 font-bold text-xs flex items-center gap-2 transition-all shadow-lg"
                        >
                          <CloudRain className="w-4 h-4 text-cyan-400" />
                          <span>Yahoo!雨雲レーダーで確認</span>
                          <ExternalLink className="w-3.5 h-3.5 opacity-75" />
                        </a>
                        <button
                          onClick={handleDetectLocation}
                          disabled={isLocating}
                          className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-bold text-xs flex items-center gap-2 transition-all shadow-lg shadow-amber-500/20 disabled:opacity-50"
                        >
                          <Navigation className={`w-4 h-4 ${isLocating ? 'animate-spin' : ''}`} />
                          <span>{isLocating ? '位置情報を測位中...' : '現在地GPSを取得して解析'}</span>
                        </button>
                      </div>
                    </div>

                    {locationError && (
                      <div className="p-3.5 rounded-xl bg-red-950/60 border border-red-700/50 text-red-200 text-xs flex items-center gap-2">
                        <AlertTriangle className="w-4 h-4 text-red-400 shrink-0" />
                        <span>{locationError}</span>
                      </div>
                    )}

                    {/* Step 1 & 2: 都道府県・詳細地域 ＆ 予測日数スライダー */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 p-5 rounded-xl bg-slate-950/70 border border-slate-800/80">
                      
                      {/* 都道府県＆詳細市区町村セレクタ (7 Cols) */}
                      <div className="lg:col-span-7 space-y-4">
                        <div className="space-y-2">
                          <div className="flex items-center justify-between text-xs text-slate-400 font-mono">
                            <span className="flex items-center gap-1.5 text-amber-300 font-semibold">
                              <MapPin className="w-3.5 h-3.5" /> 1. 都道府県を選択:
                            </span>
                            <span>対象: {userLocation ? 'GPS現在地' : riskCalculator.regionDatabase[selectedPref].pref}</span>
                          </div>
                          <div className="flex flex-wrap gap-1.5">
                            {Object.entries(riskCalculator.regionDatabase).map(([key, data]) => (
                              <button
                                key={key}
                                onClick={() => handlePrefChange(key)}
                                className={`px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all ${
                                  selectedPref === key && !userLocation
                                    ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md'
                                    : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-600'
                                }`}
                              >
                                {data.pref}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="space-y-2">
                          <div className="text-xs text-slate-400 font-mono">
                            2. 詳細地域・地形エリアを選択:
                          </div>
                          <div className="flex flex-wrap gap-2">
                            {Object.entries(riskCalculator.regionDatabase[selectedPref].areas).map(([aKey, aData]) => (
                              <button
                                key={aKey}
                                onClick={() => handleAreaChange(aKey)}
                                className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition-all text-left ${
                                  selectedAreaKey === aKey && !userLocation
                                    ? 'bg-cyan-500/20 text-cyan-200 border-cyan-500/60 shadow-inner'
                                    : 'bg-slate-900/80 text-slate-400 border-slate-800 hover:text-slate-200'
                                }`}
                              >
                                {aData.name}
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>

                      {/* 予測タイムフレーム（今後何日間か）コントロール (5 Cols) */}
                      <div className="lg:col-span-5 flex flex-col justify-between p-4 rounded-xl bg-slate-900/90 border border-slate-800 space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-semibold text-purple-300 flex items-center gap-1.5">
                            <Activity className="w-4 h-4 text-purple-400" />
                            3. 予測対象期間（タイムホライズン）
                          </span>
                          <span className="px-2.5 py-1 rounded-md bg-purple-950 border border-purple-500/40 text-purple-200 font-mono text-xs font-bold">
                            今後 {forecastDays} 日間
                          </span>
                        </div>

                        <div className="space-y-2">
                          <input
                            type="range"
                            min="1"
                            max="7"
                            value={forecastDays}
                            onChange={(e) => handleForecastDaysChange(Number(e.target.value))}
                            className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-purple-500"
                          />
                          <div className="flex justify-between text-[10px] font-mono text-slate-400">
                            <span>1日後 (急性期・豪雨)</span>
                            <span>4日後 (避難長期化)</span>
                            <span>7日後 (感染蔓延期)</span>
                          </div>
                        </div>

                        <p className="text-[11px] text-slate-400 leading-relaxed">
                          ※日数が経過するほど累積降水量が増加するとともに、避難所滞在の長期化による1人あたりスペース減少・換気低下で感染症確率が上昇します。
                        </p>
                      </div>
                    </div>

                    {/* Computed Risk Dashboard Cards (4 Main Metrics) */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                      <div className="p-5 rounded-xl bg-slate-950/80 border border-slate-800 space-y-2">
                        <div className="text-xs text-slate-400 font-mono flex items-center justify-between">
                          <span>合成リスク指数 (E_pen)</span>
                          <Activity className="w-4 h-4 text-amber-400" />
                        </div>
                        <div className="text-3xl font-black font-mono text-amber-400">
                          {localRiskData.compositeEntropy} <span className="text-xs font-normal text-slate-500">/ 1.00</span>
                        </div>
                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                          <div 
                            className="bg-gradient-to-r from-emerald-500 via-amber-500 to-red-500 h-full transition-all duration-500"
                            style={{ width: `${localRiskData.compositeEntropy * 100}%` }}
                          />
                        </div>
                        <p className="text-[11px] text-slate-400">今後{localRiskData.forecastDays}日間の総合環境負荷</p>
                      </div>

                      <div className="p-5 rounded-xl bg-slate-950/80 border border-cyan-500/40 space-y-2 shadow-lg shadow-cyan-950/20">
                        <div className="text-xs text-cyan-300 font-mono flex items-center justify-between">
                          <span>道路冠水・内水氾濫確率</span>
                          <CloudRain className="w-4 h-4 text-cyan-400" />
                        </div>
                        <div className="text-2xl font-bold font-mono text-cyan-300">
                          {localRiskData.inundationRisk}%
                        </div>
                        <p className="text-[11px] text-slate-400">
                          予測最大 {localRiskData.factors.peakHourlyRainMm}mm/h (排水基準 {localRiskData.factors.drainageCap}mm/h)
                        </p>
                      </div>

                      <div className="p-5 rounded-xl bg-slate-950/80 border border-slate-800 space-y-2">
                        <div className="text-xs text-slate-400 font-mono flex items-center justify-between">
                          <span>Natechプラント爆発確率</span>
                          <Flame className="w-4 h-4 text-red-400" />
                        </div>
                        <div className="text-2xl font-bold font-mono text-red-300">
                          {localRiskData.natechRisk}%
                        </div>
                        <p className="text-[11px] text-slate-400">冠水({localRiskData.inundationRisk}%)×工業集積({localRiskData.factors.industrialDensityPct}%)</p>
                      </div>

                      <div className="p-5 rounded-xl bg-slate-950/80 border border-purple-500/40 space-y-2 shadow-lg shadow-purple-950/20">
                        <div className="text-xs text-purple-300 font-mono flex items-center justify-between">
                          <span>避難所パンデミック確率</span>
                          <Users className="w-4 h-4 text-purple-400" />
                        </div>
                        <div className="text-2xl font-bold font-mono text-purple-300">
                          {localRiskData.outbreakRisk}%
                        </div>
                        <p className="text-[11px] text-slate-400">2次避難所面積 {localRiskData.factors.effectiveShelterSqm}㎡/人・換気{localRiskData.factors.ventilationRate}回/h</p>
                      </div>
                    </div>

                    {/* Causal Breakdown Panel: 確率算出の根拠となる環境・インフラ要因の内訳 */}
                    <div className="p-5 rounded-xl bg-slate-950/90 border border-slate-800 space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800/80 pb-3">
                        <h3 className="text-xs sm:text-sm font-bold text-slate-200 flex items-center gap-2">
                          <Sliders className="w-4 h-4 text-cyan-400" />
                          リスク算出の因果要因パラメータ内訳（今後 {localRiskData.forecastDays} 日間予測）
                        </h3>
                        <span className="text-[11px] font-mono text-slate-400">
                          対象: {localRiskData.areaName} (標高 {localRiskData.factors.elevation}m)
                        </span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                        {/* 要因1: 雨雲レーダー・降水量＆冠水判定 */}
                        <div className="p-3.5 rounded-lg bg-slate-900/80 border border-slate-800/80 space-y-2">
                          <div className="flex justify-between font-mono">
                            <span className="text-cyan-300 font-semibold">雨雲レーダー：降水量 ＆ 冠水負荷</span>
                            <span className="text-white font-bold">{localRiskData.factors.precipProbability}% ({localRiskData.factors.expectedRainfallMm}mm)</span>
                          </div>
                          <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                            <div className="bg-cyan-400 h-full" style={{ width: `${localRiskData.factors.precipProbability}%` }} />
                          </div>
                          <p className="text-[11px] text-slate-400 leading-relaxed">
                            現在雨量 {localRiskData.factors.liveHourlyRain}mm/h・今後{localRiskData.forecastDays}日間の累積雨量から、排水能力({localRiskData.factors.drainageCap}mm/h)超過による道路冠水・床下浸水確率を算出しています。
                          </p>

                        <div className="text-[11px] font-mono text-slate-400">介入ステージ</div>
                        <div className={`text-xs sm:text-sm font-bold font-mono mt-1 ${
                          latestTelemetry.stage?.includes('STAGE 2') ? 'text-rose-400' : 
                          latestTelemetry.stage?.includes('STAGE 1') ? 'text-amber-400' : 'text-emerald-400'
                        }`}>
                          {latestTelemetry.stage}
                        </div>
                      </div>
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400 font-medium text-amber-300">地域統合リスク (E_pen)</div>
                        <div className="text-xl font-bold font-mono mt-1 text-cyan-400">
                          {latestTelemetry.ePen}
                        </div>
                      </div>
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400">プライバシー</div>
                        <div className="text-xs font-bold font-mono mt-1 text-emerald-400 flex items-center gap-1">
                          <CheckCircle2 className="w-3.5 h-3.5" /> ローカル処理完結
                        </div>
                      </div>
                    </div>

                    <div className="h-64 sm:h-80 w-full mt-4">
                      <CustomLineChart data={simData} />
                    </div>
                  </div>
                </section>

                <section id="community" className="py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-t border-slate-800/60">
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                    <div className="lg:col-span-6 space-y-6">
                      <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-mono">
                        <Users className="w-3.5 h-3.5" /> Call for Contributors
                      </div>
                      <h2 className="text-3xl sm:text-4xl font-bold tracking-tight text-white">
                        共に「地域社会と人間の尊厳を守るインフラ」を創る仲間を募集
                      </h2>
                      <p className="text-slate-300 text-sm leading-relaxed">
                        OpenLBOF は、特定企業の製品ではなく、オープンな地域リスクデータとバイオシグナルを統合する地球規模のパブリックコモンズです。
                      </p>
                    </div>

                    <div className="lg:col-span-6 bg-slate-900/90 border border-slate-800 rounded-2xl p-6 sm:p-8 backdrop-blur-md shadow-2xl">
                      <h3 className="text-xl font-bold text-white mb-2">OBC 参画・お問い合わせ</h3>
                      {formSubmitted ? (
                        <div className="p-8 text-center space-y-4 bg-emerald-500/10 border border-emerald-500/30 rounded-xl">
                          <CheckCircle2 className="w-12 h-12 text-emerald-400 mx-auto" />
                          <h4 className="text-lg font-bold text-white">送信が完了しました</h4>
                        </div>
                      ) : (
                        <form onSubmit={handleFormSubmit} className="space-y-4">
                          <div>
                            <label className="block text-xs font-mono text-slate-300 mb-1.5">お名前 / Handle</label>
                            <input 
                              type="text" 
                              required
                              value={formData.name}
                              onChange={e => setFormData({ ...formData, name: e.target.value })}
                              placeholder="例: 山田 太郎" 
                              className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-mono text-slate-300 mb-1.5">メールアドレス</label>
                            <input 
                              type="email" 
                              required
                              value={formData.email}
                              onChange={e => setFormData({ ...formData, email: e.target.value })}
                              placeholder="name@domain.com" 
                              className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-mono text-slate-300 mb-1.5">メッセージ</label>
                            <textarea 
                              rows={4}
                              required
                              value={formData.message}
                              onChange={e => setFormData({ ...formData, message: e.target.value })}
                              placeholder="参画のご関心やご質問をご記入ください..." 
                              className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-amber-500 resize-none"
                            />
                          </div>
                          <button 
                            type="submit"
                            className="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-bold text-xs shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2"
                          >
                            <Send className="w-4 h-4" />
                            <span>送信してコミュニティに参加する</span>
                          </button>
                        </form>
                      )}
                    </div>
                  </div>
                </section>
              </main>

              <footer className="border-t border-slate-800/80 bg-[#060911] py-12 relative z-10">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-6">
                  <div className="flex items-center space-x-3">
                    <div className="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
                      <Heart className="w-4 h-4" />
                    </div>
                    <span className="text-sm font-bold text-slate-200">OpenLBOF / Open Bio-Commons Council</span>
                  </div>
                  <div className="text-xs text-slate-400 font-mono">
                    &copy; 2026 Open Bio-Commons Council (OBC).
                  </div>
                </div>
              </footer>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>

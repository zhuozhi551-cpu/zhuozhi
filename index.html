                          latestTelemetry.stage?.includes('STAGE 2') ? 'text-rose-400' : 
                          latestTelemetry.stage?.includes('STAGE 1') ? 'text-amber-400' : 'text-emerald-400'
                        }`}>
                          {latestTelemetry.stage}
                        </div>
                      </div>
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-amber-300">合成エントロピー (E_pen)</div>
                        <div className="text-xl font-bold font-mono mt-1 text-cyan-400">
                          {latestTelemetry.ePen}
                        </div>
                      </div>
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400">プライバシー保護</div>
                        <div className="text-xs font-bold font-mono mt-1 text-emerald-400 flex items-center gap-1">
                          <CheckCircle2 className="w-3.5 h-3.5" /> Local-First 完結
                        </div>
                      </div>
                    </div>

                    <div className="h-52 sm:h-64 w-full">
                      <CustomLineChart data={simData} />
                    </div>
                  </div>
                </section>

                {/* 5. ローカル完結型パーソナル＆ファミリー緊急SOSカード */}
                <section id="personal-sos" className="py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-t border-slate-800/60">
                  <div className="bg-slate-900/90 border border-emerald-500/30 rounded-2xl p-6 sm:p-8 backdrop-blur-xl shadow-2xl space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-5 border-b border-slate-800">
                      <div className="space-y-1">
                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs font-mono">
                          <Lock className="w-3.5 h-3.5 text-emerald-400" />
                          <span>Local-First Zero-Server Storage</span>
                        </div>
                        <h2 className="text-xl sm:text-2xl font-bold text-white">
                          マイ緊急SOS＆家族合流プロファイルカード
                        </h2>
                      </div>

                      <div className="flex flex-wrap gap-2 shrink-0">
                        <button
                          type="button"
                          onClick={handleCopyMedicalCard}
                          className="px-4 py-2.5 rounded-xl bg-rose-950/80 hover:bg-rose-900/80 border border-rose-500/40 text-rose-200 font-bold text-xs flex items-center gap-1.5 transition-all"
                        >
                          <PhoneCall className="w-4 h-4 text-rose-400" />
                          <span>{copiedMedicalMsg ? 'コピー完了!' : '救助隊・医療向けメモをコピー'}</span>
                        </button>
                        <button
                          type="button"
                          onClick={handleCopyFamilyShare}
                          className="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold text-xs flex items-center gap-1.5 transition-all"
                        >
                          <Copy className="w-4 h-4" />
                          <span>{copiedShareMsg ? 'コピー完了!' : '家族LINE/SMS用安否文を作成'}</span>
                        </button>
                      </div>
                    </div>

                    <form onSubmit={handleSaveSosProfile} className="grid grid-cols-1 md:grid-cols-3 gap-5">
                      <div className="space-y-3">
                        <input
                          type="text" value={sosProfile.userName}
                          onChange={(e) => setSosProfile({ ...sosProfile, userName: e.target.value })}
                          placeholder="お名前（ニックネーム可）"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                        />
                        <select
                          value={sosProfile.bloodType}
                          onChange={(e) => setSosProfile({ ...sosProfile, bloodType: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                        >
                          <option value="未設定">血液型：未設定</option>
                          <option value="A型 Rh+">A型 Rh+</option>
                          <option value="B型 Rh+">B型 Rh+</option>
                          <option value="O型 Rh+">O型 Rh+</option>
                          <option value="AB型 Rh+">AB型 Rh+</option>
                        </select>
                      </div>

                      <div>
                        <textarea
                          rows={3} value={sosProfile.medicalNotes}
                          onChange={(e) => setSosProfile({ ...sosProfile, medicalNotes: e.target.value })}
                          placeholder="持病・アレルギー・お薬手帳メモ"
                          className="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 resize-none"
                        />
                      </div>

                      <div className="space-y-3">
                        <input
                          type="text" value={sosProfile.meetingPoint}
                          onChange={(e) => setSosProfile({ ...sosProfile, meetingPoint: e.target.value })}
                          placeholder="家族の第一集合場所（高台など）"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                        />
                        <button
                          type="submit"
                          className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-emerald-500/40 text-emerald-300 font-bold text-xs transition-all"
                        >
                          {profileSavedToast ? '✓ 端末内に安全に保存しました' : '端末ブラウザ内に保存する（外部送信なし）'}
                        </button>
                      </div>
                    </form>
                  </div>
                </section>
              </main>

              <footer className="border-t border-slate-800/80 bg-[#060911] py-10 relative z-10">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div className="flex items-center space-x-2.5">
                    <Heart className="w-4 h-4 text-amber-400" />
                    <span className="text-sm font-bold text-slate-200">OpenLBOF / Open Bio-Commons Council</span>
                  </div>
                  <div className="text-xs text-slate-400 font-mono">
                    &copy; 2026 Open Bio-Commons Council (OBC) ・ Local-First Safety & Biosensor Infrastructure.
                  </div>
                </div>
              </footer>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>

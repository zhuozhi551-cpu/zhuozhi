<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLBOF | Human-Centric Safety Infrastructure</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f3f4f6; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
        .animate-pulse-slow { animation: pulse-slow 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-[#090d16] text-gray-100 min-h-screen selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Web Crypto API + IndexedDB ローカルセキュアストレージ ---
        class SecureEnclaveStore {
            constructor(dbName = "OpenLBOF_SecureDB", storeName = "feedback_history") {
                this.dbName = dbName;
                this.storeName = storeName;
                this.cryptoKey = null;
            }

            async init() {
                await this._initCryptoKey();
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, 1);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(this.storeName)) {
                            db.createObjectStore(this.storeName, { keyPath: "id", autoIncrement: true });
                        }
                    };
                });
            }

            async _initCryptoKey() {
                const keyStoreName = "encryption_meta";
                const db = await new Promise((resolve, reject) => {
                    const req = indexedDB.open(this.dbName + "_meta", 1);
                    req.onupgradeneeded = e => e.target.result.createObjectStore(keyStoreName);
                    req.onsuccess = e => resolve(e.target.result);
                    req.onerror = e => reject(e.target.error);
                });

                let rawKeyData = await new Promise((resolve) => {
                    const tx = db.transaction(keyStoreName, "readonly");
                    const req = tx.objectStore(keyStoreName).get("master_key");
                    req.onsuccess = () => resolve(req.result);
                });

                if (rawKeyData) {
                    this.cryptoKey = await window.crypto.subtle.importKey(
                        "raw", rawKeyData, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]
                    );
                } else {
                    this.cryptoKey = await window.crypto.subtle.generateKey(
                        { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]
                    );
                    const exported = await window.crypto.subtle.exportKey("raw", this.cryptoKey);
                    const tx = db.transaction(keyStoreName, "readwrite");
                    tx.objectStore(keyStoreName).put(exported, "master_key");
                }
            }

            async _encrypt(dataObj) {
                const jsonStr = JSON.stringify(dataObj);
                const encoded = new TextEncoder().encode(jsonStr);
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const ciphertext = await window.crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv }, this.cryptoKey, encoded
                );
                return {
                    iv: Array.from(iv),
                    ciphertext: Array.from(new Uint8Array(ciphertext))
                };
            }

            async _decrypt(encryptedData) {
                const iv = new Uint8Array(encryptedData.iv);
                const ciphertext = new Uint8Array(encryptedData.ciphertext);
                const decrypted = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv }, this.cryptoKey, ciphertext
                );
                return JSON.parse(new TextDecoder().decode(decrypted));
            }

            async saveRecord(recordType, payload) {
                const db = await this.init();
                const record = { timestamp: Date.now(), type: recordType, payload: payload };
                const encryptedPayload = await this._encrypt(record);
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(this.storeName, "readwrite");
                    const store = tx.objectStore(this.storeName);
                    const req = store.add({ encryptedData: encryptedPayload, timestamp: record.timestamp });
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }

            async getAllRecords() {
                const db = await this.init();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(this.storeName, "readonly");
                    const store = tx.objectStore(this.storeName);
                    const req = store.getAll();
                    req.onsuccess = async () => {
                        const encryptedItems = req.result;
                        const decryptedItems = [];
                        for (const item of encryptedItems) {
                            try {
                                const decrypted = await this._decrypt(item.encryptedData);
                                decryptedItems.push({ id: item.id, ...decrypted, rawEncrypted: item.encryptedData });
                            } catch (e) {
                                console.error("Failed to decrypt record:", e);
                            }
                        }
                        resolve(decryptedItems);
                    };
                    req.onerror = () => reject(req.error);
                });
            }
        }

        const enclaveStore = new SecureEnclaveStore();

        function App() {
            const [activeTab, setActiveTab] = useState('simulator');
            const [mode, setMode] = useState('normal');
            
            // センサー連動
            const [isMeasuring, setIsMeasuring] = useState(false);
            const [bpm, setBpm] = useState(72);
            const [hrv, setHrv] = useState(58);
            const [typingStability, setTypingStability] = useState(94.2);

            // 目的関数 J(t)
            const [jScore, setJScore] = useState(91.2);
            const [harmonyTerm, setHarmonyTerm] = useState(95.0);
            const [penaltyTerm, setPenaltyTerm] = useState(3.8);
            const [crisisTerm, setCrisisTerm] = useState(0.0);
            const [stage, setStage] = useState('STAGE_0_NORMAL (定常見守り)');

            // Meta-LBOF セキュア暗号化ストレージ状態
            const [userComment, setUserComment] = useState('');
            const [weightAdjustment, setWeightAdjustment] = useState('0.0');
            const [localLogs, setLocalLogs] = useState([]);
            const [isSaving, setIsSaving] = useState(false);

            const loadLogs = async () => {
                try {
                    const records = await enclaveStore.getAllRecords();
                    setLocalLogs(records.reverse());
                } catch (e) {
                    console.error(e);
                }
            };

            useEffect(() => {
                loadLogs();
            }, []);

            useEffect(() => {
                let baseHarmony = 90.0;
                let penalty = 3.0;
                let crisis = 0.0;
                let currentStageText = 'STAGE_0_NORMAL (定常見守り)';

                if (mode === 'normal') {
                    baseHarmony = 92.0;
                    penalty = 2.5;
                    crisis = 0.0;
                    currentStageText = 'STAGE_0_NORMAL (定常見守り)';
                } else if (mode === 'intense') {
                    baseHarmony = 78.0 - (75 - hrv) * 0.4;
                    penalty = 5.0;
                    crisis = 10.0;
                    currentStageText = 'STAGE_1_SOFT_BUFFER (意図確認バッファ)';
                } else if (mode === 'crisis') {
                    baseHarmony = 40.0;
                    penalty = 0.0;
                    crisis = 65.0;
                    currentStageText = 'STAGE_2_HARD_OVERRIDE (緊急退避・保護)';
                }

                if (isMeasuring) {
                    if (bpm > 90 || hrv < 45) {
                        baseHarmony -= 8;
                        penalty += 4;
                    }
                }

                const calculatedJ = Math.max(0, Math.min(100, (baseHarmony * 1.0) - (penalty * 0.8) - (crisis * 0.5)));

                setHarmonyTerm(Math.round(baseHarmony * 10) / 10);
                setPenaltyTerm(Math.round(penalty * 10) / 10);
                setCrisisTerm(Math.round(crisis * 10) / 10);
                setJScore(Math.round(calculatedJ * 10) / 10);
                setStage(currentStageText);
            }, [mode, isMeasuring, bpm, hrv]);

            useEffect(() => {
                let interval;
                if (isMeasuring) {
                    interval = setInterval(() => {
                        setBpm(prev => Math.floor(70 + Math.random() * 22));
                        setHrv(prev => Math.floor(40 + Math.random() * 25));
                        setTypingStability(prev => Math.max(70, Math.min(99, prev + (Math.random() * 4 - 2))));
                    }, 1500);
                }
                return () => clearInterval(interval);
            }, [isMeasuring]);

            // 暗号化フィードバックの保存処理
            const handleSaveFeedback = async (e) => {
                e.preventDefault();
                if (!userComment.trim()) return;
                setIsSaving(true);
                await enclaveStore.saveRecord("META_LBOF_TUNE", {
                    comment: userComment,
                    betaAdjustment: parseFloat(weightAdjustment),
                    currentJScore: jScore,
                    currentMode: mode
                });
                setUserComment('');
                await loadLogs();
                setIsSaving(false);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="border-b border-gray-800 bg-[#0d1322]/85 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center space-x-3">
                            <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-bold text-black text-lg">Ω</div>
                            <span className="font-bold text-xl tracking-wider text-white">OpenLBOF</span>
                            <span className="text-xs px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">OBC Official</span>
                        </div>
                        <nav className="hidden md:flex space-x-8 text-sm font-medium text-gray-300">
                            <button onClick={() => setActiveTab('simulator')} className={`hover:text-cyan-400 transition ${activeTab === 'simulator' ? 'text-cyan-400 font-bold border-b-2 border-cyan-400 pb-1' : ''}`}>シミュレーター</button>
                            <button onClick={() => setActiveTab('biosensor')} className={`hover:text-cyan-400 transition ${activeTab === 'biosensor' ? 'text-cyan-400 font-bold border-b-2 border-cyan-400 pb-1' : ''}`}>バイオセンサーエンジン</button>
                            <button onClick={() => setActiveTab('metalbof')} className={`hover:text-cyan-400 transition ${activeTab === 'metalbof' ? 'text-cyan-400 font-bold border-b-2 border-cyan-400 pb-1' : ''}`}>Meta-LBOF (暗号化ストレージ)</button>
                            <button onClick={() => setActiveTab('architecture')} className={`hover:text-cyan-400 transition ${activeTab === 'architecture' ? 'text-cyan-400 font-bold border-b-2 border-cyan-400 pb-1' : ''}`}>アーキテクチャ</button>
                            <button onClick={() => setActiveTab('constitution')} className={`hover:text-cyan-400 transition ${activeTab === 'constitution' ? 'text-cyan-400 font-bold border-b-2 border-cyan-400 pb-1' : ''}`}>憲法コード</button>
                        </nav>
                        <a href="https://github.com" target="_blank" rel="noreferrer" className="text-xs bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg border border-gray-700 transition">
                            GitHub Repository
                        </a>
                    </header>

                    {/* Hero Section */}
                    <section className="px-6 py-10 md:py-12 max-w-6xl mx-auto text-center">
                        <div className="inline-block mb-3 px-4 py-1.5 rounded-full bg-indigo-950/80 border border-indigo-800/60 text-indigo-300 text-xs font-semibold tracking-wide uppercase">
                            Open Bio-Commons Council (OBC) Governing
                        </div>
                        <h1 className="text-4xl md:text-5xl font-extrabold tracking-tight text-white mb-4 leading-tight">
                            人間の脆弱性を包摂し、<br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-purple-400">尊厳と自律性を守る</span>安全インフラ
                        </h1>
                        <p className="text-lg md:text-xl text-gray-300 max-w-3xl mx-auto leading-relaxed">
                            Web Crypto API + IndexedDB による完全ローカル暗号化ストレージ対応。生体データとメタフィードバックは端末外へ一切送出されません。
                        </p>
                    </section>

                    {/* メインコンテンツ */}
                    <main className="flex-grow max-w-6xl mx-auto w-full px-6 pb-16">
                        
                        {/* 1. シミュレーター タブ */}
                        {activeTab === 'simulator' && (
                            <section className="w-full space-y-6">
                                <div className="bg-[#111827] border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 pb-6 border-b border-gray-800">
                                        <div>
                                            <h2 className="text-2xl font-bold text-white mb-1">Live Evaluation Engine & センサー連動</h2>
                                            <p className="text-sm text-gray-400">目的関数 J(t) = α·H - β·P - γ·C のリアルタイム数理演算</p>
                                        </div>
                                        <div className="mt-4 md:mt-0 flex space-x-2">
                                            <button onClick={() => setMode('normal')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${mode === 'normal' ? 'bg-cyan-600 text-white' : 'bg-gray-800 text-gray-400'}`}>定常状態</button>
                                            <button onClick={() => setMode('intense')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${mode === 'intense' ? 'bg-amber-600 text-white' : 'bg-gray-800 text-gray-400'}`}>高負荷運動</button>
                                            <button onClick={() => setMode('crisis')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${mode === 'crisis' ? 'bg-rose-600 text-white' : 'bg-gray-800 text-gray-400'}`}>突発的危機</button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                        <div className="bg-[#0b101b] p-6 rounded-xl border border-gray-800 flex flex-col justify-between">
                                            <span className="text-xs text-gray-400 uppercase tracking-wider font-semibold">目的関数スコア J(t)</span>
                                            <div className="text-4xl font-mono font-bold text-cyan-400 my-4">
                                                {jScore.toFixed(1)} <span className="text-sm text-gray-500">/ 100</span>
                                            </div>
                                            <div className="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                                                <div className="bg-cyan-500 h-full transition-all duration-500" style={{ width: `${jScore}%` }}></div>
                                            </div>
                                        </div>

                                        <div className="bg-[#0b101b] p-6 rounded-xl border border-gray-800 flex flex-col justify-between">
                                            <span className="text-xs text-gray-400 uppercase tracking-wider font-semibold">フェイルセーフステージ</span>
                                            <div className="text-base font-bold text-white my-4 font-mono">{stage}</div>
                                            <span className="text-xs text-gray-500">Local Secure Enclave 処理</span>
                                        </div>

                                        <div className="bg-[#0b101b] p-6 rounded-xl border border-gray-800 flex flex-col justify-between">
                                            <span className="text-xs text-gray-400 uppercase tracking-wider font-semibold">数理モデル各項の内訳</span>
                                            <div className="my-3 space-y-1 text-xs font-mono">
                                                <div className="flex justify-between text-gray-300">
                                                    <span>α·調和項 H:</span>
                                                    <span className="text-cyan-400">+{harmonyTerm}</span>
                                                </div>
                                                <div className="flex justify-between text-gray-300">
                                                    <span>β·過剰介入ペナルティ P:</span>
                                                    <span className="text-amber-400">-{penaltyTerm}</span>
                                                </div>
                                                <div className="flex justify-between text-gray-300">
                                                    <span>γ·危機管理 C:</span>
                                                    <span className="text-rose-400">-{crisisTerm}</span>
                                                </div>
                                            </div>
                                            <span className="text-xs text-gray-500">動的ウェイトバランス適用中</span>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}

                        {/* 2. バイオセンサーエンジン タブ */}
                        {activeTab === 'biosensor' && (
                            <section className="w-full space-y-8">
                                <div className="bg-[#111827] border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl">
                                    <h2 className="text-3xl font-bold text-white mb-2">完全オープン＆汎用バイオセンサーエンジン</h2>
                                    <p className="text-gray-400 text-base leading-relaxed mb-6">
                                        スマホカメラPPG（脈波）やタイピング挙動データをローカル環境で安全に計測し、スコア J(t) へ動的反映します。
                                    </p>
                                    <div className="bg-[#0b101b] border border-gray-800 rounded-xl p-6">
                                        <button 
                                            onClick={() => setIsMeasuring(!isMeasuring)}
                                            className={`w-full py-3 rounded-lg text-xs font-bold transition ${isMeasuring ? 'bg-rose-600 text-white' : 'bg-cyan-600 text-black'}`}>
                                            {isMeasuring ? 'カメラ計測を停止' : 'スマホカメラPPG計測をテスト (J(t)へ連動)'}
                                        </button>
                                        <div className="mt-4 font-mono text-xs text-cyan-400">
                                            STATUS: {isMeasuring ? `計測中 (BPM: ${bpm} / HRV: ${hrv}ms)` : '待機中'}
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}

                        {/* 3. Meta-LBOF (暗号化ストレージ) タブ */}
                        {activeTab === 'metalbof' && (
                            <section className="w-full space-y-8">
                                <div className="bg-[#111827] border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl">
                                    <div className="mb-6 pb-6 border-b border-gray-800">
                                        <div className="inline-block px-3 py-1 bg-purple-950 border border-purple-800 text-purple-300 rounded-full text-xs font-semibold mb-3">
                                            Web Crypto API (AES-GCM-256) + IndexedDB
                                        </div>
                                        <h2 className="text-3xl font-bold text-white mb-2">Meta-LBOF セキュア暗号化ストレージ</h2>
                                        <p className="text-gray-400 text-sm leading-relaxed">
                                            ユーザーの自然言語フィードバックとパラメータ調整要求を、ブラウザのハードウェアアクセラレーション機能で AES-GCM 256-bit 暗号化してローカルに書き込みます。
                                        </p>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        {/* 入力フォーム */}
                                        <form onSubmit={handleSaveFeedback} className="bg-[#0b101b] border border-gray-800 p-6 rounded-xl space-y-4">
                                            <h3 className="text-lg font-bold text-cyan-400">愛のクオリア・チューニング入力</h3>
                                            <div>
                                                <label className="block text-xs text-gray-400 mb-1">感度・介入調整フィードバック</label>
                                                <textarea 
                                                    rows="3"
                                                    value={userComment}
                                                    onChange={(e) => setUserComment(e.target.value)}
                                                    placeholder="例: 最近少し過敏すぎる気がする。過剰介入ペナルティβの重みを増して自律性を尊重してほしい。"
                                                    className="w-full bg-[#070a12] border border-gray-800 rounded-lg p-3 text-xs text-white focus:outline-none focus:border-cyan-500"
                                                ></textarea>
                                            </div>
                                            <div>
                                                <label className="block text-xs text-gray-400 mb-1">過剰介入ペナルティ β 補正値</label>
                                                <select 
                                                    value={weightAdjustment} 
                                                    onChange={(e) => setWeightAdjustment(e.target.value)}
                                                    className="w-full bg-[#070a12] border border-gray-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-cyan-500">
                                                    <option value="+0.5">＋0.5 (より慎重に・お節介を抑える)</option>
                                                    <option value="0.0">0.0 (現在のバランスを維持)</option>
                                                    <option value="-0.5">－0.5 (見守り・保護介入を強める)</option>
                                                </select>
                                            </div>
                                            <button 
                                                type="submit" 
                                                disabled={isSaving}
                                                className="w-full py-2.5 bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white font-bold text-xs rounded-lg transition shadow-lg">
                                                {isSaving ? '暗号化書き込み中...' : 'ローカルSecure Enclaveへ暗号化保存'}
                                            </button>
                                        </form>

                                        {/* 復号ログ一覧 */}
                                        <div className="bg-[#0b101b] border border-gray-800 p-6 rounded-xl flex flex-col justify-between">
                                            <div>
                                                <div className="flex justify-between items-center mb-4">
                                                    <h3 className="text-lg font-bold text-purple-400">復号化ログ (IndexedDB)</h3>
                                                    <span className="text-xs bg-purple-950 text-purple-300 border border-purple-800 px-2 py-0.5 rounded">件数: {localLogs.length}</span>
                                                </div>
                                                <div className="space-y-3 max-h-72 overflow-y-auto pr-2">
                                                    {localLogs.length === 0 ? (
                                                        <div className="text-xs text-gray-500 text-center py-8">保存された暗号化ログはありません</div>
                                                    ) : (
                                                        localLogs.map((log) => (
                                                            <div key={log.id} className="bg-[#070a12] border border-gray-800 p-3 rounded-lg text-xs space-y-1">
                                                                <div className="flex justify-between text-gray-500 font-mono text-[10px]">
                                                                    <span>{new Date(log.timestamp).toLocaleString()}</span>
                                                                    <span className="text-cyan-400">ID: #{log.id}</span>
                                                                </div>
                                                                <div className="text-gray-200 font-medium">"{log.payload?.comment}"</div>
                                                                <div className="text-[11px] text-purple-400 font-mono">
                                                                    β補正: {log.payload?.betaAdjustment} | 保存時J(t): {log.payload?.currentJScore}
                                                                </div>
                                                            </div>
                                                        ))
                                                    )}
                                                </div>
                                            </div>
                                            <div className="mt-4 pt-3 border-t border-gray-800/80 text-[11px] text-gray-500 flex items-center justify-between">
                                                <span>🔒 暗号キー: AES-GCM (端末内保管)</span>
                                                <button onClick={loadLogs} className="text-cyan-400 hover:underline">再読み込み</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}

                        {/* 4. アーキテクチャ タブ */}
                        {activeTab === 'architecture' && (
                            <section className="bg-[#111827] border border-gray-800 rounded-2xl p-8 shadow-2xl">
                                <h2 className="text-2xl font-bold text-white mb-4">システム・アーキテクチャ</h2>
                                <p className="text-gray-400 text-sm leading-relaxed">
                                    生体センサー、決定論的フェイルセーフ層、ローカルSecure Enclave（Web Crypto + IndexedDB）、Meta-LBOF学習エージェントの4層構造。
                                </p>
                            </section>
                        )}

                        {/* 5. 憲法コード タブ */}
                        {activeTab === 'constitution' && (
                            <section className="bg-[#111827] border border-gray-800 rounded-2xl p-8 shadow-2xl">
                                <h2 className="text-2xl font-bold text-white mb-4">Bio-Commons 憲法コード (Constitution Code)</h2>
                                <p className="text-gray-400 text-sm leading-relaxed">
                                    過剰介入を抑制し、緊急危機のみオーバーライドを認めるコード化された倫理原則。
                                </p>
                            </section>
                        )}

                    </main>

                    {/* Footer */}
                    <footer className="mt-auto border-t border-gray-800 py-8 px-6 text-center text-sm text-gray-500">
                        <p>&copy; 2026 Open Bio-Commons Council (OBC) & OpenLBOF Contributors. Licensed under AGPL-3.0.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
